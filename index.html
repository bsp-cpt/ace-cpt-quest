om stability to mobility: first activation and endurance with neutral spine (abdominal drawing-in, dead bug, bird dog, plank, side bridge), then integrated multiplanar movement, and finally loaded and fast movement. Abdominal bracing, co-contracting all core muscles as if preparing for a punch, increases spinal stiffness under heavy load. McGill's \"big three\" are the modified curl-up, side bridge, and bird dog, chosen to build endurance with low spinal load. Core endurance, more than strength, is linked to back health. **Exam tip: Train core endurance and stability first (dead bug, bird dog, plank, side bridge) before loaded or fast trunk movements.**"}, {"h": "Balance training", "b": "Balance relies on three sensory systems: vision, the vestibular system of the inner ear, and somatosensory or proprioceptive input from the feet and joints. Training challenges these systems progressively: start with a wide, stable base and eyes open; then narrow the base (tandem, single-leg); then add head turns, arm movements, or reaching; then reduce visual input (eyes closed) and add unstable surfaces such as foam pads. Static balance is maintaining position while still; dynamic balance is maintaining control while moving. Balance training reduces fall risk in older adults, who should train balance about 3 or more days per week with a nearby support for safety. Unstable-surface training is not ideal for maximal strength because it reduces the load that can be lifted. **Exam tip: Progress balance by narrowing the base of support, then reducing vision and adding unstable surfaces, keeping a support nearby for older adults.**"}, {"h": "Skill-related fitness components", "b": "Fitness has health-related components (cardiorespiratory endurance, muscular strength, muscular endurance, flexibility, and body composition) and skill-related components. The six skill-related components are agility (rapidly changing direction while controlling the body), balance, coordination (integrating senses and body parts to move smoothly), power (the ability to produce force quickly), reaction time (the time between a stimulus and the start of a response), and speed (the ability to move quickly from one point to another). Skill-related components are trained through speed, agility, and quickness (SAQ) drills, plyometrics, and sport-specific practice. In ACE's model they belong to the later performance phase, after a client has a solid base of stability, mobility, and strength. **Exam tip: The six skill-related components are agility, balance, coordination, power, reaction time, and speed.**"}, {"h": "Power and plyometrics", "b": "Power equals force times velocity, or work divided by time. Plyometrics exploit the stretch-shortening cycle, which has three phases: the eccentric (loading) phase that stretches the muscle and stores elastic energy, the amortization phase (the brief transition, which should be as short as possible), and the concentric (unloading) phase that releases the stored energy for a more powerful contraction. A long amortization phase loses the stored energy as heat. Before plyometrics, clients need adequate strength, stability, and landing mechanics; a traditional guideline is the ability to squat about 1.5 times body weight for advanced lower-body plyometrics, though low-level drills need far less. Progress from low-intensity (jumping in place, skipping) to high-intensity (depth jumps), with full recovery between sets and only 2 to 3 sessions weekly, never on consecutive days for the same body region. **Exam tip: The amortization phase is the transition between eccentric loading and concentric push-off and should be as short as possible.**"}, {"h": "Speed, agility, and quickness (SAQ) drills", "b": "SAQ training uses drills such as ladder footwork, cone drills (T-test, pro agility 5-10-5), shuttle runs, and reactive drills that respond to a coach's signal. Good technique comes first: an athletic stance, short ground-contact times, arm drive, and lowering the center of gravity before changing direction. Work bouts are brief and intense, usually 5 to 10 seconds or less, relying mainly on the phosphagen system, so work-to-rest ratios of about 1:12 to 1:20 allow quality repetitions. SAQ drills belong early in a session when the client is fresh, after a thorough dynamic warm-up, and never when fatigued, which increases injury risk. For general clients, SAQ can add fun and athletic function, but only after stability and strength foundations exist. **Exam tip: Perform SAQ and plyometric drills early in a session, after a dynamic warm-up and while the client is fresh, with long rest intervals.**"}, {"h": "Training athletes and periodization for performance", "b": "Athletes typically follow periodized plans with a macrocycle (often a year), mesocycles (weeks to months), and microcycles (usually a week). Phases usually move from general preparation with higher volume and lower intensity, to specific preparation and competition with lower volume and higher intensity, then active rest or transition. Linear periodization progresses steadily across mesocycles, while undulating (nonlinear) periodization varies intensity and volume within the week. Tapering reduces training volume before competition while maintaining intensity to maximize performance. Trainers working with athletes coordinate with coaches, respect sport-specific demands, and use needs analysis: the sport's movements, energy systems, and common injuries. **Exam tip: A taper reduces training volume before competition while maintaining intensity.**"}], "qs": [{"q": "The phase of the stretch-shortening cycle that should be as short as possible is the:", "o": ["Eccentric phase", "Amortization phase", "Concentric phase", "Recovery phase"], "a": 1, "e": "A long amortization phase dissipates stored elastic energy."}, {"q": "Which is a skill-related (not health-related) fitness component?", "o": ["Body composition", "Flexibility", "Reaction time", "Muscular endurance"], "a": 2, "e": "Reaction time is skill-related."}, {"q": "Power is best described as:", "o": ["Force times velocity", "Mass times distance", "Strength divided by time", "Work times mass"], "a": 0, "e": "Power = force × velocity (or work ÷ time)."}, {"q": "A client has mastered single-leg stance on the floor with eyes open. The best next progression is:", "o": ["Single-leg stance with eyes closed or head turns", "Max deadlift", "Seated rest", "Wider stance"], "a": 0, "e": "Reducing visual input or adding movement progresses balance."}, {"q": "Which group of exercises makes up McGill's \"big three\"?", "o": ["Crunch, sit-up, Russian twist", "Modified curl-up, side bridge, bird dog", "Deadlift, squat, bench", "Leg raise, V-up, hanging knee raise"], "a": 1, "e": "They build core endurance with low spinal load."}, {"q": "When should agility drills be placed in a session?", "o": ["At the end when fatigued", "Early, after a dynamic warm-up", "Instead of a warm-up", "Only on rest days"], "a": 1, "e": "Do them fresh to protect technique and reduce injury risk."}, {"q": "The vestibular system contributes to balance from:", "o": ["The inner ear", "The eyes", "The skin of the feet", "The quadriceps"], "a": 0, "e": "The vestibular apparatus sits in the inner ear."}, {"q": "Before a competition, an athlete reduces training volume while keeping intensity. This is called:", "o": ["Detraining", "Tapering", "Overreaching", "Deconditioning"], "a": 1, "e": "Tapering maximizes performance for competition."}, {"q": "Which drill sequence shows an appropriate plyometric progression?", "o": ["Depth jumps, then jumping in place", "Jumping in place, then box jumps, then depth jumps", "Depth jumps on day one", "Single-leg bounds before squats"], "a": 1, "e": "Progress from low- to high-intensity drills."}, {"q": "Brief maximal agility bouts of about 5-10 seconds rely mainly on the:", "o": ["Phosphagen (ATP-PC) system", "Oxidative system", "Fat oxidation", "Ketone system"], "a": 0, "e": "Very short maximal efforts use ATP-PC, requiring long rests."}]}, {"title": "Training Adaptations & Test Safety", "icon": "📈", "cards": [{"h": "Acute responses versus chronic adaptations", "b": "Acute responses happen during a single session: heart rate, stroke volume, cardiac output, breathing rate, and systolic blood pressure rise with intensity, while diastolic pressure stays about the same or falls slightly in aerobic exercise. Chronic adaptations develop over weeks of training. Aerobic training lowers resting and submaximal heart rate, increases stroke volume and maximal cardiac output, raises VO2max, increases capillary and mitochondrial density, and improves fat use at a given workload. Resistance training increases strength first through neural adaptations (better motor-unit recruitment and firing rate, usually in the first 4 to 8 weeks), then through hypertrophy, an increase in muscle-fiber cross-sectional area. Both forms improve bone density, insulin sensitivity, and blood lipids. **Exam tip: Early strength gains in the first weeks come mainly from neural adaptations, not muscle growth.**"}, {"h": "Training principles", "b": "Key principles govern adaptations. Specificity, also known as the SAID principle (Specific Adaptations to Imposed Demands), means the body adapts to the exact type of stress applied. Progressive overload means the stimulus must gradually increase to keep improving. Reversibility (detraining) means fitness gains are lost when training stops; aerobic fitness declines noticeably within about 2 to 4 weeks. Individuality means people respond differently to the same program because of genetics, age, and fitness history. Diminishing returns means highly trained people improve more slowly than beginners. Variation (periodization) prevents plateaus and staleness. Recovery is required for adaptation, because the body adapts between sessions, not during them. **Exam tip: The SAID principle means the body adapts specifically to the demands placed on it, so training must match the goal.**"}, {"h": "Overreaching, overtraining, and DOMS", "b": "Functional overreaching is a short-term planned increase in training stress that causes a temporary drop in performance followed by improvement after recovery. If heavy training continues without enough recovery, nonfunctional overreaching and eventually overtraining syndrome can develop, with performance decline lasting weeks to months. Signs include persistent fatigue, elevated resting heart rate, disturbed sleep, mood changes, loss of motivation, frequent illness, and decreasing performance despite training. The solution is rest and reduced load, not more training. Delayed-onset muscle soreness (DOMS) is different: it peaks about 24 to 72 hours after unfamiliar or eccentric-heavy exercise and resolves on its own. Light activity can ease DOMS, and gradual progression helps prevent it. **Exam tip: A rising resting heart rate, poor sleep, and declining performance despite training suggest overtraining; the fix is rest.**"}, {"h": "When to stop an exercise test", "b": "ACSM lists general indications for stopping an exercise test in low-risk adults. Stop if the client shows: onset of angina or angina-like symptoms; a drop in systolic blood pressure of 10 mmHg or more with an increase in workload, or systolic pressure that fails to rise; an excessive rise in blood pressure (systolic above 250 mmHg or diastolic above 115 mmHg); shortness of breath, wheezing, leg cramps, or claudication; signs of poor perfusion such as light-headedness, confusion, ataxia, pallor, cyanosis, nausea, or cold, clammy skin; failure of heart rate to rise with increased intensity; a noticeable change in heart rhythm; physical or verbal signs of severe fatigue; equipment failure; or the client's request to stop. **Exam tip: Stop a test if systolic pressure drops 10 mmHg or more as workload rises, or if blood pressure exceeds 250/115 mmHg.**"}, {"h": "Exercise blood pressure responses", "b": "Normal blood-pressure responses guide safe testing and training. During aerobic exercise, systolic pressure rises roughly 8 to 12 mmHg per MET of workload, while diastolic pressure stays the same or falls slightly. After exercise, post-exercise hypotension can lower blood pressure for several hours, which is a benefit for people with hypertension. During heavy resistance exercise, especially with breath holding, both systolic and diastolic pressures can spike very high. The Valsalva maneuver, forced exhalation against a closed airway, raises intrathoracic pressure, reduces venous return, and can cause a sudden rise and then fall in blood pressure, dizziness, or fainting. Clients, especially those with hypertension or cardiovascular disease, should exhale during the exertion phase and avoid breath holding. **Exam tip: Coach clients to exhale on exertion and avoid the Valsalva maneuver, especially if they have hypertension.**"}, {"h": "Cardiorespiratory concepts for testing", "b": "Ventilatory threshold 1 (VT1) is the intensity where breathing first increases disproportionately to oxygen use; the client can still talk, but not comfortably. It is identified with the talk test. Ventilatory threshold 2 (VT2) corresponds roughly to the lactate threshold-like point where speaking becomes very difficult; it can be estimated with a VT2 threshold test lasting about 15 to 20 minutes. VO2max is the maximal rate of oxygen consumption, measured in mL/kg/min, and is the gold standard of aerobic fitness. One MET equals about 3.5 mL/kg/min of oxygen at rest. Submaximal tests such as the YMCA bike test, Rockport walk, and step tests estimate VO2max from heart rate responses; they assume a linear heart-rate-to-workload relationship, so medications like beta-blockers invalidate them. **Exam tip: One MET equals about 3.5 mL of oxygen per kg per minute; VT1 is found with the talk test.**"}], "qs": [{"q": "Strength gains in the first 4-8 weeks of resistance training are mainly due to:", "o": ["Hypertrophy", "Neural adaptations", "Increased bone density", "Fat loss"], "a": 1, "e": "Improved motor-unit recruitment and firing explain early gains."}, {"q": "Which is a chronic adaptation to aerobic training?", "o": ["Higher resting heart rate", "Increased stroke volume", "Lower VO2max", "Fewer mitochondria"], "a": 1, "e": "Aerobic training increases stroke volume and lowers resting HR."}, {"q": "A client stops training for a month and loses aerobic fitness. Which principle does this illustrate?", "o": ["Reversibility", "Specificity", "Individuality", "Overload"], "a": 0, "e": "Reversibility (detraining): gains are lost when training stops."}, {"q": "A client's performance declines for weeks, resting heart rate has risen, and sleep is poor despite hard training. The best recommendation is:", "o": ["Increase training volume", "Reduce training and add rest", "Add a second daily session", "Ignore it"], "a": 1, "e": "These are signs of overtraining; rest is the fix."}, {"q": "DOMS typically peaks:", "o": ["Immediately during exercise", "24-72 hours after exercise", "1 week later", "Only after aerobic exercise"], "a": 1, "e": "DOMS peaks 1 to 3 days after unfamiliar or eccentric work."}, {"q": "During a submaximal treadmill test, a client's systolic pressure drops 12 mmHg as the workload increases. What should you do?", "o": ["Increase speed", "Stop the test", "Ignore it", "Continue to max"], "a": 1, "e": "A drop of 10 mmHg or more with rising workload is a termination criterion."}, {"q": "Which blood pressure during exercise testing indicates stopping?", "o": ["150/80", "180/85", "260/100", "140/70"], "a": 2, "e": "Systolic above 250 or diastolic above 115 means stop."}, {"q": "During steady aerobic exercise, diastolic blood pressure normally:", "o": ["Rises sharply", "Stays about the same or decreases slightly", "Doubles", "Drops to zero"], "a": 1, "e": "Systolic rises; diastolic stays steady or drops slightly."}, {"q": "One MET is approximately:", "o": ["1.5 mL/kg/min", "3.5 mL/kg/min", "10 mL/kg/min", "35 mL/kg/min"], "a": 1, "e": "One MET equals about 3.5 mL O2/kg/min."}, {"q": "Why is a heart-rate-based submaximal test invalid for a client on beta-blockers?", "o": ["Beta-blockers increase heart rate", "They blunt the heart-rate response to exercise", "They raise VO2max", "They cause dehydration"], "a": 1, "e": "Beta-blockers lower heart rate, breaking the HR-workload relationship."}]}, {"title": "Heart Disease Risk Factors & Medications", "icon": "❤️", "cards": [{"h": "ACSM atherosclerotic cardiovascular disease risk factors I", "b": "Trainers screen for positive risk factors that raise cardiovascular disease risk. Age: men 45 years or older, women 55 years or older. Family history: heart attack, coronary revascularization, or sudden death before age 55 in a father or other male first-degree relative, or before age 65 in a mother or other female first-degree relative. Cigarette smoking: current smoker, quit within the previous 6 months, or exposure to environmental tobacco smoke. Physical inactivity: not meeting at least 30 minutes of moderate-intensity activity on at least 3 days per week for at least 3 months. Obesity: body mass index of 30 or higher, or a waist circumference greater than 102 cm (40 inches) for men or 88 cm (35 inches) for women. **Exam tip: Family history counts only if a male first-degree relative had an event before 55 or a female first-degree relative before 65.**"}, {"h": "ACSM atherosclerotic cardiovascular disease risk factors II", "b": "The remaining positive risk factors are clinical measurements. Hypertension: systolic pressure of 140 mmHg or higher and/or diastolic pressure of 90 mmHg or higher, confirmed on at least two separate occasions, or taking antihypertensive medication. Dyslipidemia: LDL cholesterol of 130 mg/dL or higher, or HDL cholesterol below 40 mg/dL, or taking lipid-lowering medication; if only total cholesterol is available, 200 mg/dL or higher. Prediabetes: fasting plasma glucose of 100 to 125 mg/dL, or a 2-hour oral glucose tolerance value of 140 to 199 mg/dL, or HbA1C of 5.7 to 6.4 percent. HDL cholesterol of 60 mg/dL or higher is a negative risk factor, so one positive risk factor is subtracted from the total. **Exam tip: HDL of 60 mg/dL or higher is a negative risk factor that cancels one positive risk factor.**"}, {"h": "Counting risk factors: a worked example", "b": "To count risk factors, check each category and subtract one if HDL is 60 mg/dL or higher. Example: a 50-year-old man who smokes, has a blood pressure of 132/84 mmHg, LDL of 140 mg/dL, HDL of 62 mg/dL, and a BMI of 27, and walks 30 minutes 5 days per week. Positive factors: age (45 or older) and smoking, plus dyslipidemia (LDL 130 or higher) equals 3. His blood pressure is below 140/90, BMI is below 30, and he is active, so those do not count. HDL of 62 is a negative factor, so subtract 1 for a total of 2. Under the current ACSM screening process, risk-factor counts no longer determine whether medical clearance is needed; they guide program design and education. **Exam tip: Count every positive factor, then subtract one if HDL is 60 mg/dL or higher; the total guides programming, not medical clearance.**"}, {"h": "Signs and symptoms of cardiovascular, metabolic, or renal disease", "b": "Under the ACSM preparticipation screening algorithm, the main factors are current exercise habits, known cardiovascular, metabolic, or renal disease, and signs or symptoms that suggest disease. Major signs and symptoms include: pain or discomfort in the chest, neck, jaw, arms, or other areas that may be from ischemia; shortness of breath at rest or with mild exertion; dizziness or fainting (syncope); orthopnea (breathing difficulty lying down) or paroxysmal nocturnal dyspnea; ankle edema; palpitations or tachycardia; intermittent claudication (leg pain from poor circulation, felt when walking); a known heart murmur; and unusual fatigue or shortness of breath with usual activities. Anyone with these signs or symptoms should stop and get medical clearance before exercise, regardless of current activity level. **Exam tip: Any sign or symptom of cardiovascular, metabolic, or renal disease requires medical clearance before starting or continuing exercise.**"}, {"h": "Common medications and exercise effects I", "b": "Beta-blockers (names often end in \"-olol,\" such as metoprolol) lower resting and exercise heart rate and blood pressure and may reduce exercise capacity in people without angina; use RPE or the talk test rather than heart-rate targets. Diuretics (\"water pills\") reduce blood volume and can cause dehydration, electrolyte imbalance, and heat intolerance; emphasize hydration. Calcium-channel blockers and ACE inhibitors lower blood pressure; some calcium-channel blockers lower heart rate. Vasodilators, alpha-blockers, and other antihypertensives can cause post-exercise hypotension, so extend the cool-down and avoid sudden position changes. Nitroglycerin relieves angina and can cause hypotension. Trainers never advise starting, stopping, or changing medications. **Exam tip: Clients on beta-blockers should monitor intensity with RPE or the talk test, and clients on antihypertensives need a gradual cool-down.**"}, {"h": "Common medications and exercise effects II", "b": "Insulin and oral blood-sugar-lowering medications can cause hypoglycemia during or after exercise, so clients should check glucose, carry fast carbohydrates, and avoid injecting insulin into a muscle about to be worked hard. Bronchodilators (inhalers) for asthma open the airways and may raise heart rate; clients should bring their rescue inhaler and may use it before exercise as prescribed. Antihistamines and decongestants can raise heart rate and blood pressure or cause drowsiness and impaired heat regulation. Statins lower cholesterol and occasionally cause muscle pain, which should be reported to a physician. Antidepressants vary; some can increase heart rate. Stimulants, including caffeine and ADHD medications, can raise heart rate and blood pressure. **Exam tip: Clients with asthma should carry their rescue inhaler; insulin users should check blood glucose and carry fast-acting carbohydrate.**"}], "qs": [{"q": "A 47-year-old man and a 52-year-old woman: who meets the ACSM age risk factor?", "o": ["Only the woman", "Only the man", "Both", "Neither"], "a": 1, "e": "The thresholds are men 45 or older and women 55 or older."}, {"q": "Which family history counts as a positive risk factor?", "o": ["Grandfather's heart attack at 70", "Father's heart attack at 52", "Mother's heart attack at 70", "Uncle's diabetes"], "a": 1, "e": "A male first-degree relative before 55."}, {"q": "A client quit smoking 3 months ago. For risk-factor purposes, she:", "o": ["Has no smoking risk", "Still counts as a smoker", "Counts only if she smokes cigars", "Gets a negative risk factor"], "a": 1, "e": "Quitting within the past 6 months still counts."}, {"q": "Which HDL level is a NEGATIVE risk factor?", "o": ["35 mg/dL", "45 mg/dL", "55 mg/dL", "62 mg/dL"], "a": 3, "e": "HDL of 60 mg/dL or higher subtracts one risk factor."}, {"q": "Which fasting glucose level identifies prediabetes?", "o": ["85 mg/dL", "110 mg/dL", "140 mg/dL", "200 mg/dL"], "a": 1, "e": "Prediabetes is 100-125 mg/dL fasting."}, {"q": "A 58-year-old woman with BP 145/92 on two visits, LDL 120, HDL 65, and BMI 31 has how many net risk factors?", "o": ["1", "2", "3", "4"], "a": 1, "e": "Age, hypertension, and obesity equal 3; HDL 65 subtracts 1, for a net of 2."}, {"q": "A new client reports chest tightness when climbing stairs. What should you do?", "o": ["Start light exercise", "Refer for medical clearance before exercise", "Use a heart-rate monitor", "Count risk factors and proceed"], "a": 1, "e": "Signs or symptoms of disease require medical clearance."}, {"q": "Leg pain while walking caused by poor circulation is called:", "o": ["Orthopnea", "Intermittent claudication", "Syncope", "Tachycardia"], "a": 1, "e": "Claudication is ischemic leg pain with walking."}, {"q": "A client takes a diuretic. The main exercise concern is:", "o": ["Hypoglycemia", "Dehydration and electrolyte imbalance", "Higher heart rate", "Bronchospasm"], "a": 1, "e": "Diuretics reduce fluid volume and electrolytes."}, {"q": "A client on an antihypertensive medication feels dizzy right after stopping exercise. What helps prevent this?", "o": ["Stop abruptly", "Gradual, extended cool-down", "Breath holding", "Skip hydration"], "a": 1, "e": "Antihypertensives can cause post-exercise hypotension."}]}, {"title": "Special Populations II", "icon": "🩺", "cards": [{"h": "Low back pain", "b": "Most low back pain is nonspecific and improves with staying active; bed rest is not recommended. Trainers work with clients with chronic, medically cleared low back pain, not acute injuries or radiating pain, numbness, or weakness, which require referral. Programming emphasizes core endurance with a neutral spine (McGill's curl-up, side bridge, bird dog), hip mobility, glute strength, and walking. Teach hip hinging so the hips move rather than the lumbar spine. Avoid loaded spinal flexion first thing in the morning, when the intervertebral discs are more hydrated and vulnerable, and limit repeated end-range flexion and rotation under load. Pain that is worse with flexion often benefits from extension-based positions, and vice versa, but this pattern should be guided by the healthcare provider. **Exam tip: For chronic low back pain, emphasize core endurance with a neutral spine and avoid loaded spinal flexion soon after waking.**"}, {"h": "Arthritis: osteoarthritis and rheumatoid arthritis", "b": "Osteoarthritis is degenerative wear of joint cartilage, usually affecting weight-bearing joints such as knees and hips, with stiffness that typically eases within about 30 minutes of movement. Rheumatoid arthritis is an autoimmune inflammatory disease that often affects joints symmetrically, especially the hands and feet, with morning stiffness that lasts longer and periodic flare-ups. For both, exercise reduces pain and improves function. Use low-impact activities such as walking, cycling, and water exercise; warm water is helpful. Strengthen the muscles around affected joints and maintain range of motion daily. During an acute RA flare, avoid strenuous exercise and use only gentle range of motion. The \"2-hour pain rule\": if joint pain is greater 2 hours after exercise than before, reduce the next session. **Exam tip: If arthritis pain is worse 2 hours after exercise than before it, reduce the intensity or volume next session.**"}, {"h": "Osteoporosis", "b": "Osteoporosis is low bone mineral density with increased fracture risk, especially of the hip, spine, and wrist; osteopenia is a less severe reduction. Postmenopausal women are at highest risk because estrogen falls. Bone responds to mechanical loading, so weight-bearing aerobic exercise and progressive resistance training are recommended, along with balance training to prevent falls. For people with osteoporosis, avoid spinal flexion with load or speed, such as crunches, sit-ups, and toe touches, and avoid twisting under load, because these increase the risk of vertebral compression fractures. High-impact jumping is avoided in established osteoporosis unless cleared. Emphasize good posture, thoracic extension, and hip hinging. **Exam tip: Clients with osteoporosis should avoid loaded or rapid spinal flexion such as sit-ups and toe touches.**"}, {"h": "Cancer, coronary artery disease, and stroke", "b": "Exercise during and after cancer treatment is safe for most people and reduces fatigue, improves quality of life, and maintains muscle. Guidelines suggest about 150 minutes of moderate aerobic activity weekly and resistance training 2 days per week, adjusted for treatment side effects. Watch for low blood counts (infection risk), bone metastases, lymphedema after lymph-node removal, and peripheral neuropathy; avoid public pools during low white-cell counts. Clients with coronary artery disease should complete cardiac rehabilitation and have medical clearance; train below any heart rate that triggers symptoms, use longer warm-ups and cool-downs, and stop for angina. After stroke, programs focus on functional tasks, balance, and fall prevention, with physician guidance on blood pressure and medications. **Exam tip: Exercise is safe and recommended for most cancer survivors; adjust for fatigue, blood counts, lymphedema, and neuropathy.**"}, {"h": "Metabolic syndrome, obesity, and youth", "b": "Metabolic syndrome is a cluster of risk factors: abdominal obesity, elevated triglycerides, low HDL, elevated blood pressure, and elevated fasting glucose; three or more indicate the syndrome. For weight loss, ACSM suggests progressing to about 250 to 300 minutes per week of moderate activity for weight maintenance after loss, with 150 to 250 minutes providing modest loss. Use low-impact, weight-supported activities when joints are stressed, and watch for heat intolerance. Youth should accumulate at least 60 minutes of moderate-to-vigorous activity daily, with vigorous activity, muscle strengthening, and bone strengthening each at least 3 days per week. Supervised resistance training is safe for children; emphasize technique, light to moderate loads, and fun. **Exam tip: Children and adolescents need at least 60 minutes of moderate-to-vigorous activity daily, including muscle- and bone-strengthening 3 days per week.**"}, {"h": "Postpartum and older adults", "b": "After childbirth, return to exercise depends on the type of delivery and medical advice; many people can resume light activity soon after an uncomplicated vaginal birth, while cesarean delivery often requires about 6 to 8 weeks before strenuous activity. Watch for diastasis recti (separation of the rectus abdominis) and pelvic floor weakness; begin with diaphragmatic breathing, pelvic floor activation, and transverse abdominis work before crunches or heavy loading. Older adults should do 150 minutes of moderate activity weekly, muscle strengthening 2 or more days, and multicomponent balance training. Sarcopenia, the age-related loss of muscle mass and strength, is countered by resistance training. Use longer warm-ups, focus on functional power such as sit-to-stand speed, and consider vision, hearing, and medication effects. **Exam tip: Resistance training is the primary defense against sarcopenia; older adults also need multicomponent balance training.**"}], "qs": [{"q": "A client with chronic, medically cleared low back pain asks for core work. Which is most appropriate?", "o": ["Weighted sit-ups each morning", "Bird dog and side bridge with a neutral spine", "Toe touches with bouncing", "Loaded Russian twists"], "a": 1, "e": "Core endurance with a neutral spine is preferred."}, {"q": "Why avoid loaded spinal flexion right after waking?", "o": ["Muscles are too strong", "Intervertebral discs are more hydrated and vulnerable", "Blood pressure is low", "Joints are warm"], "a": 1, "e": "Discs are swollen after sleep and more vulnerable to stress."}, {"q": "Which describes rheumatoid arthritis?", "o": ["Cartilage wear in weight-bearing joints", "Autoimmune inflammation, often symmetrical, with flare-ups", "Bone density loss", "A heart rhythm disorder"], "a": 1, "e": "RA is autoimmune and inflammatory."}, {"q": "A client with osteoarthritis has more knee pain 2 hours after a session than before. You should:", "o": ["Increase the load", "Reduce the intensity or volume next session", "Add jumping", "Stop all exercise forever"], "a": 1, "e": "The 2-hour pain rule signals the session was too much."}, {"q": "Which exercise is CONTRAINDICATED for a client with osteoporosis?", "o": ["Walking", "Wall push-ups", "Weighted sit-ups", "Seated rows"], "a": 2, "e": "Loaded spinal flexion raises vertebral fracture risk."}, {"q": "A cancer survivor undergoing treatment has a low white blood cell count. Which should be avoided?", "o": ["Gentle walking", "Public pools and gyms with crowds", "Breathing exercises", "Light stretching"], "a": 1, "e": "Low white cells increase infection risk."}, {"q": "Metabolic syndrome is diagnosed when a person has at least how many of its five risk factors?", "o": ["1", "2", "3", "5"], "a": 2, "e": "Three or more of the five factors."}, {"q": "How much daily activity is recommended for children and adolescents?", "o": ["20 minutes", "30 minutes", "60 minutes or more", "2 hours of vigorous only"], "a": 2, "e": "At least 60 minutes of moderate-to-vigorous activity daily."}, {"q": "A postpartum client has diastasis recti. The best initial exercise approach is:", "o": ["Heavy crunches", "Breathing, pelvic floor, and transverse abdominis activation", "Plyometrics", "Loaded twists"], "a": 1, "e": "Rebuild deep core function before loading the rectus abdominis."}, {"q": "The age-related loss of muscle mass and strength is called:", "o": ["Osteopenia", "Sarcopenia", "Kyphosis", "Dyslipidemia"], "a": 1, "e": "Sarcopenia is countered with resistance training."}]}, {"title": "Coaching Models & Motivation", "icon": "🗣️", "cards": [{"h": "The ACE Mover Method and ABC approach", "b": "The ACE Mover Method is a client-centered philosophy: the client is the expert on their own life and the trainer is a coach and partner, not a dictator. Its practical tool is the ACE ABC Approach. A: Ask open-ended questions to learn what the client wants and why. B: Break down barriers by identifying obstacles such as time, cost, and confidence, and exploring solutions. C: Collaborate with the client to set SMART goals and build an action plan that they help design. The approach uses active listening, reflective statements, and affirmations, and it avoids lecturing or prescribing without the client's input. Open-ended questions begin with words like what, how, or tell me, and cannot be answered with a simple yes or no. **Exam tip: ACE ABC stands for Ask open-ended questions, Break down barriers, and Collaborate on SMART goals.**"}, {"h": "Motivational interviewing and the GROW model", "b": "Motivational interviewing (MI) is a collaborative conversation style that strengthens a person's own motivation for change. It relies on the OARS skills: Open-ended questions, Affirmations, Reflective listening, and Summarizing. Trainers listen for \"change talk\", statements about the client's desire, ability, reasons, and need to change, and respond to resistance (sustain talk) without arguing. The GROW model structures a coaching session: Goal (what the client wants), Reality (where they are now), Options (possible strategies), and Will or Way forward (the specific commitment and next steps). Both approaches put the client in charge of decisions, which increases ownership and adherence. Giving unsolicited advice early, the \"righting reflex,\" tends to increase resistance. **Exam tip: GROW stands for Goal, Reality, Options, and Will (way forward); MI uses OARS skills and listens for change talk.**"}, {"h": "Health belief model and self-determination theory", "b": "The health belief model says that people act on health when they believe they are susceptible to a condition, believe it is serious, believe that acting has benefits that outweigh barriers, receive cues to action (such as a doctor's warning), and have self-efficacy. Self-determination theory says motivation runs from amotivation through external (controlled) forms to intrinsic motivation, and that people become more self-motivated when three psychological needs are met: autonomy (feeling in control of choices), competence (feeling capable), and relatedness (feeling connected to others). Intrinsic motivation, doing an activity for enjoyment, predicts long-term adherence better than extrinsic rewards. Trainers support autonomy by offering choices, competence by setting achievable challenges and giving feedback, and relatedness by building rapport. **Exam tip: Self-determination theory's three needs are autonomy, competence, and relatedness.**"}, {"h": "Decisional balance, self-efficacy, and processes of change", "b": "Decisional balance weighs the perceived pros and cons of changing a behavior. In precontemplation the cons outweigh the pros; as people move toward action, the pros increase until they outweigh the cons. Trainers help clients list both sides and build reasons to change. Self-efficacy, a person's belief in their ability to succeed in a specific situation, is the strongest predictor of exercise adherence. It grows from four sources, listed from strongest: past performance accomplishments, vicarious experience (watching similar others succeed), verbal persuasion, and physiological and emotional states. Processes of change differ by stage: cognitive processes (consciousness raising, self-reevaluation) help early stages, while behavioral processes (stimulus control, reinforcement, social support, counterconditioning) help in preparation, action, and maintenance. **Exam tip: Past performance accomplishments are the strongest source of self-efficacy.**"}, {"h": "Communication styles and nonverbal skills", "b": "Effective communication combines verbal and nonverbal skills. Active listening means giving full attention, paraphrasing, and checking understanding. Nonverbal communication includes eye contact, open posture, facing the client, nodding, and a calm tone; crossed arms or looking at a phone signal disinterest. Personality-based tools such as the DISC model describe behavioral styles (dominance, influence, steadiness, conscientiousness), helping trainers adapt: a dominance-style client wants results and directness, a steadiness-style client values reassurance and routine. Trainers should match the client's learning preference with visual, auditory, or kinesthetic teaching. Feedback should be specific and timely, using the \"tell, show, do\" sequence for new skills. Cultural competency means respecting clients' values, beliefs, and communication norms. **Exam tip: Effective rapport depends on active listening and open nonverbal behavior such as eye contact and an open posture.**"}, {"h": "Adherence strategies and social determinants", "b": "Most people who start an exercise program drop out within about 6 months, so adherence is a key goal. Strategies include setting SMART goals with both process and outcome goals, self-monitoring (logs, wearables), scheduling sessions, building social support, using reinforcement and rewards, and preparing for lapses with relapse-prevention plans that identify high-risk situations. A lapse is a brief slip; a relapse is a return to old behavior; collapse is giving up completely. Social determinants of health are the conditions in which people live, work, and play, such as income, education, neighborhood safety, access to parks and healthy food, and transportation. They strongly shape behavior, so trainers should consider them when setting realistic plans. **Exam tip: About half of people who start exercise programs drop out within 6 months, so plan relapse prevention from the start.**"}], "qs": [{"q": "In the ACE ABC approach, the \"B\" stands for:", "o": ["Build muscle", "Break down barriers", "Balance training", "Behavior contracts"], "a": 1, "e": "Ask, Break down barriers, Collaborate."}, {"q": "Which is an open-ended question?", "o": ["Did you exercise this week?", "Are you ready to start?", "What would make exercise easier for you this week?", "Do you like running?"], "a": 2, "e": "Open-ended questions cannot be answered yes or no."}, {"q": "In the GROW coaching model, \"R\" stands for:", "o": ["Repetition", "Reality", "Rest", "Reward"], "a": 1, "e": "Goal, Reality, Options, Will."}, {"q": "A client says, \"I really want to feel strong enough to play with my kids.\" In motivational interviewing this is:", "o": ["Sustain talk", "Change talk", "Resistance", "Ambivalence denial"], "a": 1, "e": "Statements of desire and reasons to change are change talk."}, {"q": "Self-determination theory identifies three basic needs. Which is one?", "o": ["Competition", "Autonomy", "Rewards", "Punishment"], "a": 1, "e": "Autonomy, competence, and relatedness."}, {"q": "Which is the strongest source of self-efficacy?", "o": ["Verbal persuasion", "Past performance accomplishments", "Physiological states", "Watching TV ads"], "a": 1, "e": "Mastery experiences build self-efficacy most."}, {"q": "A precontemplator's decisional balance usually shows:", "o": ["Pros outweigh cons", "Cons outweigh pros", "Pros and cons equal", "No cons"], "a": 1, "e": "Early stages see more cons than pros."}, {"q": "According to the health belief model, a doctor's warning about blood pressure is an example of a:", "o": ["Barrier", "Cue to action", "Relapse", "Process of change"], "a": 1, "e": "External prompts are cues to action."}, {"q": "A client misses one week of workouts during a vacation, then returns. This is best described as a:", "o": ["Lapse", "Relapse", "Collapse", "Termination"], "a": 0, "e": "A lapse is a brief slip."}, {"q": "A client lives far from safe parks and works two jobs. These factors are examples of:", "o": ["Intrinsic motivation", "Social determinants of health", "Personality traits", "Change talk"], "a": 1, "e": "Living and working conditions are social determinants of health."}]}, {"title": "Nutrition II: Diets & Supplements", "icon": "🥗", "cards": [{"h": "Dietary Guidelines and MyPlate", "b": "The Dietary Guidelines for Americans recommend a healthy eating pattern across the lifespan: vegetables, fruits, whole grains, low-fat dairy or fortified alternatives, a variety of protein foods, and oils. They advise limiting added sugars to less than 10 percent of calories, saturated fat to less than 10 percent of calories, and sodium to less than 2,300 mg per day for most people age 14 and older; alcohol, if consumed, should be limited to 2 drinks or fewer per day for men and 1 or fewer for women. MyPlate illustrates a balanced meal, with about half the plate fruits and vegetables, plus grains, protein, and dairy. Trainers can share these public guidelines but cannot prescribe individualized meal plans for medical conditions, which is the role of a registered dietitian. **Exam tip: The Dietary Guidelines limit added sugars and saturated fat to under 10 percent of calories and sodium to under 2,300 mg per day.**"}, {"h": "Popular eating patterns", "b": "The DASH diet (Dietary Approaches to Stop Hypertension) is rich in fruits, vegetables, whole grains, low-fat dairy, and lean protein and low in sodium; it lowers blood pressure. The Mediterranean diet emphasizes olive oil, vegetables, legumes, fish, nuts, and whole grains and is linked to lower cardiovascular risk. Vegetarian diets exclude meat; vegan diets exclude all animal products and need attention to vitamin B12, iron, calcium, vitamin D, zinc, and omega-3 fatty acids, though protein needs can be met by combining plant sources over the day. Low-carbohydrate and ketogenic diets can produce weight loss but may limit fiber and high-intensity performance. Intermittent fasting restricts eating windows. Most diets that reduce calories produce similar long-term weight loss; adherence matters most. **Exam tip: The DASH diet is designed to lower blood pressure; vegans should pay special attention to vitamin B12.**"}, {"h": "Supplements and the law", "b": "Under the Dietary Supplement Health and Education Act of 1994 (DSHEA), dietary supplements are regulated as foods, not drugs. The FDA does not approve supplements for safety or effectiveness before they are sold; manufacturers are responsible for safety, and the FDA can act only after a product is shown to be unsafe. Labels may make structure or function claims (for example, \"supports joint health\") but not claims to diagnose, treat, cure, or prevent disease. Third-party certifications such as NSF Certified for Sport or USP Verified test for purity and banned substances. Creatine monohydrate has strong evidence for increasing strength and power in short, repeated high-intensity efforts, and caffeine improves endurance and alertness. Trainers may share general evidence but should not recommend or sell supplements outside their scope. **Exam tip: The FDA does not approve dietary supplements before they reach the market; manufacturers are responsible for safety.**"}, {"h": "Nutrient timing and fueling exercise", "b": "Carbohydrate is the main fuel for moderate-to-high-intensity exercise and is stored as muscle and liver glycogen. For endurance events longer than about 60 to 90 minutes, athletes benefit from consuming about 30 to 60 grams of carbohydrate per hour during exercise, and higher amounts for very long events. A pre-exercise meal 2 to 4 hours before should be higher in carbohydrate and lower in fat and fiber to avoid stomach upset. After exercise, consuming carbohydrate and protein (about 20 to 30 grams, or roughly 0.25 to 0.3 g/kg) supports glycogen replenishment and muscle repair. Carbohydrate loading increases glycogen stores before endurance events lasting longer than about 90 minutes. Sports drinks with electrolytes help in long or hot sessions. **Exam tip: For exercise longer than about an hour, consuming 30 to 60 grams of carbohydrate per hour helps maintain performance.**"}, {"h": "Assessing intake, energy balance, and weight", "b": "Diet assessment tools include food records or logs (writing down everything eaten for several days), 24-hour recalls, and food-frequency questionnaires; all depend on honest reporting, and people commonly underreport intake. Energy balance compares calories consumed with calories expended. Total daily energy expenditure has three parts: resting metabolic rate (the largest, about 60 to 75 percent), the thermic effect of food (about 10 percent), and physical activity, which is the most variable. A pound of body fat stores roughly 3,500 kcal, although actual weight loss slows over time as the body adapts. A safe rate of weight loss is about 1 to 2 pounds per week; a daily deficit of about 500 to 1,000 kcal is commonly used. **Exam tip: Resting metabolic rate is the largest component of total daily energy expenditure; aim for about 1 to 2 pounds of weight loss per week.**"}, {"h": "Disordered eating and the female athlete triad", "b": "Eating disorders such as anorexia nervosa, bulimia nervosa, and binge-eating disorder are serious medical and psychological conditions. Warning signs include rapid weight loss, preoccupation with food and weight, secretive eating, excessive exercise, and frequent trips to the bathroom after meals. Trainers should express concern privately and supportively, avoid commenting on weight, and refer to a physician, registered dietitian, or mental-health professional; they do not diagnose or treat. The female athlete triad links low energy availability (with or without disordered eating), menstrual dysfunction such as amenorrhea, and low bone mineral density. The broader concept of relative energy deficiency in sport (RED-S) applies to all genders. **Exam tip: The female athlete triad is low energy availability, menstrual dysfunction, and low bone density; refer suspected disordered eating.**"}], "qs": [{"q": "The Dietary Guidelines recommend limiting sodium for most people to under:", "o": ["1,000 mg/day", "2,300 mg/day", "4,000 mg/day", "5,000 mg/day"], "a": 1, "e": "Under 2,300 mg per day for most people 14 and older."}, {"q": "Which eating pattern was specifically designed to lower blood pressure?", "o": ["Ketogenic", "DASH", "Paleo", "Carnivore"], "a": 1, "e": "DASH = Dietary Approaches to Stop Hypertension."}, {"q": "Which nutrient is a particular concern for vegans?", "o": ["Vitamin C", "Vitamin B12", "Fiber", "Carbohydrate"], "a": 1, "e": "B12 is found almost exclusively in animal foods."}, {"q": "Under DSHEA, who is responsible for ensuring a supplement is safe before sale?", "o": ["The FDA", "The manufacturer", "The trainer", "The CDC"], "a": 1, "e": "The FDA does not pre-approve supplements."}, {"q": "Which supplement claim is permitted on a label?", "o": ["Cures arthritis", "Prevents cancer", "Supports joint health", "Treats diabetes"], "a": 2, "e": "Structure-function claims are allowed; disease claims are not."}, {"q": "A client asks which supplement has strong evidence for repeated short sprints and lifting. The best general answer is:", "o": ["Creatine monohydrate", "Raspberry ketones", "Chromium for fat loss", "Detox tea"], "a": 0, "e": "Creatine improves repeated high-intensity performance."}, {"q": "For a 2-hour bike ride, how much carbohydrate per hour is commonly recommended during exercise?", "o": ["0 grams", "30-60 grams", "200 grams", "5 grams"], "a": 1, "e": "About 30-60 g/h for events over 60-90 minutes."}, {"q": "The largest component of total daily energy expenditure is:", "o": ["Physical activity", "Thermic effect of food", "Resting metabolic rate", "NEAT only"], "a": 2, "e": "RMR accounts for about 60-75 percent."}, {"q": "A client's teammate notices she skips meals, has stopped menstruating, and trains excessively. What is the best response?", "o": ["Prescribe a meal plan", "Comment on her weight", "Express concern privately and refer to a professional", "Increase her training"], "a": 2, "e": "Signs of the female athlete triad and possible disordered eating require referral."}, {"q": "A safe rate of weight loss for most clients is about:", "o": ["0.25 pounds per month", "1-2 pounds per week", "5 pounds per week", "10 pounds per week"], "a": 1, "e": "About 1-2 pounds per week."}]}, {"title": "Environmental Conditions", "icon": "🌡️", "cards": [{"h": "Exercising in the heat", "b": "Heat stress depends on temperature, humidity, radiant heat from the sun, and wind. High humidity limits sweat evaporation, the body's main cooling method during exercise, so the heat index or wet-bulb globe temperature (WBGT) is a better guide than air temperature alone. Heat acclimatization takes about 10 to 14 days of gradually increasing exercise duration and intensity in the heat; adaptations include earlier and greater sweating, larger plasma volume, and lower heart rate and core temperature at the same workload. Clothing should be light-colored, loose, and moisture-wicking. Exercise in cooler parts of the day and hydrate before, during, and after. Higher-risk groups include children, older adults, people with obesity, unfit or unacclimatized people, and those taking diuretics or certain medications. **Exam tip: Heat acclimatization takes about 10 to 14 days; humidity is dangerous because it reduces sweat evaporation.**"}, {"h": "Heat illnesses", "b": "Heat cramps are painful muscle spasms linked to fluid and electrolyte loss; treat with rest, stretching, and fluids with sodium. Heat exhaustion causes heavy sweating, weakness, nausea, headache, dizziness, and a rapid weak pulse, with core temperature usually below 104°F (40°C); move the person to a cool place, elevate the legs, and give fluids. Heat stroke is a medical emergency: core temperature above about 104°F (40°C) with central nervous system dysfunction such as confusion, irritability, staggering, or collapse; the skin may be hot and dry or still sweaty. Call emergency services and begin rapid cooling immediately, ideally by cold-water immersion, because the speed of cooling determines survival. The guiding rule is \"cool first, transport second.\" **Exam tip: Confusion plus a very high body temperature means heat stroke: call EMS and cool immediately, ideally with cold-water immersion.**"}, {"h": "Exercising in the cold", "b": "In cold environments, the body conserves heat by constricting surface blood vessels and generates heat by shivering. Wind chill accelerates heat loss from exposed skin, and wet clothing loses most of its insulation. Dress in layers: a moisture-wicking inner layer (avoid cotton), an insulating middle layer such as fleece or wool, and a wind- and water-resistant outer shell that can be removed as the body warms. Cover the head, hands, and ears. Hypothermia, core temperature below 95°F (35°C), causes intense shivering, slurred speech, clumsiness, and confusion; shivering may stop as it worsens. Frostbite freezes tissue, usually fingers, toes, ears, and nose. Move the person to warmth, remove wet clothing, and rewarm gradually; do not rub frostbitten tissue. Cold air can trigger exercise-induced bronchoconstriction and angina. **Exam tip: Dress in layers with a wicking inner layer; hypothermia begins when core temperature drops below 95°F (35°C).**"}, {"h": "Altitude", "b": "At altitude, barometric pressure and the partial pressure of oxygen fall, reducing the oxygen carried in the blood. Effects begin around 1,500 meters (about 5,000 feet): VO2max drops roughly 1 percent for every 100 meters above 1,500 meters, and heart rate and breathing are higher at a given workload. Acclimatization takes about 2 weeks at moderate altitude and longer at higher elevations; adaptations include increased red blood cell production and better oxygen delivery. Acute mountain sickness causes headache, nausea, fatigue, and poor sleep. Recommendations: reduce intensity and duration at first, hydrate well because air is dry and breathing increases fluid loss, and ascend gradually. Endurance performance is impaired more than short, power-based efforts. **Exam tip: Aerobic capacity drops about 1 percent per 100 meters above 1,500 meters; plan about 2 weeks to acclimatize.**"}, {"h": "Air quality and pollution", "b": "Air pollutants such as ozone, particulate matter, carbon monoxide, and smoke irritate the airways and reduce oxygen delivery; exercise increases the amount inhaled. The Air Quality Index (AQI) runs from 0 to 500: 0-50 good, 51-100 moderate, 101-150 unhealthy for sensitive groups, 151-200 unhealthy for everyone, 201-300 very unhealthy, and 301+ hazardous. Sensitive groups include people with asthma or other lung disease, heart disease, older adults, children, and pregnant people. When the AQI is above 100, sensitive clients should reduce outdoor intensity or move indoors; above 150, most people should reduce or move indoors. Ozone peaks on hot sunny afternoons, so exercise earlier in the day and away from busy roads. **Exam tip: When the AQI exceeds 100, sensitive groups should exercise indoors or reduce intensity; above 150, everyone should.**"}, {"h": "Hydration monitoring", "b": "Dehydration of just 2 percent of body weight can impair performance and increase heat strain. Monitoring tools include body weight before and after exercise and urine color: pale yellow suggests adequate hydration, dark yellow suggests dehydration. ACE guidance: drink about 17 to 20 ounces of fluid 2 to 3 hours before exercise, 7 to 10 ounces every 10 to 20 minutes during, and 16 to 24 ounces for every pound lost after exercise. For sessions over about an hour or in heat, sports drinks with sodium and carbohydrate help. Overdrinking plain water during prolonged events can cause hyponatremia (low blood sodium), with symptoms such as headache, confusion, nausea, and swelling of the hands and feet; it is dangerous and can be fatal. **Exam tip: Hyponatremia results from drinking too much plain water during long events; replace 16 to 24 ounces per pound lost after exercise.**"}], "qs": [{"q": "Why is high humidity dangerous during exercise?", "o": ["It increases sweat evaporation", "It limits sweat evaporation", "It lowers heart rate", "It increases oxygen levels"], "a": 1, "e": "Sweat that cannot evaporate does not cool the body."}, {"q": "Heat acclimatization usually takes about:", "o": ["1-2 days", "10-14 days", "3 months", "1 year"], "a": 1, "e": "About 10 to 14 days of graded exposure."}, {"q": "A runner is confused and staggering with a very high body temperature. What is the FIRST priority?", "o": ["Give a sports drink and wait", "Call EMS and begin rapid cooling (cold-water immersion)", "Have them walk it off", "Drive them home"], "a": 1, "e": "Heat stroke: cool first, transport second."}, {"q": "Which is the best base layer for cold-weather exercise?", "o": ["Cotton T-shirt", "Moisture-wicking synthetic or wool", "Heavy denim", "Plastic jacket"], "a": 1, "e": "Avoid cotton, which holds moisture."}, {"q": "Hypothermia is defined as a core temperature below about:", "o": ["98.6°F", "95°F (35°C)", "100°F", "90°F (32°C) only"], "a": 1, "e": "Below 95°F (35°C)."}, {"q": "How should frostbitten tissue be handled?", "o": ["Rub it vigorously", "Rewarm gradually and avoid rubbing", "Apply snow", "Ignore it"], "a": 1, "e": "Rubbing damages frozen tissue."}, {"q": "Above about 1,500 m, VO2max decreases roughly:", "o": ["1% per 100 m", "10% per 100 m", "50% total", "Not at all"], "a": 0, "e": "About 1 percent per 100 meters."}, {"q": "A client with asthma wants to run outdoors when the AQI is 125. What is the best advice?", "o": ["Run as planned", "Exercise indoors or lower intensity", "Run faster to finish quickly", "Skip the inhaler"], "a": 1, "e": "101-150 is unhealthy for sensitive groups."}, {"q": "During a marathon, a runner who drank large amounts of plain water develops confusion and swollen hands. The likely cause is:", "o": ["Dehydration", "Hyponatremia", "Hypoglycemia only", "Heat cramps"], "a": 1, "e": "Overdrinking plain water dilutes blood sodium."}, {"q": "Which urine color suggests adequate hydration?", "o": ["Dark amber", "Pale yellow", "Brown", "Orange"], "a": 1, "e": "Pale yellow indicates adequate hydration."}]}, {"title": "Risk Management & Business", "icon": "💼", "cards": [{"h": "The risk-management process", "b": "Risk management is a systematic process to reduce injuries and liability. ACE outlines five steps: identify risks (equipment, facility, programming, supervision, emergencies), evaluate them (how likely and how severe), select an approach, implement it, and evaluate and revise regularly. The four approaches are avoidance (do not offer the risky activity), transfer (shift risk to others, such as through liability insurance or waivers), reduction (lower the risk with policies, inspections, training, and supervision), and retention (accept small risks that cannot be eliminated). Trainers should inspect equipment regularly, keep floors clear, maintain an emergency action plan with practiced drills, and keep CPR and AED certification current. Professional liability insurance is essential even for employed trainers. **Exam tip: The four risk-management approaches are avoidance, transfer, reduction, and retention; liability insurance is a form of transfer.**"}, {"h": "Negligence, waivers, and standards", "b": "Negligence is failure to act as a reasonable and prudent professional would in a similar situation, through either an act of commission (doing something wrong, such as prescribing an unsafe exercise) or omission (failing to do something, such as not spotting a heavy lift). To prove negligence, the plaintiff must show four elements: duty, breach of duty, causation, and damages. A waiver releases the trainer from liability for ordinary negligence and is a form of risk transfer, but it typically does not protect against gross negligence and depends on state law. An informed consent form explains the risks and benefits of a program and documents that the client understands them, but it does not release liability. Trainers are judged against accepted professional standards and guidelines. **Exam tip: An informed consent explains risks but does not release liability; a waiver can release ordinary negligence depending on state law.**"}, {"h": "Documentation, SOAP notes, and incident reports", "b": "Thorough records protect clients and trainers. Keep health-history questionnaires, informed consents, waivers, medical clearances, assessment results, program notes, and progress records in secure, confidential storage. SOAP notes are a structured format: Subjective (what the client reports, such as feelings or pain), Objective (measurable data such as heart rate, loads, and observations), Assessment (the trainer's interpretation of progress), and Plan (next steps). After any injury or emergency, complete an incident report promptly, recording facts only: date, time, location, what happened, witnesses, actions taken, and follow-up, without admitting fault or speculating. HIPAA governs protected health information held by covered entities such as healthcare providers, but all trainers should keep client information confidential. **Exam tip: SOAP stands for Subjective, Objective, Assessment, Plan; incident reports should record facts only, completed promptly.**"}, {"h": "Supervision, spotting, and safe facilities", "b": "Supervision lowers risk. Keep the client within sight at all times; trainers should not leave clients unattended during a session. Spot free-weight exercises that are performed overhead, over the face, or on the back (bench press, overhead press, squats), spotting at the wrists for dumbbell presses rather than the elbows. Communicate the number of repetitions and the lift-off signal before starting. Never spot power exercises such as cleans; teach clients to drop the bar safely. Facility safety includes clear walkways, adequate spacing between equipment, posted rules, emergency exits, functioning AEDs, regular maintenance logs, and safety signage. Laws relevant to fitness businesses include the Americans with Disabilities Act (ADA), which requires reasonable accommodations, and OSHA rules on workplace safety and bloodborne pathogens. **Exam tip: Spot dumbbell presses at the wrists, and do not spot power cleans; teach clients to drop the bar safely instead.**"}, {"h": "Employment, business, and marketing", "b": "Personal trainers may work as employees, where the employer controls schedules and methods, withholds taxes, and may provide insurance, or as independent contractors, who control how they work, pay their own self-employment taxes, and carry their own insurance. The Fair Labor Standards Act (FLSA) governs minimum wage and overtime for employees. Business structures include sole proprietorship (simplest, but unlimited personal liability), partnership, limited liability company (LLC), and corporation; an LLC protects personal assets from business debts. A business plan typically includes an executive summary, a description of products and services, a market analysis, a marketing strategy, an operations plan, and financial projections. Marketing plans define the target market, the value proposition, pricing, and promotion. **Exam tip: An LLC protects personal assets; independent contractors pay their own self-employment taxes and set their own methods.**"}, {"h": "Professional conduct, ethics, and social media", "b": "Professional conduct includes punctuality, appropriate attire and language, honest marketing, and respectful touch only with permission, explaining why and how before tactile cues. The four healthcare ethics principles are autonomy (respecting the client's choices), beneficence (acting for the client's good), non-maleficence (do no harm), and justice (fairness). Trainers should avoid dual relationships that compromise objectivity, such as romantic relationships with clients. Respect diversity, equity, and inclusion by using inclusive language, accommodating abilities, and avoiding stereotypes. On social media, keep client information private and post client photos or results only with written permission; avoid making medical claims or giving individualized advice to strangers. Evaluate information sources critically: peer-reviewed research and reputable organizations rank above testimonials and anecdotes. **Exam tip: Post a client's photo or results only with written permission, and keep all client information confidential.**"}], "qs": [{"q": "Purchasing professional liability insurance is an example of which risk-management approach?", "o": ["Avoidance", "Transfer", "Reduction", "Retention"], "a": 1, "e": "Insurance transfers risk to the insurer."}, {"q": "A gym removes its trampoline because of injury risk. This is:", "o": ["Transfer", "Avoidance", "Retention", "Reduction"], "a": 1, "e": "Eliminating the activity avoids the risk."}, {"q": "A trainer fails to spot a client on a heavy bench press and the client is injured. This is negligence by:", "o": ["Commission", "Omission", "Waiver", "Transfer"], "a": 1, "e": "Failing to act is an act of omission."}, {"q": "Which document explains risks and benefits but does NOT release the trainer from liability?", "o": ["Waiver", "Informed consent", "Contract of employment", "Incident report"], "a": 1, "e": "Informed consent documents understanding but does not release liability."}, {"q": "In a SOAP note, a client's heart rate and the loads lifted belong under:", "o": ["Subjective", "Objective", "Assessment", "Plan"], "a": 1, "e": "Measurable data go under Objective."}, {"q": "After a client falls and sprains an ankle, the trainer's incident report should:", "o": ["Admit fault", "Record only the facts, completed promptly", "Be written a month later", "Include guesses about the cause"], "a": 1, "e": "Incident reports record facts only."}, {"q": "How should a trainer spot a dumbbell overhead press?", "o": ["At the elbows", "At the wrists", "At the hips", "Not at all"], "a": 1, "e": "Spotting at the wrists controls the dumbbells."}, {"q": "Which business structure protects the trainer's personal assets from business debts?", "o": ["Sole proprietorship", "Limited liability company (LLC)", "General partnership", "Hobby business"], "a": 1, "e": "LLCs separate personal and business liability."}, {"q": "Which healthcare ethics principle means \"do no harm\"?", "o": ["Autonomy", "Beneficence", "Non-maleficence", "Justice"], "a": 2, "e": "Non-maleficence is avoiding harm."}, {"q": "A trainer wants to post a client's before-and-after photos. What is required?", "o": ["Nothing", "The client's written permission", "Approval from ACE", "A waiver signed by the trainer"], "a": 1, "e": "Get written permission and keep client information confidential."}]}];
NEWL2.forEach(l=>{const ids=l.qs.map(q=>{QS.push(Object.assign({d:'X'},q));return QS.length-1});LESSONS.push({title:l.title,icon:l.icon,cards:l.cards,qs:ids})});
const KEY="ace-cpt-quest-v2",blank={xp:0,best:[],wrong:[],streak:0,last:"",perfect:false,mock:0};
let st;try{st=Object.assign({},blank,JSON.parse(localStorage.getItem(KEY)||"{}"));while(st.best.length<LESSONS.length)st.best.push(0)}catch(e){st=Object.assign({},blank)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const pick=a=>a[Math.floor(Math.random()*a.length)],day=d=>new Date(d).toISOString().slice(0,10);
function streak(){const d=day(Date.now());if(st.last===d)return;st.streak=st.last===day(Date.now()-864e5)?st.streak+1:1;st.last=d}
let S={view:"path",les:-1,step:0,qn:0,hearts:5,score:0,picked:null,msg:"",combo:0,rq:0,exam:[],eAns:{},left:0,done:false,timer:null};
const $=document.getElementById("app"),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function confetti(){const c=document.getElementById("cf");for(let i=0;i<40;i++){const s=document.createElement("i");s.style.left=Math.random()*100+"vw";s.style.background=["#22c55e","#38bdf8","#14b8a6","#facc15","#f472b6"][i%5];s.style.animationDuration=1+Math.random()*1.2+"s";s.style.setProperty("--x",(Math.random()*160-80)+"px");c.appendChild(s);setTimeout(()=>s.remove(),2500)}}
function answer(qi,j,gain){const ok=j===QS[qi].a;S.picked=j;S.msg=ok?(S.combo>=2?(S.combo+1)+" in a row! ":"")+pick(CHEERS):pick(OOPS);S.combo=ok?S.combo+1:0;st.wrong=st.wrong.filter(x=>x!==qi);if(ok){st.xp+=gain;confetti()}else st.wrong.push(qi);streak();save();return ok}
function ring(p,l,col){const r=26,c=2*Math.PI*r;return `<svg width="72" height="72" viewBox="0 0 72 72"><circle cx="36" cy="36" r="${r}" fill="none" stroke="#e2e8f0" stroke-width="7"/><circle cx="36" cy="36" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 36 36)"/><text x="36" y="41" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor">${l}</text></svg>`}
const opt=(q,j,cls,act)=>`<button class="opt ${cls}" data-act="${act}" data-j="${j}">${"ABCD"[j]}. ${esc(q.o[j])}</button>`;
const cls=(q,j,picked,reveal)=>reveal?(j===q.a?"good":picked===j?"bad":""):(picked===j?"sel":"");
function render(){const passed=st.best.filter(b=>b>=8).length,lvl=Math.floor(st.xp/100)+1;
const badges=[["First Steps",passed>=1,"Pass a lesson"],["Perfectionist",st.perfect,"10/10 on a lesson"],["On a Roll",st.streak>=3,"3-day streak"],["Path Master",passed===LESSONS.length,"Pass every lesson"],["Exam Ready",st.mock>=80,"Mock exam 80%+"],["Century",st.xp>=300,"Earn 300 XP"]];
let h=`<header><div class="rings">${ring((st.xp%100)/100,"Lv "+lvl,"#0284c7")}${ring(passed/LESSONS.length,passed+"/"+LESSONS.length,"#0f766e")}<div class="stat">⭐ ${st.xp} XP<br>🔥 ${st.streak}-day streak<br>📕 ${st.wrong.length} to review</div></div><div class="badges">${badges.map(b=>`<span class="${b[1]?"on":""}">${b[1]?"🏅":"🔒"} ${b[0]} · ${b[2]}</span>`).join("")}</div></header>
<nav>${[["path","Path"],["review","Review ("+st.wrong.length+")"],["exam","Mock exam"]].map(v=>`<button data-act="view" data-v="${v[0]}" class="${S.view===v[0]?"on":""}">${v[1]}</button>`).join("")}</nav><main>`;
const L=S.les>=0?LESSONS[S.les]:null;
if(S.view==="path"&&!L){h+=`<div class="path">`+LESSONS.map((l,i)=>{const u=i===0||st.best[i-1]>=8,p=st.best[i]>=8;return `<div class="node" style="transform:translateX(${[0,36,0,-36][i%4]}px)"><button class="bubble ${p?"done":u?"open":"lock"}" ${u?"":"disabled"} data-act="start" data-i="${i}">${u?l.icon:"🔒"}</button><b>${i+1}. ${esc(l.title)}</b><small>${p?"Passed · best "+st.best[i]+"/10 ⭐":u?"Tap to start":"Score 8/10 on the previous lesson to unlock"}</small></div>`}).join('<div class="link"></div>')+`</div>`}
else if(S.view==="path"&&S.step<L.cards.length){const c=L.cards[S.step];h+=`<div class="card"><small>${L.icon} ${esc(L.title)} · Learn ${S.step+1}/${L.cards.length}</small><div class="bar"><i style="width:${(S.step+1)/L.cards.length*100}%"></i></div><h2>${esc(c.h)}</h2><div class="big">${rich(c.b)}</div><button class="primary" data-act="next">${S.step===L.cards.length-1?"I'm ready, start the quiz! 🚀":"Got it →"}</button>${S.step>0?'<button data-act="back">Back</button>':""}<button data-act="exit">Exit</button></div>`}
else if(S.view==="path"&&(S.qn>=L.qs.length||S.hearts<=0)){const sc=S.score,ok=sc>=8&&S.hearts>0;h+=`<div class="card center"><div class="huge pop">${S.hearts<=0?"💔":ok?(sc===10?"🏆":"🎉"):"💪"}</div><h2>${S.hearts<=0?"Out of hearts, but not out of the game!":sc===10?"PERFECT 10/10! You're a legend!":ok?"Lesson complete! "+sc+"/10":sc+"/10, so close!"}</h2><p>${ok?"+50 XP bonus. The next lesson is unlocked. Your future clients thank you!":"You need 8/10 to unlock the next lesson. Review the cards and try again!"}</p><button class="primary" data-act="exit">Back to path</button><button data-act="start" data-i="${S.les}">Retry lesson</button></div>`}
else if(S.view==="path"){const qi=L.qs[S.qn],q=QS[qi],r=S.picked!==null;h+=`<div class="card"><div class="row"><span>Question ${S.qn+1}/${L.qs.length} · ✅ ${S.score}</span><span>${"❤️".repeat(S.hearts)}${"🤍".repeat(5-S.hearts)}</span></div><div class="bar g"><i style="width:${S.qn/L.qs.length*100}%"></i></div><h3>${esc(q.q)}</h3>${q.o.map((_,j)=>opt(q,j,cls(q,j,S.picked,r),"lq")).join("")}${r?`<div class="fb pop"><b>${esc(S.msg)}${S.picked===q.a?" +10 XP":""}</b><p>${S.picked===q.a?"":"Correct answer: "+"ABCD"[q.a]+". "}${esc(q.e)}</p><button class="primary" data-act="cont">Continue →</button></div>`:""}</div>`}
if(S.view==="review"){if(!st.wrong.length)h+=`<div class="card center"><div class="huge">✨</div><h2>No mistakes waiting. Spotless!</h2></div>`;else{const qi=st.wrong[S.rq%st.wrong.length],q=QS[qi],r=S.picked!==null;h+=`<div class="card"><small>Review ${S.rq%st.wrong.length+1}/${st.wrong.length} · answer right to clear it (+5 XP)</small><h3>${esc(q.q)}</h3>${q.o.map((_,j)=>opt(q,j,cls(q,j,S.picked,r),"rv"+qi)).join("")}${r?`<div class="fb"><b>${esc(S.msg)}</b><p>${esc(q.e)}</p><button class="primary" data-act="rnext">Next →</button></div>`:""}</div>`}}
if(S.view==="exam"){const sc=S.exam.filter(q=>S.eAns[q]===QS[q].a).length;h+=`<div class="card"><p>30 random questions in 36 minutes, the real exam's pace. 5 XP per correct answer.</p><button class="primary" data-act="exam">${S.exam.length?"Start a new mock exam":"Start mock exam"}</button></div>`;if(S.exam.length){h+=`<div class="card"><h3 class="sticky">${S.done?`Score: ${sc}/${S.exam.length} (${Math.round(sc/S.exam.length*100)}%) ${sc/S.exam.length>=.8?"🎉 Exam ready!":"💪 Keep training!"}`:`⏱ ${Math.floor(S.left/60)}:${String(S.left%60).padStart(2,"0")} · answered ${Object.keys(S.eAns).length}/${S.exam.length}`}</h3>`+S.exam.map((qi,n)=>{const q=QS[qi];return `<div class="eq"><p>${n+1}. ${esc(q.q)}</p>${q.o.map((_,j)=>opt(q,j,cls(q,j,S.eAns[qi],S.done),"ex"+qi)).join("")}${S.done?`<p class="muted">${esc(q.e)}</p>`:""}</div>`}).join("")+(S.done?"":`<button class="primary" data-act="submit">Submit</button>`)+`</div>`}}
h+=`<details class="card"><summary>About the ACE CPT exam</summary><p>150 multiple-choice questions (125 scored, 25 experimental), 3 hours, pass at a scaled 500 (range 200-800). About 10% are silent video questions.</p><p>Domains: I Client Onboarding & Assessments 23% · II Program Design & Implementation 31% · III Program Modification & Progression 27% · IV Risk Management, Professional Conduct & Ethics 19%.</p><p class="muted">Progress is saved in this browser on this device.</p><button data-act="reset">Reset progress</button></details></main>`;
const y=S.view==="exam"?window.scrollY:0;$.innerHTML=h;if(y)window.scrollTo(0,y)}
function startLesson(i){Object.assign(S,{les:i,step:0,qn:0,hearts:5,score:0,picked:null,msg:"",combo:0});window.scrollTo(0,0)}
function tick(){if(S.view!=="exam"||S.done||!S.exam.length)return;S.left--;if(S.left<=0)submit();else{const e=document.querySelector(".sticky");if(e)e.textContent=`⏱ ${Math.floor(S.left/60)}:${String(S.left%60).padStart(2,"0")} · answered ${Object.keys(S.eAns).length}/${S.exam.length}`}}
function submit(){const sc=S.exam.filter(q=>S.eAns[q]===QS[q].a).length;S.exam.forEach(q=>{st.wrong=st.wrong.filter(x=>x!==q);if(S.eAns[q]!==QS[q].a)st.wrong.push(q)});st.xp+=sc*5;st.mock=Math.max(st.mock,Math.round(sc/S.exam.length*100));streak();save();S.done=true;if(sc/S.exam.length>=.8)confetti();render()}
setInterval(tick,1000);
$.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,j=+b.dataset.j,L=LESSONS[S.les];
if(a==="view"){S.view=b.dataset.v;S.les=-1;S.picked=null}else if(a==="start")startLesson(+b.dataset.i);else if(a==="next")S.step++;else if(a==="back")S.step--;else if(a==="exit")S.les=-1;
else if(a==="lq"){if(S.picked===null){if(answer(L.qs[S.qn],j,10))S.score++;else S.hearts--}}
else if(a==="cont"){S.qn++;S.picked=null;if(S.qn>=L.qs.length&&S.hearts>0){st.best[S.les]=Math.max(st.best[S.les],S.score);if(S.score>=8){st.xp+=50;confetti()}if(S.score===10)st.perfect=true;save()}}
else if(a.startsWith("rv")){if(S.picked===null)answer(+a.slice(2),j,5)}else if(a==="rnext"){S.rq++;S.picked=null}
else if(a==="exam"){S.exam=QS.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,30);S.eAns={};S.left=2160;S.done=false}
else if(a.startsWith("ex")){if(!S.done)S.eAns[+a.slice(2)]=j}else if(a==="submit"){submit();return}
else if(a==="reset"){if(confirm("Reset all progress?")){st=Object.assign({},blank,{best:LESSONS.map(()=>0),wrong:[]});save()}}
render()});
render();
