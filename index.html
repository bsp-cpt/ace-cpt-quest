<body><h1>💪 ACE CPT Quest</h1><div id="app"></div><div id="cf"></div><script>
const QS = [
{d:"I",q:"A 72-year-old client takes medications for hypertension and diabetes but answers \"no\" to all PAR-Q questions. What should you do?",o:["Skip health screening, start exercise immediately","Get physician clearance before exercise begins","Have client check blood pressure before each session","Refer to cardiologist before exercise"],a:2,e:"PAR-Q is negative, so physician clearance may not be required, but monitoring BP/blood sugar during exercise is appropriate."},
{d:"I",q:"During assessment, a 70-year-old reports falling twice in the past year and feeling unsteady. What should be HIGHEST priority?",o:["Cardiovascular fitness","Muscle strength development","Balance training and fall prevention","Weight loss"],a:2,e:"Fall risk is a major concern. Balance training directly addresses this."},
{d:"I",q:"A client's resting heart rate is 72 bpm and you calculate max HR as 148. What is the heart rate reserve?",o:["72 bpm","76 bpm","148 bpm","220 bpm"],a:1,e:"HRR = Max HR - Resting HR = 148 - 72 = 76."},
{d:"I",q:"Which of the following is a red flag during assessment that requires physician referral?",o:["Client reports decreased energy with age","Client answers \"yes\" to PAR-Q question about chest pain","Client has arthritis but wants to exercise","Client is overweight"],a:1,e:"Any \"yes\" to PAR-Q requires physician clearance."},
{d:"I",q:"A client was very sedentary and is now worried about exercise. What baseline assessment is MOST important?",o:["Aerobic fitness test","Resting blood pressure and heart rate","Flexibility test","Strength test"],a:1,e:"Baseline vital signs are most important for safety."},
{d:"I",q:"What is the MOST important first step when working with a new senior client?",o:["Start them on a resistance program","Perform a health screening and assessment","Take them on a 5-mile walk to assess fitness","Enroll them in group classes"],a:1,e:"Always assess before programming."},
{d:"I",q:"A 70-year-old client fell last year and is afraid of falling. What should you prioritize?",o:["Intense cardio to build confidence","Heavy resistance training","Balance training and fall prevention strategies","Flexibility training only"],a:2,e:"Fall risk is one of the highest priorities for seniors."},
{d:"I",q:"A 75-year-old has resting HR 68 bpm and max HR 145. His HRR is:",o:["68 bpm","77 bpm","145 bpm","213 bpm"],a:1,e:"HRR = 145 - 68 = 77."},
{d:"I",q:"A client has severe arthritis in both knees. Which test BEST assesses baseline leg strength and mobility?",o:["30-second sit-to-stand test","Maximum leg press test","1-mile walk test","Vertical jump test"],a:0,e:"It tests a real-life activity (standing from a chair); the others are painful or too intense."},
{d:"I",q:"A 68-year-old answers \"yes\" to multiple PAR-Q questions about chest pain. What should you do?",o:["Ignore it and start a program","Refer them to their physician before exercise","Tell them chest pain goes away with exercise","Have them wear a heart rate monitor"],a:1,e:"Any yes on the PAR-Q requires physician clearance before exercise."},
{d:"I",q:"A 67-year-old reports shortness of breath during moderate exertion and occasional chest discomfort. BEST recommendation?",o:["Start a vigorous aerobic program","Recommend a medical evaluation before beginning exercise","Start light walking and progress as tolerated","Avoid exercise until symptoms resolve"],a:1,e:"Chest discomfort and shortness of breath are red flags requiring medical clearance."},
{d:"II",q:"For a 75-year-old beginner, what is the MOST appropriate starting aerobic intensity?",o:["75-85% Max HR","50-60% Max HR","90%+ Max HR","40-50% Max HR"],a:1,e:"Light intensity is appropriate for a sedentary beginner."},
{d:"II",q:"Resistance training should be done how many days per week for seniors?",o:["1 day per week","2-3 non-consecutive days per week","5-7 days per week","1-2 days per month"],a:1,e:"Minimum 2 days, non-consecutive for recovery."},
{d:"II",q:"A client completes 2 sets × 10 reps of chair squats. What should happen next week?",o:["Increase to heavy weight immediately","Increase to 3 sets","Increase to 12 reps","Change to a different exercise"],a:2,e:"Progression order: reps first, then sets, then weight."},
{d:"II",q:"Which is the SAFEST aerobic option for a client with knee arthritis?",o:["Treadmill running","High-impact aerobic dance","Water aerobics","Stair climbing"],a:2,e:"Zero impact, supportive, adjustable intensity."},
{d:"II",q:"A 70-year-old wants to do resistance training 6 days per week. What do you recommend?",o:["Support this plan","2-3 days/week non-consecutive, other days aerobic or rest","1 day per week","7 days per week"],a:1,e:"Too much resistance training causes overuse. Recovery days and variety are needed."},
{d:"II",q:"A client completes chair squats for 2 sets × 8 reps. What should happen next?",o:["Increase weight immediately","Increase reps to 10","Decrease number of sets","Change to a different exercise"],a:1,e:"Increase reps first, then sets, then weight."},
{d:"II",q:"Max HR 145, resting HR 68 (HRR 77). The target for 60-70% HRR is closest to:",o:["90-105 bpm","105-120 bpm","120-135 bpm","135-150 bpm"],a:1,e:"Target = HRR × % + RHR: about 114-122 bpm; the guide's answer is 105-120."},
{d:"II",q:"The FITT principle stands for:",o:["Flexibility, Intensity, Type, Time","Frequency, Intensity, Time, Type","Fitness, Intensity, Training, Type","Frequency, Intensity, Training, Type"],a:1,e:"FITT = Frequency, Intensity, Time, Type."},
{d:"II",q:"A 72-year-old fears falling and is very sedentary. Which balance level do you start with?",o:["Single-leg stance","Tandem walking","Stationary stance (sitting or standing)","Dynamic movement, eyes closed"],a:2,e:"Balance progresses from static/supported to dynamic."},
{d:"II",q:"Which stretching type is best BEFORE exercise?",o:["Static stretching only","Dynamic stretching","Long-hold stretching","Ballistic (bouncing) stretching"],a:1,e:"Dynamic stretching in the warm-up; static stretching after."},
{d:"II",q:"Protein needs for seniors are approximately:",o:["0.5 g/kg","0.8 g/kg","1.0-1.2 g/kg","2.0 g/kg"],a:2,e:"The study guide lists 1.0-1.2 g/kg body weight for older adults."},
{d:"III",q:"A client with diabetes has blood sugar of 280 mg/dL before exercise. What do you do?",o:["Start exercise as planned","Have them take medication then exercise","Delay exercise until blood sugar is controlled","Have them drink juice and exercise"],a:2,e:"High blood sugar (>250) causes dehydration with exercise."},
{d:"III",q:"Which exercise should be AVOIDED with a hypertensive client?",o:["Walking","Swimming","Isometric exercises (wall sits, planks)","Gentle cycling"],a:2,e:"Isometric exercises cause blood pressure spikes."},
{d:"III",q:"A 68-year-old with osteoporosis asks about aerobic options. Which should be AVOIDED?",o:["Swimming","Water aerobics","High-impact aerobics (jumping, running)","Walking"],a:2,e:"High impact raises fracture risk with osteoporosis."},
{d:"III",q:"A client with arthritis reports joint pain INCREASING during exercise. Correct action?",o:["Push through","Stop exercise and refer to physician","Use lighter weight","Ice the joint and continue"],a:1,e:"Increasing pain is a warning sign. Soreness is OK, pain is not."},
{d:"III",q:"A client has chest pain, severe shortness of breath, and dizziness during exercise. What do you do?",o:["Continue at lower intensity","STOP immediately and call 911","Rest 10 minutes then continue","Check vital signs"],a:1,e:"These are emergency symptoms."},
{d:"III",q:"\"I know exercise is good for me, but I don't really have time.\" Which stage of change?",o:["Precontemplation","Contemplation","Preparation","Action"],a:1,e:"Contemplation: thinking about it but seeing obstacles."},
{d:"III",q:"\"Tell me more about your concerns\" is which OARS technique?",o:["Open-ended questioning","Affirmation","Reflective listening","Summarization"],a:0,e:"OARS = Open-ended questions, Affirmations, Reflective listening, Summarizing."},
{d:"IV",q:"A client's new medication causes dizziness. Appropriate action?",o:["Tell them to stop the medication","Suggest they discuss it with their physician and modify exercise","Tell them to skip it and exercise","Increase intensity to counteract dizziness"],a:1,e:"Never advise on medications. Refer to the physician."},
{d:"IV",q:"A client asks for a personalized diet plan. You have no nutrition credential. What do you do?",o:["Write a basic diet plan","Refer them to a registered dietitian","Tell them diet doesn't matter","Use a popular diet book"],a:1,e:"Outside your scope. Refer to a qualified professional."},
{d:"IV",q:"A client confides suicidal thoughts. Most appropriate?",o:["Keep it confidential","Tell them exercise will help","Encourage immediate professional help","Discuss more to understand"],a:2,e:"Safety crisis. Refer to a mental health professional immediately."},
{d:"IV",q:"A family member asks about the client's progress. What do you do?",o:["Share all details","Ask the client's permission first","Refuse to share anything","Share only height/weight"],a:1,e:"Client confidentiality. Always ask permission."},
{d:"IV",q:"Which marketing claim is INAPPROPRIATE?",o:["\"Help seniors improve strength and balance\"","\"Guaranteed to cure arthritis with our program\"","\"Personalized fitness coaching for older adults\"","\"Evidence-based exercise programming\""],a:1,e:"Exaggerated claims are outside your scope."},
{d:"IV",q:"Which marketing statement is appropriate?",o:["\"Guaranteed to cure arthritis\"","\"We've helped 100% of clients\"","\"Fitness programs can help manage chronic conditions alongside medical care\"","\"Our program eliminates the need for medications\""],a:2,e:"Only this one is honest and within scope."},
{d:"X",q:"What is the best predictor of exercise participation?",o:["Income","Past activity history","Age","Gym location"],a:1,e:"Activity history is the most important personal attribute (ACE cheatsheet)."},
{d:"X",q:"What is the most common excuse for not exercising?",o:["Cost","Injury","Lack of time","Weather"],a:2,e:"Time is the most common excuse (ACE cheatsheet)."},
{d:"X",q:"\"Complete 3 workouts this week\" is what type of goal?",o:["Product goal","Process goal","Outcome-only goal","Vague goal"],a:1,e:"Process goal = behaviors like workouts per week; product goal = e.g. a new PR."},
{d:"X",q:"In the ACE functional movement & resistance training model, Phase 1 is:",o:["Load","Performance","Stability/mobility","Movement"],a:2,e:"Phases: 1 stability/mobility, 2 movement, 3 load, 4 performance."},
{d:"X",q:"How much fluid is recommended 2 hours before exercise?",o:["100-200 mL","500-600 mL","1-1.5 L","250-300 mL"],a:1,e:"500-600 mL 2 h before exercise (ACE cheatsheet)."},
{d:"X",q:"During exercise, drink about 250-300 mL every:",o:["5 min","20-30 min","60 min","90 min"],a:1,e:"Every 20-30 min during exercise; after, 450-675 mL per kg lost."},
{d:"X",q:"Which is NOT one of the three main posture imbalances?",o:["Kyphosis-lordosis","Flat-back","Sway-back","Pronated-back"],a:3,e:"The three: kyphosis-lordosis, flat-back, sway-back."},
{d:"X",q:"Which stage of learning requires the most feedback?",o:["Cognitive","Associative","Autonomous","Maintenance"],a:0,e:"The cognitive stage requires the most feedback."},
{d:"X",q:"The RPE scales used are:",o:["0-5 or 1-3","6-20 or 1-10","1-100","10-50"],a:1,e:"RPE: 6-20 or 1-10."},
{d:"X",q:"In SMART goals, \"T\" stands for:",o:["Tough","Time-bound","Tested","Tracked"],a:1,e:"Specific, Measurable, Attainable, Relevant, Time-bound."},
{d:"X",q:"How many ACE CPT exam questions count toward your score?",o:["100","125","150","175"],a:1,e:"150 questions: 125 scored, 25 experimental (ACE Candidate Handbook)."},
{d:"X",q:"What scaled score passes an ACE certification exam?",o:["400","500","600","700"],a:1,e:"Scaled 200-800, pass at 500."},
{d:"X",q:"Which ACE CPT domain carries the most weight (31%)?",o:["Client Onboarding & Assessments","Program Design & Implementation","Program Modification & Progression","Risk Management & Professional Conduct"],a:1,e:"Domains: I 23%, II 31%, III 27%, IV 19%."},
{d:"X",q:"About what share of ACE CPT questions are video-based?",o:["1%","10%","30%","50%"],a:1,e:"About 10% are silent video questions on exercise movement."},
];
