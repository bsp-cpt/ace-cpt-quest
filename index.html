<body><h1>💪 ACE CPT Quest</h1><div id="app"></div><div id="cf"></div><script>
const QS = [
{d:"I",q:"A 72-year-old client takes medications for hypertension and diabetes but answers \"no\" to all PAR-Q questions. What should you do?",o:["Skip health screening, start exercise immediately","Get physician clearance before exercise begins","Have client check blood pressure before each session","Refer to cardiologist before exercise"],a:2,e:"PAR-Q is negative, so physician clearance may not be required, but monitoring BP/blood sugar during exercise is appropriate."},
{d:"I",q:"During assessment, a 70-year-old reports falling twice in the past year and feeling unsteady. What should be HIGHEST priority?",o:["Cardiovascular fitness","Muscle strength development","Balance training and fall prevention","Weight loss"],a:2,e:"Fall risk is a major concern. Balance training directly addresses this."},
{d:"I",q:"A client's resting heart rate is 72 bpm and you calculate max HR as 148. What is the heart rate reserve?",o:["72 bpm","76 bpm","148 bpm","220 bpm"],a:1,e:"HRR = Max HR - Resting HR = 148 - 72 = 76."},
{d:"I",q:"Which of the following is a red flag during assessment that requires physician referral?",o:["Client reports decreased energy with age","Client answers \"yes\" to PAR-Q question about chest pain","Client has arthritis but wants to exercise","Client is overweight"],a:1,e:"Any \"yes\" to PAR-Q requires physician clearance."},
{d:"I",q:"A client was very sedentary and is now worried about exercise. What baseline assessment is MOST important?",o:["Aerobic fitness test","Resting blood pressure and heart rate","Flexibility test","Strength test"],a:1,e:"Baseline vital signs are most important for safety."},
{d:"I",q:"What is the MOST important first step when working with a new senior client?",o:["Start them on a resistance program","Perform a health screening and assessment","Take them on a 5-mile walk to assess fitness","Enroll them in group classes"],a:1,e:"Always assess before programming."},
{d:"I",q:"A 70-year-old client fell last year and is afraid of falling. What should you prioritize?",o:["Intense cardio to build confidence","Heavy resistance training","Balance training and fall prevention strategies","Flexibility training only"],a:2,e:"Fall risk is one of the highest priorities for seniors."},
{d:"I",q:"A 75-year-old has resting HR 68 bpm and max HR 145. His HRR is:",o:["68 bpm","77 bpm","145 bpm","213 bpm"],a:1,e:"HRR = 145 - 68 = 77."},
{d:"I",q:"A client has severe arthritis in both knees. Which test BEST assesses baseline leg strength and mobility?",o:["30-second sit-to-stand test","Maximum leg press test","1-mile walk test","Vertical jump test"],a:0,e:"It tests a real-life activity (standing from a chair); the others are painful or too intense."},
{d:"I",q:"A 68-year-old answers \"yes\" to multiple PAR-Q questions about chest pain. What should you do?",o:["Ignore it and start a program","Refer them to their physician before exercise","Tell them chest pain goes away with exercise","Have them wear a heart rate monitor"],a:1,e:"Any yes on the PAR-Q requires physician clearance before exercise."},
{d:"I",q:"A 67-year-old reports shortness of breath during moderate exertion and occasional chest discomfort. BEST recommendation?",o:["Start a vigorous aerobic program","Recommend a medical evaluation before beginning exercise","Start light walking and progress as tolerated","Avoid exercise until symptoms resolve"],a:1,e:"Chest discomfort and shortness of breath are red flags requiring medical clearance."},
{d:"II",q:"For a 75-year-old beginner, what is the MOST appropriate starting aerobic intensity?",o:["75-85% Max HR","50-60% Max HR","90%+ Max HR","40-50% Max HR"],a:1,e:"Light intensity is appropriate for a sedentary beginner."},
{d:"II",q:"Resistance training should be done how many days per week for seniors?",o:["1 day per week","2-3 non-consecutive days per week","5-7 days per week","1-2 days per month"],a:1,e:"Minimum 2 days, non-consecutive for recovery."},
{d:"II",q:"A client completes 2 sets × 10 reps of chair squats. What should happen next week?",o:["Increase to heavy weight immediately","Increase to 3 sets","Increase to 12 reps","Change to a different exercise"],a:2,e:"Progression order: reps first, then sets, then weight."},
{d:"II",q:"Which is the SAFEST aerobic option for a client with knee arthritis?",o:["Treadmill running","High-impact aerobic dance","Water aerobics","Stair climbing"],a:2,e:"Zero impact, supportive, adjustable intensity."},
{d:"II",q:"A 70-year-old wants to do resistance training 6 days per week. What do you recommend?",o:["Support this plan","2-3 days/week non-consecutive, other days aerobic or rest","1 day per week","7 days per week"],a:1,e:"Too much resistance training causes overuse. Recovery days and variety are needed."},
{d:"II",q:"A client completes chair squats for 2 sets × 8 reps. What should happen next?",o:["Increase weight immediately","Increase reps to 10","Decrease number of sets","Change to a different exercise"],a:1,e:"Increase reps first, then sets, then weight."},
{d:"II",q:"Max HR 145, resting HR 68 (HRR 77). The target for 60-70% HRR is closest to:",o:["90-105 bpm","105-120 bpm","120-135 bpm","135-150 bpm"],a:1,e:"Target = HRR × % + RHR: about 114-122 bpm; the guide's answer is 105-120."},
{d:"II",q:"The FITT principle stands for:",o:["Flexibility, Intensity, Type, Time","Frequency, Intensity, Time, Type","Fitness, Intensity, Training, Type","Frequency, Intensity, Training, Type"],a:1,e:"FITT = Frequency, Intensity, Time, Type."},
{d:"II",q:"A 72-year-old fears falling and is very sedentary. Which balance level do you start with?",o:["Single-leg stance","Tandem walking","Stationary stance (sitting or standing)","Dynamic movement, eyes closed"],a:2,e:"Balance progresses from static/supported to dynamic."},
{d:"II",q:"Which stretching type is best BEFORE exercise?",o:["Static stretching only","Dynamic stretching","Long-hold stretching","Ballistic (bouncing) stretching"],a:1,e:"Dynamic stretching in the warm-up; static stretching after."},
{d:"II",q:"Protein needs for seniors are approximately:",o:["0.5 g/kg","0.8 g/kg","1.0-1.2 g/kg","2.0 g/kg"],a:2,e:"The study guide lists 1.0-1.2 g/kg body weight for older adults."},
{d:"III",q:"A client with diabetes has blood sugar of 280 mg/dL before exercise. What do you do?",o:["Start exercise as planned","Have them take medication then exercise","Delay exercise until blood sugar is controlled","Have them drink juice and exercise"],a:2,e:"High blood sugar (>250) causes dehydration with exercise."},
{d:"III",q:"Which exercise should be AVOIDED with a hypertensive client?",o:["Walking","Swimming","Isometric exercises (wall sits, planks)","Gentle cycling"],a:2,e:"Isometric exercises cause blood pressure spikes."},
{d:"III",q:"A 68-year-old with osteoporosis asks about aerobic options. Which should be AVOIDED?",o:["Swimming","Water aerobics","High-impact aerobics (jumping, running)","Walking"],a:2,e:"High impact raises fracture risk with osteoporosis."},
{d:"III",q:"A client with arthritis reports joint pain INCREASING during exercise. Correct action?",o:["Push through","Stop exercise and refer to physician","Use lighter weight","Ice the joint and continue"],a:1,e:"Increasing pain is a warning sign. Soreness is OK, pain is not."},
{d:"III",q:"A client has chest pain, severe shortness of breath, and dizziness during exercise. What do you do?",o:["Continue at lower intensity","STOP immediately and call 911","Rest 10 minutes then continue","Check vital signs"],a:1,e:"These are emergency symptoms."},
{d:"III",q:"\"I know exercise is good for me, but I don't really have time.\" Which stage of change?",o:["Precontemplation","Contemplation","Preparation","Action"],a:1,e:"Contemplation: thinking about it but seeing obstacles."},
{d:"III",q:"\"Tell me more about your concerns\" is which OARS technique?",o:["Open-ended questioning","Affirmation","Reflective listening","Summarization"],a:0,e:"OARS = Open-ended questions, Affirmations, Reflective listening, Summarizing."},
{d:"IV",q:"A client's new medication causes dizziness. Appropriate action?",o:["Tell them to stop the medication","Suggest they discuss it with their physician and modify exercise","Tell them to skip it and exercise","Increase intensity to counteract dizziness"],a:1,e:"Never advise on medications. Refer to the physician."},
{d:"IV",q:"A client asks for a personalized diet plan. You have no nutrition credential. What do you do?",o:["Write a basic diet plan","Refer them to a registered dietitian","Tell them diet doesn't matter","Use a popular diet book"],a:1,e:"Outside your scope. Refer to a qualified professional."},
{d:"IV",q:"A client confides suicidal thoughts. Most appropriate?",o:["Keep it confidential","Tell them exercise will help","Encourage immediate professional help","Discuss more to understand"],a:2,e:"Safety crisis. Refer to a mental health professional immediately."},
{d:"IV",q:"A family member asks about the client's progress. What do you do?",o:["Share all details","Ask the client's permission first","Refuse to share anything","Share only height/weight"],a:1,e:"Client confidentiality. Always ask permission."},
{d:"IV",q:"Which marketing claim is INAPPROPRIATE?",o:["\"Help seniors improve strength and balance\"","\"Guaranteed to cure arthritis with our program\"","\"Personalized fitness coaching for older adults\"","\"Evidence-based exercise programming\""],a:1,e:"Exaggerated claims are outside your scope."},
{d:"IV",q:"Which marketing statement is appropriate?",o:["\"Guaranteed to cure arthritis\"","\"We've helped 100% of clients\"","\"Fitness programs can help manage chronic conditions alongside medical care\"","\"Our program eliminates the need for medications\""],a:2,e:"Only this one is honest and within scope."},
{d:"X",q:"What is the best predictor of exercise participation?",o:["Income","Past activity history","Age","Gym location"],a:1,e:"Activity history is the most important personal attribute (ACE cheatsheet)."},
{d:"X",q:"What is the most common excuse for not exercising?",o:["Cost","Injury","Lack of time","Weather"],a:2,e:"Time is the most common excuse (ACE cheatsheet)."},
{d:"X",q:"\"Complete 3 workouts this week\" is what type of goal?",o:["Product goal","Process goal","Outcome-only goal","Vague goal"],a:1,e:"Process goal = behaviors like workouts per week; product goal = e.g. a new PR."},
{d:"X",q:"In the ACE functional movement & resistance training model, Phase 1 is:",o:["Load","Performance","Stability/mobility","Movement"],a:2,e:"Phases: 1 stability/mobility, 2 movement, 3 load, 4 performance."},
{d:"X",q:"How much fluid is recommended 2 hours before exercise?",o:["100-200 mL","500-600 mL","1-1.5 L","250-300 mL"],a:1,e:"500-600 mL 2 h before exercise (ACE cheatsheet)."},
{d:"X",q:"During exercise, drink about 250-300 mL every:",o:["5 min","20-30 min","60 min","90 min"],a:1,e:"Every 20-30 min during exercise; after, 450-675 mL per kg lost."},
{d:"X",q:"Which is NOT one of the three main posture imbalances?",o:["Kyphosis-lordosis","Flat-back","Sway-back","Pronated-back"],a:3,e:"The three: kyphosis-lordosis, flat-back, sway-back."},
{d:"X",q:"Which stage of learning requires the most feedback?",o:["Cognitive","Associative","Autonomous","Maintenance"],a:0,e:"The cognitive stage requires the most feedback."},
{d:"X",q:"The RPE scales used are:",o:["0-5 or 1-3","6-20 or 1-10","1-100","10-50"],a:1,e:"RPE: 6-20 or 1-10."},
{d:"X",q:"In SMART goals, \"T\" stands for:",o:["Tough","Time-bound","Tested","Tracked"],a:1,e:"Specific, Measurable, Attainable, Relevant, Time-bound."},
{d:"X",q:"How many ACE CPT exam questions count toward your score?",o:["100","125","150","175"],a:1,e:"150 questions: 125 scored, 25 experimental (ACE Candidate Handbook)."},
{d:"X",q:"What scaled score passes an ACE certification exam?",o:["400","500","600","700"],a:1,e:"Scaled 200-800, pass at 500."},
{d:"X",q:"Which ACE CPT domain carries the most weight (31%)?",o:["Client Onboarding & Assessments","Program Design & Implementation","Program Modification & Progression","Risk Management & Professional Conduct"],a:1,e:"Domains: I 23%, II 31%, III 27%, IV 19%."},
{d:"X",q:"About what share of ACE CPT questions are video-based?",o:["1%","10%","30%","50%"],a:1,e:"About 10% are silent video questions on exercise movement."},
];

const NEWL={"L": [{"title": "Anatomy & Kinesiology", "icon": "🦴", "cards": [{"h": "Planes of motion", "b": "Sagittal plane: flexion/extension (squat, curl). Frontal plane: abduction/adduction (lateral raise, jumping jack). Transverse plane: rotation (trunk twist)."}, {"h": "Muscle roles", "b": "Agonist = prime mover. Antagonist = opposes it. Synergist = assists. Stabilizer = holds a joint steady."}, {"h": "Muscle actions", "b": "Concentric = shortening under load. Eccentric = lengthening under load (most soreness/DOMS). Isometric = no length change."}, {"h": "Key muscles", "b": "Quadriceps extend the knee. Hamstrings flex the knee and extend the hip. Gluteus maximus extends the hip. Latissimus dorsi extends/adducts the shoulder."}, {"h": "Anatomical terms", "b": "Anterior = front, posterior = back. Medial = toward midline, lateral = away. Proximal = closer to trunk, distal = farther."}, {"h": "Rotator cuff & core", "b": "Rotator cuff (SITS): supraspinatus, infraspinatus, teres minor, subscapularis. Transverse abdominis is the deepest abdominal muscle."}], "qs": [{"q": "A biceps curl occurs mainly in which plane?", "o": ["Sagittal", "Frontal", "Transverse", "Oblique"], "a": 0, "e": "Elbow flexion/extension is sagittal-plane motion."}, {"q": "A lateral shoulder raise occurs in which plane?", "o": ["Sagittal", "Frontal", "Transverse", "Horizontal"], "a": 1, "e": "Abduction/adduction occur in the frontal plane."}, {"q": "A seated trunk rotation occurs in which plane?", "o": ["Sagittal", "Frontal", "Transverse", "Coronal"], "a": 2, "e": "Rotation occurs in the transverse plane."}, {"q": "Lowering into a squat, the quadriceps are contracting:", "o": ["Concentrically", "Eccentrically", "Isometrically", "Not at all"], "a": 1, "e": "They lengthen under load to control the descent: eccentric."}, {"q": "Which muscle action is most linked to delayed-onset muscle soreness (DOMS)?", "o": ["Concentric", "Isometric", "Eccentric", "Isokinetic"], "a": 2, "e": "Eccentric (lengthening)  "qs": [{"q": "Which energy system dominates a 100-meter sprint (about 10 seconds)?", "o": ["Aerobic", "Phosphagen (ATP-PC)", "Fat oxidation", "Krebs cycle only"], "a": 1, "e": "Phosphagen supplies all-out efforts of up to about 10 seconds."}, {"q": "Which system mainly fuels a 60-90 second all-out effort?", "o": ["Phosphagen", "Anaerobic glycolysis", "Aerobic", "Ketone"], "a": 1, "e": "Anaerobic glycolysis dominates roughly 10 seconds to 2 minutes."}, {"q": "Which system mainly fuels a 30-minute jog?", "o": ["Phosphagen", "Anaerobic glycolysis", "Aerobic (oxidative)", "None"], "a": 2, "e": "Long, steady efforts rely on aerobic metabolism."}, {"q": "Cardiac output equals:", "o": ["HR × stroke volume", "HR × blood pressure", "Stroke volume ÷ HR", "VO2 × HR"], "a": 0, "e": "Q = heart rate × stroke volume."}, {"q": "The gold-standard measure of cardiorespiratory fitness is:", "o": ["Resting HR", "VO2max", "BMI", "Blood pressure"], "a": 1, "e": "VO2max is maximal oxygen uptake."}, {"q": "During low-intensity exercise, the predominant fuel is:", "o": ["Carbohydrate", "Fat", "Protein", "Alcohol"], "a": 1, "e": "Fat contributes more at rest and low intensity."}, {"q": "Which fiber type is most fatigue resistant?", "o": ["Type I (slow-twitch)", "Type IIx", "Type IIa", "All equal"], "a": 0, "e": "Type I fibers are aerobic and fatigue resistant."}, {"q": "The molecule that directly powers muscle contraction is:", "o": ["Glucose", "ATP", "Lactate", "Creatine"], "a": 1, "e": "ATP is the immediate energy source."}, {"q": "At the first ventilatory threshold (VT1), a client typically:", "o": ["Cannot speak at all", "Can speak but not comfortably", "Is at rest", "Is at maximal effort"], "a": 1, "e": "Talk test: at VT1 talking becomes noticeably harder."}, {"q": "Which describes Type II (fast-twitch) fibers?", "o": ["Slow and endurance-oriented", "Powerful but fatigue quickly", "Only used at rest", "Rich in fat storage only"], "a": 1, "e": "Type II fibers generate force and power but fatigue faster."}]}, {"title": "ACE IFT Model", "icon": "🧭", "cards": [{"h": "What it is", "b": "The ACE Integrated Fitness Training (IFT) Model has two components, Cardiorespiratory Training and Muscular Training. Each has three phases, and any cardio phase can be paired with any muscular phase."}, {"h": "Cardio phases", "b": "Base Training → Fitness Training → Performance Training."}, {"h": "Muscular phases", "b": "Functional Training → Movement Training → Load/Speed Training."}, {"h": "Three-zone model", "b": "Zone 1: below VT1. Zone 2: VT1 to just below VT2. Zone 3: at or above VT2. Speech in zone 3 is limited to single words."}, {"h": "Base Training", "b": "For anyone not already doing consistent moderate cardio. Build to 20+ minutes, 3-5 days/week, below VT1 (talk comfortably). No cardio assessment needed in this phase."}, {"h": "Five movement patterns", "b": "Movement Training focuses on bend-and-lift, single-leg, pushing, pulling and rotational movements. Master them before adding external load."}], "qs": [{"q": "The ACE IFT Model's two training components are:", "o": ["Cardio and nutrition", "Cardiorespiratory Training and Muscular Training", "Flexibility and balance", "Strength and power"], "a": 1, "e": "IFT = Cardiorespiratory Training + Muscular Training."}, {"q": "Which is NOT a phase of IFT Cardiorespiratory Training?", "o": ["Base Training", "Fitness Training", "Movement Training", "Performance Training"], "a": 2, "e": "Cardio phases: Base, Fitness, Performance. Movement Training is a muscular phase."}, {"q": "The first phase of IFT Muscular Training is:", "o": ["Load/Speed Training", "Movement Training", "Functional Training", "Performance Training"], "a": 2, "e": "Functional Training establishes postural stability and kinetic chain mobility."}, {"q": "The IFT Muscular Training phase that applies external loads, HIIT, plyometrics and speed work is:", "o": ["Functional Training", "Movement Training", "Load/Speed Training", "Base Training"], "a": 2, n 5-10 minutes to gradually lower heart rate."}, {"h": "Progression", "b": "Increase duration before intensity. Raise total volume gradually, often no more than about 10% per week."}, {"h": "Intervals", "b": "Interval training alternates work and recovery bouts; it fits later phases once an aerobic base exists."}, {"h": "Talk test", "b": "If a client can talk comfortably, they are below VT1 (moderate-light)."}], "qs": [{"q": "Minimum weekly moderate aerobic activity for adults:", "o": ["60 min", "90 min", "150 min", "300 min"], "a": 2, "e": "150 minutes of moderate (or 75 vigorous) per week."}, {"q": "Minimum weekly vigorous aerobic activity for adults:", "o": ["30 min", "75 min", "150 min", "200 min"], "a": 1, "e": "75 minutes of vigorous activity is the equivalent."}, {"q": "Estimated max HR for a 40-year-old using 220 − age:", "o": ["170 bpm", "180 bpm", "190 bpm", "200 bpm"], "a": 1, "e": "220 − 40 = 180 bpm."}, {"q": "Using the Tanaka formula, estimated max HR for a 50-year-old is:", "o": ["165 bpm", "173 bpm", "180 bpm", "190 bpm"], "a": 1, "e": "208 − 0.7 × 50 = 173 bpm."}, {"q": "When progressing cardio for a beginner, increase which first?", "o": ["Intensity", "Duration", "Impact", "Incline only"], "a": 1, "e": "Increase duration before intensity."}, {"q": "A typical warm-up lasts:", "o": ["1 minute", "5-10 minutes", "30 minutes", "Not needed"], "a": 1, "e": "5-10 minutes of low-intensity activity."}, {"q": "A cool-down mainly helps:", "o": ["Build max strength", "Gradually return HR and BP toward rest", "Burn more fat", "Replace stretching"], "a": 1, "e": "It prevents blood pooling and lowers HR gradually."}, {"q": "A client can talk comfortably while cycling. Intensity is likely:", "o": ["Above VT2", "Below VT1", "Maximal", "Anaerobic"], "a": 1, "e": "Comfortable talking = below VT1."}, {"q": "A common guideline limits weekly volume increases to about:", "o": ["10%", "25%", "50%", "100%"], "a": 0, "e": "Gradual progression of about 10% per week limits overuse risk."}, {"q": "Interval training is best introduced:", "o": ["Day one for every client", "After an aerobic base is established", "Only for seniors", "Never"], "a": 1, "e": "Intervals fit later phases after a base."}]}, {"title": "Resistance Programming", "icon": "💪", "cards": [{"h": "Rep ranges", "b": "Muscular endurance: 12+ reps at lower loads. Hypertrophy: about 6-12 reps. Strength: 6 or fewer reps at heavy loads (NSCA/ACE)."}, {"h": "Rest", "b": "Endurance: 30 seconds or less. Hypertrophy: 30-90 seconds. Strength: 2-5 minutes."}, {"h": "Frequency", "b": "Train each major muscle group 2-3 days/week with at least 48 hours between sessions for the same group."}, {"h": "Progressive overload", "b": "Gradually increase the demand. The 2-for-2 rule: if a client does 2 more reps than the goal in the final set for 2 sessions in a row, add load."}, {"h": "Specificity (SAID)", "b": "Specific Adaptation to Imposed Demands: the body adapts to the exact type of training stress."}, {"h": "Breathing & order", "b": "Exhale during exertion; avoid the Valsalva maneuver. Do large multi-joint exercises before small single-joint ones."}], "qs": [{"q": "Which rep range best targets maximal strength?", "o": ["15-20", "12-15", "6 or fewer", "25+"], "a": 2, "e": "Heavy loads at 6 or fewer reps build strength."}, {"q": "Typical hypertrophy rep range:", "o": ["1-3", "6-12", "15-25", "30+"], "a": 1, "e": "About 6-12 reps per set."}, {"q": "Rest between sets for maximal strength:", "o": ["15 seconds", "30 seconds", "2-5 minutes", "10 minutes"], "a": 2, "e": "Heavy strength sets need 2-5 minutes."}, {"q": "Rest between muscular endurance sets:", "o": ["30 seconds or less", "3 minutes", "5 minutes", "10 minutes"], "a": 0, "e": "Short rest supports endurance."}, {"q": "Minimum recovery between sessions for the same muscle group:", "o": ["12 hours", "24 hours", "48 hours", "1 week"], "a": 2, "e": "Allow about 48 hours."}, {"q": "The 2-for-2 rule tells you when to:", "o": ["Rest 2 days", "Increase load", "Cut 2 sets", "Test 1RM"], "a": 1, "e": "2 extra reps in the last set for 2 sessions = add load."}, {"q": "The SAID principle refers to:", "o": ["Safety And Injury Defense", "Specific Adaptation to Imposed Demands", "Strength And Intensity Development", "Sets And Intervals Design"], "a": 1, "e": "Adaptation is specific to the training stress."}, {"q": "When should a client exhale during a squat?", "o": ["Lowering phase", "Rising (exertion) phase", "Never", "Hold breath throughout"], "a": 1, "e": "Exhale during exertion; avoid breath holding."}, {"q": "Holding the breath while straining against a closed airway is the:", "o": ["Karvonen method", "Valsalva maneuver", "Talk test", "Borg scale"], "a": 1, "e": "The Valsalva maneuver sharply raises blood pressure."}, {"q": "Which order is generally recommended within a session?", "o": ["Small single-joint before large multi-joint", "Large multi-joint before small single-joint", "Random", "Machines only"], "a": 1, "e": "Multi-joint lifts first, while the client is fresh."}]}, {"title": "Assessments & Testing", "icon": "📏", "cards": [{"h": "Order of assessments", "b": "Health screening first. Then resting vitals (HR, BP), body composition/anthropometrics, then movement, fitness tests."}, {"h": "Blood pressure", "b": "Normal is below 120/80 mmHg (AHA). Hypertension stage 1 starts at 130-139 systolic or 80-89 diastolic."}, {"h": "Body composition", "b": "BMI = weight (kg) ÷ height (m)². BMI 18.5-24.9 normal, 25-29.9 overweight, 30+ obese. Waist circumference adds risk info."}, {"h": "Movement screens", "b": "Observe posture and movements (squat, hinge, push, pull, single-leg) to spot compensations before loading."}, {"h": "Fitness tests", "b": "Push-up test (muscular endurance), YMCA bike or Rockport walk (aerobic), sit-and-reach (hamstring/low back flexibility), 1RM or predicted 1RM (strength)."}, {"h": "Resting HR", "b": "Take it in the morning before getting out of bed for the most accurate reading."}], "qs": [{"q": "Normal blood pressure per the AHA is:", "o": ["Below 120/80 mmHg", "Below 140/90", "Exactly 130/85", "Above 120/80"], "a": 0, "e": "Normal is under 120/80 mmHg."}, {"q": "A BMI of 27 is classified as:", "o": ["Normal", "Overweight", "Obese", "Underweight"], "a": 1, "e": "25-29.9 is overweight."}, {"q": "BMI is calculated as:", "o": ["Height ÷ weight", "Weight (kg) ÷ height (m)²", "Waist ÷ hip", "Weight × height"], "a": 1, "e": "kg divided by meters squared."}, {"q": "The sit-and-reach test assesses:", "o": ["Aerobic capacity", "Hamstring and low-back flexibility", "Grip strength", "Balance"], "a": 1, "e": "It measures flexibility of hamstrings/low back."}, {"q": "The push-up test measures:", "o": ["Max strength", "Upper-body muscular endurance", "Flexibility", "Power"], "a": 1, "e": "Reps to fatigue = muscular endurance."}, {"q": "The Rockport walk test estimates:", "o": ["Body fat", "Aerobic fitness (VO2max)", "Flexibility", "Balance"], "a": 1, "e": "A 1-mile walk test estimating VO2max."}, {"q": "The best time to measure resting heart rate is:", "o": ["After a workout", "Morning before getting out of bed", "After coffee", "At night after dinner"], "a": 1, "e": "Morning before rising gives the truest resting value."}, {"q": "What should happen BEFORE any fitness testing?", "o": ["Max strength test", "Health screening", "Interval workout", "Body fat test"], "a": 1, "e": "Screening always comes first."}, {"q": "A reading of 132/84 mmHg is classified (AHA) as:", "o": ["Normal", "Elevated", "Stage 1 hypertension", "Hypertensive crisis"], "a": 2, "e": "130-139 or 80-89 is stage 1."}, {"q": "Why observe movement patterns before loading?", "o": ["To sell sessions", "To spot compensations and imbalances", "It replaces screening", "To find max strength"], "a": 1, "e": "Movement screens reveal compensations to address first."}]}, {"title": "Behavior Change & Communication", "icon": "🗣️", "cards": [{"h": "Transtheoretical Model", "b": "Stages: precontemplation (not intending), contemplation (thinking, ambivalent), preparation (planning, some activity), action (under 6 months), maintenance (6+ months)."}, {"h": "Self-efficacy", "b": "Belief in one's ability to succeed. It is a strong predictor of adherence; build it with early successes."}, {"h": "Rapport stages", "b": "Rapport, investigation, planning, action. Trust comes before programming."}, {"h": "Communication", "b": "Active listening, open-ended questions, and positive non-verbal cues (eye contact, open posture) build trust."}, {"h": "Motivation", "b": "Intrinsic motivation (enjoyment) sustains behavior longer than extrinsic rewards."}, {"h": "Learning & feedback", "b": "Stages of learning: cognitive, associative, autonomous. Give more feedback early, less as skill improves."}], "qs": [{"q": "A client has exercised regularly for 3 months. Stage of change?", "o": ["Preparation", "Action", "Maintenance", "Contemplation"], "a": 1, "e": "Action = regular activity under 6 months."}, {"q": "A client has exercised consistently for 8 months. Stage?", "o": ["Action", "Maintenance", "Preparation", "Termination"], "a": 1, "e": "Maintenance = 6+ months."}, {"q": "\"I have no interest in exercising.\" Stage?", "o": ["Precontemplation", "Contemplation", "Preparation", "Action"], "a": 0, "e": "Not intending to change = precontemplation."}, {"q": "A client walks occasionally and has bought gym shoes, planning to start next month. Stage?", "o": ["Precontemplation", "Contemplation", "Preparation", "Maintenance"], "a": 2, "e": "Preparation: planning and some activity."}, {"q": "Belief in one's ability to complete a task is called:", "o": ["Self-esteem", "Self-efficacy", "Extrinsic motivation", "Locus of control"], "a": 1, "e": "Self-efficacy strongly predicts adherence."}, {"q": "Which motivation tends to sustain exercise longest?", "o": ["Extrinsic rewards", "Intrinsic enjoyment", "Fear", "Punishment"], "a": 1, "e": "Intrinsic motivation is more durable."}, {"q": "Which is an example of active listening?", "o": ["Planning your reply while they talk", "Paraphrasing what the client said", "Looking at your phone", "Interrupting with advice"], "a": 1, "e": "Reflecting/paraphrasing shows understanding."}, {"q": "The first stage of the client-trainer relationship is:", "o": ["Action", "Planning", "Rapport", "Investigation"], "a": 2, "e": "Rapport comes first."}, {"q": "Which non-verbal behavior builds rapport?", "o": ["Crossed arms", "Eye contact and open posture", "Checking the clock", "Standing over a seated client"], "a": 1, "e": "Open, attentive body language builds trust."}, {"q": "Best way to raise a new client's self-efficacy:", "o": ["Start with very hard workouts", "Provide early, achievable successes", "Compare them to athletes", "Avoid feedback"], "a": 1, "e": "Mastery experiences build self-efficacy."}]}, {"title": "Nutrition Basics", "icon": "🥗", "cards": [{"h": "Energy values", "b": "Carbohydrate 4 kcal/g, protein 4 kcal/g, fat 9 kcal/g, alcohol 7 kcal/g."}, {"h": "Macronutrient ranges", "b": "AMDR for adults: carbohydrate 45-65%, fat 20-35%, protein 10-35% of calories."}, {"h": "Protein", "b": "RDA is 0.8 g/kg/day for adults; active people often need more."}, {"h": "Guidance tools", "b": "MyPlate (ChooseMyPlate) and the Dietary Guidelines for Americans are public resources trainers can share."}, {"h": "Scope", "b": "Trainers can share general, evidence-based guidelines. Prescribing meal plans or treating disease with diet belongs to registered dietitians."}, {"h": "Energy balance", "b": "A pound of body fat is often estimated at about 3,500 kcal; weight change reflects energy intake vs. expenditure."}], "qs": [{"q": "How many kcal per gram does fat provide?", "o": ["4", "7", "9", "12"], "a": 2, "e": "Fat = 9 kcal/g."}, {"q": "How many kcal per gram does carbohydrate provide?", "o": ["2", "4", "7", "9"], "a": 1, "e": "Carbohydrate = 4 kcal/g."}, {"q": "How many kcal per gram does alcohol provide?", "o": ["4", "7", "9", "0"], "a": 1, "e": "Alcohol = 7 kcal/g."}, {"q": "The adult AMDR for carbohydrate is:", "o": ["10-35%", "20-35%", "45-65%", "70-80%"], "a": 2, "e": "45-65% of daily calories."}, {"q": "The adult AMDR for fat is:", "o": ["5-10%", "20-35%", "45-65%", "50-70%"], "a": 1, "e": "20-35% of daily calories."}, {"q": "The protein RDA for healthy adults is:", "o": ["0.3 g/kg", "0.8 g/kg", "2.5 g/kg", "4 g/kg"], "a": 1, "e": "0.8 g per kg body weight per day."}, {"q": "Which is within a personal trainer's scope?", "o": ["Prescribing a meal plan for diabetes", "Sharing Dietary Guidelines/MyPlate info", "Recommending supplements to treat disease", "Diagnosing a deficiency"], "a": 1, "e": "Sharing public, evidence-based guidance is in scope."}, {"q": "A meal with 30 g carbohydrate, 20 g protein, 10 g fat has how many kcal?", "o": ["290", "330", "250", "400"], "a": 0, "e": "30×4 + 20×4 + 10×9 = 120 + 80 + 90 = 290."}, {"q": "A pound of body fat is commonly estimated at about:", "o": ["500 kcal", "1,000 kcal", "3,500 kcal", "10,000 kcal"], "a": 2, "e": "About 3,500 kcal."}, {"q": "Who should create individualized meal plans for medical conditions?", "o": ["Personal trainer", "Registered dietitian", "Gym receptionist", "Any coach"], "a": 1, "e": "Medical nutrition therapy is the dietitian's role."}]}, {"title": "Special Populations", "icon": "🧓", "cards": [{"h": "Older adults", "b": "Prioritize balance, functional strength, and fall prevention. Progress gradually."}, {"h": "Hypertension", "b": "Avoid Valsalva and heavy isometric holds. Beta-blockers blunt heart rate, so use RPE instead of HR targets."}, {"h": "Diabetes", "b": "Watch for hypoglycemia (shaky, sweaty, confused). Have fast-acting carbs available. Check feet in those with neuropathy."}, {"h": "Pregnancy", "b": "Healthy pregnant clients can usually continue moderate exercise (ACOG). After about 20 weeks, avoid prolonged lying flat on the back (ACOG). Stop with warning signs such as bleeding."}, {"h": "Asthma", "b": "Keep the rescue inhaler nearby; use a longer warm-up. Exercise-induced bronchoconstriction can be triggered by cold, dry air."}, {"h": "Youth & obesity", "b": "Youth: 60 minutes of activity daily. Clients with obesity: low-impact, longer-duration activity and attention to heat and joint stress."}], "qs": [{"q": "A client on beta-blockers: how should you monitor intensity?", "o": ["Heart rate targets only", "RPE", "Max HR testing", "Do not monitor"], "a": 1, "e": "Beta-blockers blunt HR response; use RPE."}, {"q": "A diabetic client becomes shaky, sweaty, and confused. Likely problem?", "o": ["Hyperglycemia", "Hypoglycemia", "Dehydration only", "Asthma"], "a": 1, "e": "These are classic hypoglycemia signs; give fast-acting carbs."}, {"q": "After about 20 weeks of pregnancy, clients should avoid:", "o": ["Walking", "Prolonged lying flat on the back", "Swimming", "Stationary cycling"], "a": 1, "e": "Lying supine can compress the aorta and vena cava and lower blood pressure (ACOG)."}, {"q": "Which pregnant client symptom means stop exercise and seek care?", "o": ["Mild fatigue", "Vaginal bleeding", "Light sweating", "Normal breathing"], "a": 1, "e": "Bleeding is a warning sign (ACOG)."}, {"q": "A client with asthma should:", "o": ["Leave the inhaler at home", "Keep the rescue inhaler nearby and warm up longer", "Exercise only in cold, dry air", "Avoid all exercise"], "a": 1, "e": "Longer warm-ups and an accessible inhaler reduce risk."}, {"q": "Children and adolescents should get how much physical activity?", "o": ["30 min/week", "60 min daily", "150 min daily", "10 min daily"], "a": 1, "e": "60 minutes of moderate-to-vigorous activity daily."}, {"q": "A good first cardio choice for a client with obesity and sore knees:", "o": ["Box jumps", "Stationary cycling or water exercise", "Sprint intervals", "Running hills"], "a": 1, "e": "Low-impact options reduce joint stress."}, {"q": "Clients with hypertension should avoid:", "o": ["Breath holding (Valsalva)", "Walking", "Light cycling", "Swimming"], "a": 0, "e": "Breath holding spikes blood pressure."}, {"q": "A diabetic client with peripheral neuropathy needs:", "o": ["Barefoot training", "Regular foot checks and proper footwear", "Only high-impact work", "No hydration"], "a": 1, "e": "Neuropathy hides foot injuries."}, {"q": "What should a trainer keep available for clients with diabetes?", "o": ["Fast-acting carbohydrate (e.g., juice)", "Caffeine pills", "Salt tablets", "Nothing"], "a": 0, "e": "To treat hypoglycemia quickly."}]}, {"title": "Injury Prevention & Emergencies", "icon": "🚑", "cards": [{"h": "Emergency basics", "b": "Know the facility's emergency plan and maintain CPR/AED certification (required for ACE certification)."}, {"h": "Acute injury", "b": "For a soft-tissue injury, use RICE: Rest, Ice, Compression, Elevation, and refer as needed."}, {"h": "Heat illness", "b": "Heat exhaustion: heavy sweating, weakness, nausea. Heat stroke: very high core temperature with confusion or collapse. It's an emergency: call 911 and cool immediately, ideally with cold-water immersion."}, {"h": "Common injuries", "b": "Strain = muscle/tendon injury. Sprain = ligament injury. Overuse injuries (tendinitis, shin splints) come from doing too much too soon."}, {"h": "Cardiac emergency", "b": "Unresponsive and not breathing normally: call 911, start CPR, use an AED as soon as available."}, {"h": "Fainting & balance", "b": "If a client feels faint, stop, have them sit or lie down, and monitor. Spot clients and keep floors clear."}], "qs": [{"q": "A ligament injury is called a:", "o": ["Strain", "Sprain", "Fracture", "Contusion"], "a": 1, "e": "Sprain = ligament; strain = muscle/tendon."}, {"q": "A muscle or tendon injury is called a:", "o": ["Sprain", "Strain", "Dislocation", "Bursitis"], "a": 1, "e": "A strain involves muscle or tendon."}, {"q": "RICE stands for:", "o": ["Run, Ice, Cool, Exit", "Rest, Ice, Compression, Elevation", "Rest, Inflate, Compress, Exercise", "Rehab, Ice, Care, Evaluate"], "a": 1, "e": "Rest, Ice, Compression, Elevation."}, {"q": "A client is confused with a very high body temperature after training in heat. Action?", "o": ["Have them walk it off", "Call 911 and cool them rapidly", "Give a heavy meal", "Continue at lower intensity"], "a": 1, "e": "Suspected heat stroke: call 911 and cool immediately (cold-water immersion is most effective)."}, {"q": "A client collapses, is unresponsive, and not breathing normally. First actions?", "o": ["Give water", "Call 911, start CPR, get the AED", "Wait 10 minutes", "Drive them home"], "a": 1, "e": "Activate EMS, CPR, and AED immediately."}, {"q": "Which certification must ACE trainers hold to certify?", "o": ["Nutrition license", "Current CPR/AED", "Massage license", "Physical therapy degree"], "a": 1, "e": "ACE requires current CPR/AED certification."}, {"q": "Shin splints in a new runner most often result from:", "o": ["Too much too soon", "Too little stretching only", "Eating carbs", "Using an AED"], "a": 0, "e": "Overuse from rapid increases in training load."}, {"q": "Heavy sweating, weakness, and nausea in the heat most likely indicate:", "o": ["Heat exhaustion", "Hypothermia", "Hypoglycemia only", "Concussion"], "a": 0, "e": "Move to a cool place, hydrate, and monitor."}, {"q": "A client feels lightheaded during exercise. What do you do first?", "o": ["Push for one more set", "Stop, have them sit or lie down, and monitor", "Increase intensity", "Leave them alone"], "a": 1, "e": "Stop and position safely to prevent a fall."}, {"q": "A key way to reduce injury risk on the gym floor is:", "o": ["Spotting and keeping walkways clear", "Training without warm-up", "Ignoring equipment checks", "Maximal loads for beginners"], "a": 0, "e": "Supervision and a safe environment prevent accidents."}]}, {"title": "Legal & Professional", "icon": "📜", "cards": [{"h": "Negligence", "b": "Failing to act as a reasonable, prudent trainer would. Elements: duty, breach, causation, damages."}, {"h": "Risk documents", "b": "Informed consent explains risks. A waiver (release) asks the client to give up the right to sue for ordinary negligence. Neither protects against gross negligence."}, {"h": "Insurance", "b": "Carry professional liability insurance, even when working for a gym."}, {"h": "Privacy", "b": "Keep client records confidential and secure; health information is shared only with consent."}, {"h": "Employment", "b": "Employees get training, benefits and tax withholding from the employer; independent contractors manage their own taxes and insurance."}, {"h": "Keeping current", "b": "ACE certification is renewed every 2 years with 2.0 CECs (20 hours) of continuing education plus current CPR/AED."}], "qs": [{"q": "Which is NOT an element of negligence?", "o": ["Duty", "Breach", "Causation", "Profit"], "a": 3, "e": "Duty, breach, causation, damages."}, {"q": "A document asking the client to give up the right to sue for ordinary negligence is a:", "o": ["Informed consent", "Waiver/release", "PAR-Q", "Contract of sale"], "a": 1, "e": "A waiver releases claims of ordinary negligence."}, {"q": "Informed consent primarily:", "o": ["Releases all liability", "Explains the risks and benefits of the program", "Sets prices", "Diagnoses conditions"], "a": 1, "e": "It informs the client of risks."}, {"q": "Waivers generally do NOT protect against:", "o": ["Ordinary mistakes", "Gross negligence", "Client injuries from normal risks", "Nothing"], "a": 1, "e": "Gross negligence is not covered."}, {"q": "Should a trainer employed by a gym carry their own liability insurance?", "o": ["Never", "Yes, it is recommended", "Only on weekends", "Only for group classes"], "a": 1, "e": "Professional liability insurance is recommended."}, {"q": "How often must ACE certification be renewed?", "o": ["Every year", "Every 2 years", "Every 5 years", "Never"], "a": 1, "e": "Every two years."}, {"q": "ACE recertification requires how many CECs?", "o": ["0.5", "1.0", "2.0", "5.0"], "a": 2, "e": "2.0 CECs (20 contact hours)."}, {"q": "An independent contractor trainer typically:", "o": ["Has taxes withheld by the gym", "Handles their own taxes and insurance", "Gets employee benefits", "Cannot set rates"], "a": 1, "e": "Contractors manage their own taxes/insurance."}, {"q": "A trainer leaves client health forms on the front desk. This violates:", "o": ["Scope of practice", "Confidentiality", "Progressive overload", "SAID"], "a": 1, "e": "Health information must stay secure."}, {"q": "A client is injured because the trainer ignored a reported warning sign. This is likely:", "o": ["Negligence", "Informed consent", "Good practice", "A waiver"], "a": 0, "e": "Failing to act as a prudent professional = negligence."}]}], "extra": {"q": "Which of these is a process goal?", "o": ["Lose 10 pounds", "Walk 30 minutes, 5 days a week", "Fit into old jeans", "Win a race"], "a": 1, "e": "Process goals are behaviors; the others are outcome (product) goals."}};

const CARDS={"Screening & Assessment": [["Why screening comes first", "Pre-participation health screening is the process of identifying, before any exercise or testing, whether a client has signs, symptoms, or known disease that make exercise unsafe without medical input. The ACSM screening algorithm rests on three questions: Is the client currently physically active (structured, moderate exercise at least 30 minutes, 3 days a week, for the last 3 months)? Do they have known cardiovascular, metabolic (type 1 or type 2 diabetes), or renal disease? Do they have signs or symptoms of those diseases? Only after screening can a trainer choose safe assessments and a starting intensity, so screening is always the first step with a new client, ahead of any fitness test, walk, or class. **Exam tip: When a question asks for the FIRST or MOST important step with a new client, the answer is almost always health screening and assessment.**"], ["PAR-Q+ and medical clearance", "The PAR-Q+ (Physical Activity Readiness Questionnaire for Everyone) is a self-report tool. A \"no\" to every question means the client can usually begin light-to-moderate exercise; a \"yes\" leads to follow-up questions and, depending on the answers, medical clearance. Questionnaires do not override known disease. Under ACSM rules, an inactive client with known cardiovascular, metabolic, or renal disease needs medical clearance before starting exercise even if they feel well, and any client with symptoms (chest discomfort, unusual breathlessness, dizziness or fainting, ankle swelling, palpitations, calf pain with walking) must stop and obtain clearance. Medical clearance means a health care provider approves exercise; the provider, not the trainer, decides whether further testing is needed. **Exam tip: A client taking medication for diabetes or heart disease who is inactive needs medical clearance first, even with an all-\"no\" questionnaire.**"], ["Red-flag symptoms", "Certain symptoms suggest heart, metabolic, or kidney disease and change what a trainer may do. ACSM lists pain or discomfort in the chest, neck, jaw, or arms; shortness of breath at rest or with mild exertion; dizziness or fainting; breathlessness when lying down or waking at night; ankle swelling; palpitations or a racing heart; leg pain during walking (claudication); a known heart murmur; and unusual fatigue. Before a program starts, any of these means referral for medical evaluation rather than a cautious start. During a session, severe chest pain, marked breathlessness, or dizziness means stopping exercise immediately and activating emergency medical services (calling 911). **Exam tip: Chest pain or discomfort plus shortness of breath is never something to train through. Before exercise, refer; during exercise, stop and call 911.**"], ["Resting vitals as baselines", "Resting heart rate (HR) and blood pressure (BP) are the safest and most important baseline measures for a deconditioned or anxious client. They require no exertion, reveal problems such as high blood pressure before exercise begins, and give a reference point for tracking progress. Resting HR is most accurate when measured in the morning before getting out of bed, by counting the radial or carotid pulse for 30 to 60 seconds. Blood pressure is taken seated after about 5 minutes of quiet rest, with the arm supported at heart level and the correct cuff size. Readings above 180/120 mmHg warrant prompt medical referral rather than exercise. Typical adult resting HR is 60 to 100 beats per minute, and fit clients often run lower. **Exam tip: For a sedentary or worried new client, the MOST important baseline is resting heart rate and blood pressure, not a fitness test.**"], ["Heart rate reserve and the Karvonen method", "Heart rate reserve (HRR) is the difference between maximal and resting heart rate: HRR = HRmax − HRrest. The Karvonen method uses it to set training zones: Target HR = (HRR × desired intensity %) + HRrest. Example: HRmax 145, HRrest 68 gives HRR = 77; at 60 percent, 77 × 0.60 + 68 = 114 bpm, and at 70 percent, 77 × 0.70 + 68 = 122 bpm. Because it accounts for resting HR, %HRR tracks oxygen use better than a simple percentage of maximal HR. Remember that HRmax is usually estimated (220 − age, or the more accurate Tanaka formula 208 − 0.7 × age), so any zone has error and should be checked against how the client feels (RPE, talk test). **Exam tip: Always subtract resting HR to get HRR, multiply by the percentage, then add resting HR back. Forgetting to add it back is the classic wrong answer.**"], ["Falls and functional testing in older adults", "Falls are a leading cause of injury in older adults, and a history of falls, unsteadiness, or fear of falling is a strong predictor of future falls. When a client reports these, balance training and fall-prevention strategies become the top programming priority, ahead of cardio fitness, heavy strength work, or weight loss. Functional tests measure real-life ability with low risk. The 30-second chair stand (sit-to-stand) test counts how many full stands a client completes from a standard chair with arms crossed in 30 seconds; it reflects lower-body strength and is safe for people with arthritis. Maximal leg-press tests, vertical jumps, or long walks are inappropriate for frail or arthritic clients. **Exam tip: For an older client with falls or knee arthritis, pick the answer that is functional and low-risk (balance work, 30-second sit-to-stand) over anything maximal or high-impact.**"]], "Program Design": [["The FITT framework", "FITT stands for Frequency (sessions per week), Intensity (how hard: %HRR, RPE, talk test, or %1RM), Time (duration of the session or bout), and Type (the mode, such as walking, cycling, or resistance machines). Some texts add Volume and Progression (FITT-VP), where volume is the product of frequency, intensity, and time. Every exercise prescription, for cardio, resistance, or flexibility, can be written in FITT terms, and every progression changes at least one variable. Adjusting one variable at a time lets a trainer see what the client tolerates. For a new or older client, frequency and time usually rise first, and intensity rises last. **Exam tip: FITT is Frequency, Intensity, Time, Type. Distractors swap in words like \"Flexibility,\" \"Fitness,\" or \"Training\"; reject them.**"], ["Starting intensity for sedentary and older beginners", "A deconditioned or older beginner should start at light-to-moderate intensity, and progress gradually. In ACSM terms, light intensity is 30 to under 40 percent of HRR (RPE 9 to 11 on the 6-20 scale) and moderate is 40 to under 60 percent of HRR (RPE 12 to 13). Expressed as a percentage of maximal heart rate, the study guide's starting zone for a sedentary 70-plus beginner is about 50 to 60 percent of HRmax. Starting low reduces cardiac and orthopedic risk, limits soreness, and gives early successes that build self-efficacy and adherence. Vigorous zones (75 to 90 percent of HRmax and above) are inappropriate on day one. **Exam tip: For a sedentary senior beginner, choose the lowest reasonable moderate range (about 50 to 60 percent of maximal HR) and reject 75 percent or higher.**"], ["Setting a cardio target with the Karvonen formula", "Once a starting intensity is chosen, the Karvonen (heart rate reserve) method turns it into a heart-rate range. Step 1: find heart rate reserve, HRR = HRmax − HRrest. Step 2: multiply HRR by the lower and upper intensity percentages. Step 3: add resting heart rate back to each result. For a client with an estimated HRmax of 145 bpm and a resting heart rate of 68 bpm, HRR is 77. At 60 percent: 77 × 0.60 = 46.2, plus 68 = about 114 bpm. At 70 percent: 77 × 0.70 = 53.9, plus 68 = about 122 bpm. The training range is therefore about 114 to 122 bpm. Because HRmax is estimated, confirm the range with RPE and the talk test, and use RPE alone for clients on beta-blockers. **Exam tip: In Karvonen problems, subtract resting HR, multiply by the percentage, then ADD resting HR back; answers that skip the last step are traps.**"], ["Resistance training frequency and recovery", "Resistance training stresses muscle tissue, and the adaptations happen during recovery. The Physical Activity Guidelines for Americans recommend muscle-strengthening activities for all major muscle groups on 2 or more days per week, and ACSM recommends that the same muscle group not be trained on consecutive days, allowing at least 48 hours of recovery. For an older or beginning client, 2 to 3 non-consecutive days per week is the standard. Lifting 6 or 7 days a week on the same muscles raises the risk of overuse injury, joint pain, and burnout; the other days can hold aerobic, balance, or flexibility work, or rest. **Exam tip: \"2 to 3 non-consecutive days per week\" is the textbook answer for resistance frequency. \"More is better\" or daily lifting is a trap.**"], ["Progression order: reps, then sets, then load", "Progressive overload means gradually increasing the demand placed on the body so that it continues to adapt. For beginners and older adults the study materials teach a conservative order: first add repetitions (for example from 8 to 10, or 10 to 12) within the target range; once the client completes the top of the range with good form, add a set; only then increase resistance, typically by about 5 percent, dropping back to the lower end of the rep range. Changing one variable at a time keeps the jump in total workload small and lets the trainer judge tolerance. Jumping straight to heavy weight, or changing the exercise before it is mastered, is not progression. **Exam tip: When a client has completed the planned sets and reps comfortably, the next step is usually to increase repetitions first, not weight.**"], ["Choosing the mode: low-impact options", "Mode (the \"Type\" in FITT) should fit the client's joints, balance, and preferences. Water exercise is a classic choice for clients with knee or hip arthritis or obesity: buoyancy reduces the load on weight-bearing joints, warm water can ease stiffness, and intensity is easy to adjust. Other low-impact options include stationary or recumbent cycling, elliptical training, and walking on level ground. High-impact choices such as running, jumping, step aerobics, and stair climbing raise joint loading several times above body weight and are poor first choices for arthritic knees. **Exam tip: For arthritis or painful knees, the safest aerobic answer is the low-impact one, usually water aerobics or cycling, never running, jumping, or stair climbing.**"], ["Balance progression and stretching", "Balance training progresses from stable to unstable and from simple to complex: seated or supported standing, then feet together, then tandem (heel-to-toe) stance, then single-leg stance, then dynamic tasks such as tandem walking, then reduced vision or head turns. A sedentary client who fears falling should begin at the most stable level, sitting or standing with support. For flexibility, dynamic stretching (controlled movement through the range, such as leg swings or arm circles) is best in the warm-up because it raises tissue temperature without reducing force output. Static stretching, holding a mild stretch for about 10 to 30 seconds, fits best after exercise. Ballistic bouncing is avoided for general clients. **Exam tip: Before exercise: dynamic stretching. After exercise: static stretching. Fearful beginners start with stationary, supported balance.**"]], "Health Conditions & Behavior": [["Diabetes and blood glucose before exercise", "For clients with diabetes, blood glucose should be checked before exercise when the client uses insulin or glucose-lowering drugs. The American Diabetes Association states that when glucose is above 250 mg/dL, ketones should be tested; exercise should not be done if moderate-to-large ketones are present, and vigorous exercise should be delayed until glucose falls below 250 mg/dL, because hard exercise can push glucose higher. A personal trainer cannot test ketones or adjust medication, so with an uncontrolled client at 280 mg/dL the safe choice is to postpone and involve the client's health care provider. Low glucose is the opposite danger: below 70 mg/dL, give about 15 grams of fast-acting carbohydrate, wait 15 minutes, and recheck. **Exam tip: A pre-exercise reading above 250 mg/dL in an uncontrolled client means delay exercise; juice is for LOW blood sugar, not high.**"], ["Hypertension and osteoporosis", "Hypertension (stage 1 begins at 130/80 mmHg) calls for regular aerobic exercise and moderate resistance training, which both lower blood pressure. The danger is breath-holding: the Valsalva maneuver, exhaling against a closed airway while straining, causes sharp spikes in blood pressure, and heavy, sustained isometric holds such as long wall sits or planks invite it. Teach continuous breathing, exhaling on exertion. Osteoporosis is low bone mineral density with high fracture risk. Clients benefit from resistance and balance training, but should avoid high-impact moves such as jumping and running, as well as loaded spinal flexion and twisting, which raise the risk of vertebral and hip fractures. **Exam tip: Hypertension: avoid breath-holding and heavy isometric holds. Osteoporosis: avoid high impact and loaded forward flexion.**"], ["Arthritis pain and emergency signs", "Arthritis clients benefit from regular, low-impact exercise, but a trainer must distinguish normal discomfort from warning pain. Mild muscle soreness 24 to 48 hours after exercise is normal; joint pain that increases during exercise, or lasts more than about 2 hours afterward, signals that the joint is being overloaded. When pain rises during a session, stop that exercise and refer the client to their physician rather than pushing through, icing and continuing, or simply lowering the weight. Some signs are emergencies: chest pain, severe shortness of breath, and dizziness during exercise suggest a cardiac event. Stop immediately, call 911, and be ready to start CPR and use an AED. **Exam tip: Pain that INCREASES during exercise means stop and refer. Chest pain with breathlessness and dizziness means stop and call 911; checking vitals first wastes time.**"], ["Stages of change", "The Transtheoretical Model describes readiness to change. Precontemplation: not intending to start within 6 months, often uninterested. Contemplation: intending to start within 6 months, aware of benefits but held back by barriers (\"I know it's good for me, but I don't have time\"). Preparation: intending to start within 30 days, often already doing some activity. Action: exercising regularly for less than 6 months, the stage with the highest risk of relapse. Maintenance: exercising regularly for 6 months or more. Each stage needs a different strategy: information for precontemplators, weighing pros and cons and lowering barriers for contemplators, concrete plans for preparers, and relapse prevention for action and maintenance. **Exam tip: Look for time words. \"Thinking about it but\" is contemplation; regular exercise for under 6 months is action; 6 months or more is maintenance.**"], ["OARS and adherence", "Motivational interviewing uses the OARS skills. Open-ended questions invite detail (\"Tell me more about your concerns\"). Affirmations recognize strengths and effort. Reflective listening repeats or paraphrases what the client said to show understanding. Summarizing pulls the conversation together and checks agreement. On adherence, the best predictor of whether someone will keep exercising is their past exercise history; previous success makes future participation more likely. The most common reason people give for not exercising is lack of time, so programs should be short, convenient, and scheduled. Other barriers include cost, low motivation, pain, and lack of support. **Exam tip: \"Tell me more…\" is an open-ended question. The strongest predictor of adherence is past activity history, and the most common excuse is lack of time.**"], ["Stages of motor learning", "Clients learn new exercises in three stages. In the cognitive stage the client is figuring out what to do; movements are slow, inconsistent, and effortful, and the client needs the most instruction, demonstration, and feedback. In the associative stage the basic pattern is in place and the client refines it, making fewer errors and needing less feedback. In the autonomous stage the movement is automatic and the client can perform it while attending to other things. Trainers should give frequent, simple, specific feedback early, one cue at a time, then gradually reduce feedback so the client learns to self-correct. Over-coaching an autonomous client wastes time and can disrupt performance. **Exam tip: The cognitive (first) stage requires the MOST feedback. The autonomous stage requires the least.**"]], "Scope, Ethics & the Exam": [["Scope of practice: medications and diagnosis", "A personal trainer's scope of practice is limited to designing and leading safe, effective exercise for apparently healthy people or those cleared by a health care provider. Trainers do not diagnose conditions, prescribe treatment, or advise clients to start, stop, or change medications. When a client reports a new medication with side effects such as dizziness, the right response is twofold: encourage them to talk with their prescribing physician or pharmacist, and modify the session for safety (for example slower position changes, more seated or supported work, and avoiding fast changes in head position). Telling a client to stop a drug, or pushing harder to overcome dizziness, is outside scope and dangerous. **Exam tip: Medication questions always point to the physician. The trainer refers and modifies exercise; the trainer never adjusts medication.**"], ["Scope of practice: nutrition and mental health", "ACE's nutrition scope of practice allows trainers to share general, evidence-based guidance from public sources such as the Dietary Guidelines for Americans and MyPlate, and to support healthy habits. Trainers may not create individualized meal plans, give medical nutrition therapy for a disease, or recommend supplements to treat conditions; those requests go to a registered dietitian or physician. Mental health is similar. If a client discloses thoughts of suicide, the trainer is not a counselor and confidentiality does not outweigh safety: express concern, encourage the client to seek professional help immediately, and help connect them to it (in the U.S., the 988 Suicide & Crisis Lifeline; call 911 if danger is imminent). **Exam tip: Personalized diet plan means refer to a registered dietitian. Suicidal thoughts mean urging immediate professional help, not keeping it secret or counseling.**"], ["Confidentiality and honest marketing", "Client health and progress information is confidential. Trainers share it with anyone else, including spouses, adult children, or other staff, only with the client's permission, and keep paper and electronic records secure. Even if a family member is friendly, the client must agree first. Marketing must be truthful and within scope. Claims to cure, guarantee, or eliminate the need for medication (\"guaranteed to cure arthritis,\" \"100 percent of clients improve,\" \"no more medications\") are misleading and imply medical treatment. Acceptable statements describe realistic, evidence-based benefits, such as improving strength and balance or helping manage chronic conditions alongside medical care. **Exam tip: Always ask the client's permission before sharing information. In marketing questions, the right answer is the modest, evidence-based claim; anything \"guaranteed\" or \"cure\" is wrong.**"], ["Exam format and scoring", "The ACE Certified Personal Trainer exam has 150 multiple-choice questions: 125 scored items and 25 experimental items being tested for future exams. Candidates cannot tell which items are experimental, so every question deserves full effort. The time limit is 3 hours, about 1.2 minutes per question. Raw results are converted to a scaled score from 200 to 800, and a scaled score of 500 or higher passes. Scaling makes different versions of the exam comparable in difficulty, so the passing standard does not depend on which form a candidate receives. Candidates must hold a current adult CPR/AED certificate, and the certification is renewed every 2 years. **Exam tip: Remember 150 questions, 125 scored, 3 hours, and a pass at a scaled score of 500 on a 200 to 800 scale.**"], ["Domain weights and video questions", "ACE's current exam content outline, based on a 2022 role delineation study and in effect since August 21, 2023, divides the exam into four domains. Domain I, Client Onboarding and Assessments: 23 percent. Domain II, Program Design and Implementation: 31 percent, the largest. Domain III, Program Modification and Progression: 27 percent. Domain IV, Risk Management, Professional Conduct, and Ethical Business Practices: 19 percent. About 10 percent of questions are video-based: a short silent clip shows a person performing a common exercise, and the candidate decides what is observed or whether to continue or modify the exercise. Studying should be weighted to match, with extra time on program design and progression. **Exam tip: Program Design and Implementation is the heaviest domain at 31 percent; video questions are about 10 percent of the exam.**"]], "ACE Cheatsheet Speed Round": [["Red flags before starting", "When a new client reports shortness of breath during moderate effort together with occasional chest discomfort, those are signs of possible cardiovascular disease. ACSM's screening rules say anyone with such symptoms should not begin or continue an exercise program until a health care provider has evaluated them and given medical clearance. A trainer should not \"start light and see,\" design a vigorous program to build fitness, or simply tell the client to wait until symptoms go away; symptoms that come and go still need evaluation. Document the conversation and the referral, and resume programming only once clearance is received and any restrictions are known. **Exam tip: Chest discomfort plus breathlessness at moderate effort means recommend a medical evaluation BEFORE exercise begins.**"], ["Protein needs of older adults", "Protein supports muscle repair and helps slow age-related muscle loss (sarcopenia). The Recommended Dietary Allowance for healthy adults is 0.8 grams per kilogram of body weight per day, a minimum that prevents deficiency in nearly all people, not an optimal target. Expert groups on aging recommend about 1.0 to 1.2 grams per kilogram per day for healthy older adults, and more for those who are ill or very active, with intake spread across meals. A 70-kilogram older client would therefore aim for roughly 70 to 84 grams a day. Trainers can share this general guidance, but individualized prescriptions for clients with kidney disease or other conditions belong to a dietitian or physician. **Exam tip: In the senior-fitness materials, the target protein intake for older adults is 1.0 to 1.2 g/kg per day, higher than the 0.8 g/kg adult RDA.**"], ["Goals: SMART, process, and product", "SMART goals are Specific, Measurable, Attainable, Relevant, and Time-bound. \"Walk 30 minutes, 5 days a week for the next 4 weeks\" is SMART; \"get in shape\" is not. Goals are also classified by what they target. A process goal is a behavior the client controls, such as the number of workouts per week or minutes walked per day. A product (outcome) goal is a result, such as losing 10 pounds, fitting into old jeans, setting a new personal record, or winning a race. Process goals build self-efficacy because they can be achieved every week, and they drive the outcomes. Goals should be revisited, reassessed, and reset often. **Exam tip: If the goal describes a behavior the client does (\"3 workouts this week\"), it is a process goal; if it describes a result (\"lose 10 pounds\"), it is a product goal.**"], ["The ACE IFT phases in brief", "ACE's Integrated Fitness Training (IFT) Model, as updated in 2020 for the current textbook, has two independent components, each with three phases. Muscular Training moves from Functional Training (posture, core, balance, and mobility) to Movement Training (the five primary movement patterns) to Load/Speed Training (external load, power, and speed). Cardiorespiratory Training moves from Base Training to Fitness Training to Performance Training. Older study materials describe four phases (for example \"stability and mobility, movement, load, performance\"), so read questions carefully and use the current names on the exam. A client with poor posture and core control starts in Functional Training whatever their cardio phase. **Exam tip: In the current model the first Muscular Training phase is Functional Training, and the first cardio phase is Base Training.**"], ["Hydration guidelines", "Dehydration of as little as about 2 percent of body weight can impair performance and raise heat-illness risk. ACE's guidance: drink 17 to 20 ounces (about 500 to 600 mL) of fluid 2 to 3 hours before exercise; drink 7 to 10 ounces (about 200 to 300 mL) every 10 to 20 minutes during exercise; and after exercise drink 16 to 24 ounces (about 475 to 700 mL) for every pound of body weight lost. Weighing a client before and after a long session shows how much was lost. For sessions longer than about an hour, or in heat, a sports drink with carbohydrate and sodium can help. Pale yellow urine is a simple sign of adequate hydration. **Exam tip: Remember 17 to 20 oz 2 to 3 hours before, 7 to 10 oz every 10 to 20 minutes during, and 16 to 24 oz per pound lost after.**"], ["Posture deviations and RPE", "The ACE cheatsheet lists three common postural imbalances. Kyphosis-lordosis posture shows an exaggerated upper-back curve and increased low-back arch with an anterior pelvic tilt. Flat-back posture shows reduced low-back curve with a posterior pelvic tilt. Sway-back posture shows the hips pushed forward with a long upper-back curve. Scoliosis is a separate condition: a lateral curve of the spine with vertebral rotation. Effort is often monitored with the rating of perceived exertion (RPE). The original Borg scale runs from 6 (no exertion) to 20 (maximal exertion), roughly matching heart rate divided by 10, and the category-ratio scale runs from 0 or 1 to 10. **Exam tip: The three imbalances are kyphosis-lordosis, flat-back, and sway-back; RPE scales are 6-20 and 0/1-10.**"]], "Anatomy & Kinesiology": [["Anatomical position and directional terms", "All anatomical directions are described from anatomical position: standing upright, facing forward, arms at the sides with palms facing forward. Anterior (ventral) means toward the front, posterior (dorsal) toward the back. Superior means above and inferior below. Medial means toward the body's midline, lateral away from it. Proximal and distal are used on the limbs: proximal is closer to the trunk or the limb's point of attachment, distal is farther away. So the knee is distal to the hip and proximal to the ankle, and the thumb lies on the lateral side of the hand in anatomical position. Superficial means nearer the surface and deep means farther beneath it. **Exam tip: Proximal and distal compare positions along a limb. The knee is DISTAL to the hip because it is farther from the trunk.**"], ["The three planes of motion", "Movements are described by the plane in which they occur. The sagittal plane divides the body into left and right; flexion and extension happen here, as in a biceps curl, squat, lunge, walking, or a crunch. The frontal (coronal) plane divides front from back; abduction, adduction, and lateral flexion happen here, as in a lateral shoulder raise, side lunge, or jumping jack. The transverse (horizontal) plane divides upper from lower; rotation happens here, as in trunk rotation, a golf swing, or turning the head. Most daily activities combine planes, so ACE programs train all three rather than only sagittal-plane machines. **Exam tip: Flexion/extension = sagittal; abduction/adduction = frontal; rotation = transverse. Match the movement word to the plane.**"], ["Muscle actions: concentric, eccentric, isometric", "A concentric action is a muscle shortening while it produces force, such as the biceps lifting a dumbbell or the quadriceps straightening the knee to stand up. An eccentric action is a muscle lengthening while producing force to control or brake a movement, such as the quadriceps lowering the body into a squat or the biceps lowering a dumbbell. An isometric action produces force with no change in muscle length, as in holding a plank or a wall sit. Eccentric actions can generate the most force and cause the most microscopic muscle damage, which is why they are most associated with delayed-onset muscle soreness (DOMS), typically peaking 24 to 72 hours after unaccustomed exercise. **Exam tip: Lowering against gravity is usually eccentric, and eccentric work is the classic cause of DOMS.**"], ["Muscle roles in a movement", "Muscles take on different roles in each movement. The agonist, or prime mover, is mainly responsible for the movement, such as the biceps brachii during an elbow curl. The antagonist opposes the agonist and must relax or lengthen to allow the motion, such as the triceps during that curl. Synergists assist the agonist or neutralize unwanted motion, for example the brachialis and brachioradialis during elbow flexion. Stabilizers contract, usually isometrically, to hold a joint or body segment steady so the agonist can work, such as the rotator cuff holding the shoulder during a push-up. Agonist and antagonist pairs commonly trained in balance include the quadriceps and hamstrings, and the chest and upper back. **Exam tip: \"Prime mover\" always means agonist; the muscle that opposes it is the antagonist.**"], ["Key lower-body muscles", "The quadriceps (rectus femoris, vastus lateralis, vastus medialis, and vastus intermedius) extend the knee, and the rectus femoris also flexes the hip because it crosses that joint. The hamstrings (biceps femoris, semitendinosus, and semimembranosus) cross both the hip and knee; they flex the knee and extend the hip, which is why they work in both leg curls and hip hinges such as Romanian deadlifts. The gluteus maximus is the main hip extensor and also rotates the hip outward; the gluteus medius abducts the hip and stabilizes the pelvis during single-leg stance. The gastrocnemius and soleus plantar-flex the ankle. **Exam tip: Hamstrings = knee flexion PLUS hip extension. Questions often pair the actions incorrectly to trap you.**"], ["Rotator cuff and deep core", "The rotator cuff is four muscles that hold the head of the humerus in the shallow shoulder socket: Supraspinatus (initiates abduction), Infraspinatus and Teres minor (external rotation), and Subscapularis (internal rotation), remembered as SITS. Teres major is NOT part of the rotator cuff; it helps extend and internally rotate the shoulder alongside the latissimus dorsi. In the trunk, the abdominal wall has four layers from superficial to deep: rectus abdominis, external oblique, internal oblique, and transverse abdominis. The transverse abdominis, the deepest, wraps the trunk like a corset and stiffens the spine before limb movement, which is why core-stability training targets it. **Exam tip: SITS: supraspinatus, infraspinatus, teres MINOR, subscapularis. Teres major is the usual trick answer.**"]], "Exercise Physiology & Energy Systems": [["ATP: the energy currency", "Adenosine triphosphate (ATP) is the only molecule muscle can use directly to contract. Breaking one phosphate bond releases energy for cross-bridge cycling and for pumps that move calcium and sodium. Muscle stores only enough ATP for a few seconds of intense work, so it must be continuously regenerated. Three energy systems do this: the phosphagen system (ATP-PC), glycolysis, and the oxidative (aerobic) system. All three are always active, but their relative contributions shift with intensity and duration. Fats, carbohydrates, and to a small extent protein are fuels for regenerating ATP; glucose, lactate, and creatine are not used directly for contraction. **Exam tip: The molecule that DIRECTLY powers muscle contraction is ATP; everything else is a fuel used to rebuild ATP.**"], ["Phosphagen and glycolytic systems", "The phosphagen (ATP-PC) system uses stored creatine phosphate to rebuild ATP in a single, extremely fast reaction. It powers maximal efforts of about 0 to 10 seconds, such as a 100-meter sprint, a heavy single lift, or a jump, and its stores take roughly 2 to 5 minutes to refill. Anaerobic (fast) glycolysis breaks down glucose or muscle glycogen without needing oxygen, producing ATP quickly along with lactate and hydrogen ions. It dominates very hard efforts of roughly 10 seconds to 2 minutes, such as a 400-meter run or a 60 to 90 second all-out bout. As effort extends past about 2 to 3 minutes, the oxidative system takes over. **Exam tip: About 10 seconds or less = phosphagen; about 10 seconds to 2 minutes = anaerobic glycolysis; longer = aerobic.**"], ["The oxidative system and fuel use", "The oxidative (aerobic) system produces ATP in the mitochondria using oxygen, through the Krebs cycle and the electron transport chain. It is slower than the anaerobic systems but has a nearly unlimited capacity, so it supplies most of the energy for any steady effort lasting more than a few minutes, such as a 30-minute jog, cycling, or swimming. Both fats and carbohydrates are oxidized. At rest and during low-intensity exercise, fat supplies a larger share of energy; as intensity rises, the body shifts toward carbohydrate, which yields ATP faster per unit of oxygen. This \"crossover\" is why the first ventilatory threshold marks a shift toward carbohydrate use. **Exam tip: Long, steady exercise = aerobic system. Low intensity = mostly fat; higher intensity = mostly carbohydrate.**"], ["VO2max and cardiac output", "VO2max (maximal oxygen uptake) is the greatest rate at which the body can take in, transport, and use oxygen during exhaustive exercise, expressed in mL of oxygen per kilogram of body weight per minute. It is the gold-standard measure of cardiorespiratory fitness and is measured directly with gas analysis or estimated with field tests. Cardiac output (Q) is the volume of blood the heart pumps per minute: Q = heart rate × stroke volume. Stroke volume is the blood ejected per beat. Endurance training increases stroke volume, which is why trained people have lower resting heart rates while maintaining the same cardiac output. The Fick equation links these ideas: VO2 = Q × the oxygen extracted by tissues. **Exam tip: Cardiac output = heart rate × stroke volume, and VO2max is the gold standard for aerobic fitness.**"], ["Ventilatory thresholds and the talk test", "As intensity rises, breathing increases in two distinct jumps. The first ventilatory threshold (VT1) marks the point where carbohydrate use and lactate production rise and breathing quickens; below VT1 a client can talk comfortably, and at VT1 talking becomes noticeably harder, although still possible. The second ventilatory threshold (VT2) marks rapid lactate accumulation, roughly the classic lactate threshold; at or above VT2 a client can say only single words, and exercise can be sustained only briefly. Intensities just below VT2 can be held for about 20 to 30 minutes. The talk test is a simple field method: if reciting a short passage becomes uncomfortable, the client has reached about VT1. **Exam tip: Comfortable talking = below VT1. Talking possible but not comfortable = around VT1. Single words only = at or above VT2.**"], ["Muscle fiber types", "Skeletal muscle contains a mix of fiber types. Type I (slow-twitch) fibers have many mitochondria, rich capillary supply, and high myoglobin; they contract slowly with low force but resist fatigue, so they dominate posture and endurance activity. Type II (fast-twitch) fibers contract quickly and forcefully but fatigue faster. Type IIa fibers are intermediate, with both good force and moderate oxidative capacity, while Type IIx are the most powerful and least fatigue resistant. Fibers are recruited in order of size: small Type I motor units first, larger Type II units as force needs rise. Genetics largely determine the proportion, but training shifts the characteristics of fibers. **Exam tip: Type I = slow, aerobic, fatigue resistant. Type II = fast, powerful, fatigues quickly.**"]], "ACE IFT Model": [["Structure of the ACE IFT Model", "The ACE Integrated Fitness Training (ACE IFT) Model is ACE's client-centered system for designing, implementing, and progressing programs. Since the 2020 update used in the current textbook, it has two training components, Cardiorespiratory Training and Muscular Training, each with three phases. The components are independent: a client can be in any cardio phase and any muscular phase at the same time, for example cardio Fitness Training combined with muscular Functional Training. The model is built on rapport and behavior change, with assessments chosen for each phase rather than all at once. Not every client will, or needs to, reach the final phases, which are aimed at athletic or performance goals. **Exam tip: Two components, three phases each, combined independently. A distractor saying phases must match by number is wrong.**"], ["Cardiorespiratory phases", "Cardiorespiratory Training has three phases. Base Training builds consistency: any client not already doing regular moderate cardio starts here, progressing duration and frequency to 20 minutes or more, 3 to 5 days per week, below VT1 (RPE about 3 to 4 on a 0-10 scale). No cardio assessment is required. Fitness Training is for clients who can do 20 or more minutes of moderate cardio
