 at least 3 days per week; it lengthens sessions and adds zone 2 intervals (VT1 to just below VT2, RPE about 5 to 6), and the submaximal talk test for VT1 may be used. Performance Training serves endurance or sport goals, adding zone 3 intervals at or above VT2 (RPE 7 to 10), guided by a VT2 threshold assessment. **Exam tip: The cardio phases are Base, Fitness, Performance. \"Movement Training\" belongs to Muscular Training.**"], ["The three-zone intensity model", "ACE programs cardio intensity with three zones anchored to each client's own ventilatory thresholds rather than estimated maximal heart rate. Zone 1 is below VT1: talking is comfortable, and exercise can last a long time. Zone 2 runs from VT1 to just below VT2: the client is unsure whether they can talk comfortably, and effort can be held for moderate durations. Zone 3 is at or above VT2: speech is limited to single words, and efforts last only short intervals. Heart rates at VT1 and VT2 can be found with the talk test and a VT2 threshold assessment. ACE prefers these markers to percentages of predicted maximal heart rate because prediction equations carry large errors. **Exam tip: Zone 1 < VT1; Zone 2 = VT1 to just below VT2; Zone 3 ≥ VT2.**"], ["Muscular phases", "Muscular Training also has three phases. Functional Training establishes or restores postural stability and kinetic chain mobility through core, balance, flexibility, and muscular-endurance work, mostly with body weight; a client with poor posture or core control starts here. Movement Training teaches efficient performance of the five primary movement patterns in all planes without losing postural control. Load/Speed Training applies external loads and higher force demands for strength, hypertrophy, endurance, body composition, or athletic goals, using resistance training, high-intensity interval training, plyometrics, speed work, and power lifting. Functional Training exercises continue in warm-ups and cool-downs throughout later phases. **Exam tip: Functional, then Movement, then Load/Speed. The phase that adds external load, plyometrics, and speed work is Load/Speed Training.**"], ["The five primary movement patterns", "ACE's Movement Training phase centers on five movement patterns that underlie daily life and sport. Bend-and-lift movements are squatting and hip hinging, as when sitting down, standing, or lifting a box from the floor. Single-leg movements involve balance and force on one leg, as in walking, climbing stairs, or lunging. Pushing movements can be forward, overhead, lateral, or downward, such as push-ups or pressing out of a pool. Pulling movements include rows and pull-ups, or opening a door. Rotational movements transfer force through the trunk, as in throwing or swinging. Clients should perform each pattern with good control before external load is added, because loading a poor pattern increases injury risk. **Exam tip: Bend-and-lift, single-leg, push, pull, rotation. \"Jumping\" is not one of the five.**"], ["Choosing a starting point", "Placement in the IFT Model comes from the client's current activity, assessments, and goals. A sedentary client who cannot yet complete 20 minutes of moderate cardio on 3 days per week begins cardio Base Training, where the priority is positive early experiences that build self-efficacy and adherence. A client with poor posture, weak core control, or limited mobility begins muscular Functional Training even if they are aerobically fit. Clients progress when they meet each phase's criteria rather than after a fixed number of weeks, and many general-fitness clients remain in Fitness Training and Load/Speed Training long term. Assessments are introduced when they are useful and safe, not all at the first session. **Exam tip: Unable to do 20 minutes of moderate cardio 3 times a week means Base Training; poor posture or core control means Functional Training.**"]], "Cardio Programming": [["National activity guidelines", "The Physical Activity Guidelines for Americans (2nd edition) recommend that adults do at least 150 to 300 minutes per week of moderate-intensity aerobic activity, or 75 to 150 minutes per week of vigorous-intensity activity, or an equivalent combination, preferably spread across the week. Adults should also do muscle-strengthening activities involving all major muscle groups on 2 or more days per week. Older adults follow the same targets and add multicomponent activity that includes balance training. Youth ages 6 to 17 need 60 minutes or more of moderate-to-vigorous activity daily. Any amount of activity has benefits, and bouts of any length now count. **Exam tip: Remember the minimums: 150 minutes of moderate OR 75 minutes of vigorous aerobic activity per week, plus 2 days of strength work.**"], ["Estimating maximal heart rate", "Maximal heart rate (HRmax) is the highest heart rate reached during exhaustive effort. Measuring it directly requires a maximal test, so trainers usually estimate it. The traditional formula is HRmax = 220 − age; for a 40-year-old that gives 180 bpm. The Tanaka formula, HRmax = 208 − (0.7 × age), is considered more accurate across ages; for a 50-year-old it gives 208 − 35 = 173 bpm. Both have a standard deviation of roughly 10 to 12 bpm, meaning a client's true value may differ substantially. Estimated HRmax is used to set %HRmax or Karvonen (%HRR) zones, which should be cross-checked with RPE and the talk test. **Exam tip: Do the arithmetic carefully: 220 − age, or 208 − 0.7 × age. Multiply before subtracting in the Tanaka formula.**"], ["Monitoring intensity", "Exercise intensity can be monitored several ways. Percentage of heart rate reserve (Karvonen) and percentage of maximal heart rate rely on estimated HRmax. Ratings of perceived exertion (RPE) use the 6-20 Borg scale or the 0-10 scale; ACSM classes RPE 12 to 13 (6-20) as moderate and 14 or higher as vigorous. The talk test is the simplest field method: comfortable conversation indicates an intensity below VT1, generally moderate. RPE and the talk test are essential when heart rate is unreliable, such as for clients taking beta-blockers or during pregnancy. In practice, combine a heart-rate target with how the client feels and whether they can talk. **Exam tip: A client who can talk comfortably is below VT1. RPE and talk test are the go-to methods when heart rate is unreliable.**"], ["Session structure: warm-up and cool-down", "Every cardio session has three parts. The warm-up, about 5 to 10 minutes of light-to-moderate activity similar to the workout, gradually raises heart rate, muscle temperature, and blood flow, reducing injury and cardiac risk. The conditioning phase delivers the prescribed FITT. The cool-down, another 5 to 10 minutes of gradually decreasing intensity, lets heart rate and blood pressure return toward resting levels and helps prevent blood pooling in the legs, which can cause dizziness or fainting, especially in older adults or those on blood-pressure medication. Static stretching fits well after the cool-down, while muscles are warm. Skipping the cool-down and stopping abruptly after vigorous work is a common cause of light-headedness. **Exam tip: Warm-up and cool-down are each about 5 to 10 minutes. The cool-down's main purpose is a gradual return of heart rate and blood pressure.**"], ["Progressing duration before intensity", "For beginners, cardio progresses gradually, and duration and frequency rise before intensity. A sedentary client might start with 10 to 15 minutes per session and add a few minutes every week or two until reaching 20 to 30 minutes or more, 3 to 5 days per week, all at a comfortable moderate effort. Only then is intensity raised. A common guideline limits increases in total weekly training volume to about 10 percent per week to reduce overuse injuries such as shin splints and stress fractures. Progressing too fast is the leading cause of injury and dropout in new exercisers, while slow progression builds confidence and adherence. **Exam tip: Increase duration (and frequency) first, intensity last, and keep weekly increases to about 10 percent.**"], ["Interval training", "Interval training alternates bouts of harder work with recovery periods of easier work or rest. It allows more total time at high intensity than continuous exercise, which improves aerobic and anaerobic fitness efficiently. The work-to-recovery ratio is chosen for the goal: longer recoveries for very hard, short efforts, and shorter recoveries for aerobic intervals. In the ACE IFT Model, intervals enter in Fitness Training, after the client has built an aerobic base of at least 20 minutes of moderate cardio 3 days per week, starting with zone 2 intervals; zone 3 intervals at or above VT2 are reserved for Performance Training. Beginners and clients with medical conditions should not start with high-intensity intervals. **Exam tip: Intervals come AFTER an aerobic base is established, not on day one.**"]], "Resistance Programming": [["Load and repetitions by goal", "The NSCA load-assignment table, also used in ACE materials, links the training goal to intensity and repetitions. Muscular endurance: 67 percent of one-repetition maximum (1RM) or less, 12 or more reps, 2 to 3 sets. Hypertrophy: 67 to 85 percent of 1RM, 6 to 12 reps, 3 to 6 sets. Maximal strength: 85 percent of 1RM or more, 6 or fewer reps, 2 to 6 sets. Power: 75 to 90 percent of 1RM for 1 to 5 explosive reps. Heavy loads with few reps recruit high-threshold motor units and drive neural adaptations; moderate loads with more volume create the mechanical and metabolic stress that drives muscle growth. Sedentary or older beginners improve strength with lighter loads (about 40 to 50 percent of 1RM, 10 to 15 reps). **Exam tip: Strength = 6 or fewer reps; hypertrophy = 6 to 12; endurance = 12 or more.**"], ["Rest intervals", "Rest between sets is matched to the goal because it controls how much energy is restored before the next set. Strength and power: 2 to 5 minutes, enough to substantially restore phosphocreatine and allow maximal force on each set. Hypertrophy: 30 to 90 seconds, which allows partial recovery while keeping high metabolic stress. Muscular endurance: 30 seconds or less, which trains the muscle's ability to buffer fatigue. General-fitness clients commonly use about 2 to 3 minutes between sets of the same exercise, or less when alternating opposing muscle groups in a circuit. Cutting rest too short on heavy strength sets reduces the load that can be lifted and the quality of each rep. **Exam tip: Rest is longest for strength (2 to 5 minutes), moderate for hypertrophy (30 to 90 seconds), shortest for endurance (30 seconds or less).**"], ["Frequency and recovery", "Muscles adapt during recovery, not during the workout itself. Guidelines recommend training each major muscle group 2 to 3 times per week, with at least 48 hours between sessions that load the same group. Full-body workouts on non-consecutive days (for example Monday, Wednesday, Friday) suit most beginners. Split routines, such as upper body one day and lower body the next, let experienced clients train on consecutive days while still giving each muscle group about 48 hours. Signs of inadequate recovery include persistent soreness, falling performance, poor sleep, and an elevated resting heart rate. Older adults may need closer to 72 hours after hard sessions. **Exam tip: At least 48 hours between sessions for the SAME muscle group; 12 or 24 hours is too short.**"], ["Progressive overload and the 2-for-2 rule", "Progressive overload is the gradual increase of training stress, such as load, reps, sets, or exercise difficulty, so that the body keeps adapting. The NSCA's 2-for-2 rule gives an objective trigger for adding load: if a client can perform 2 or more repetitions beyond the assigned goal in the final set of an exercise in 2 consecutive workouts, increase the load at the next session. Typical increases are about 2.5 to 5 percent (roughly 2.5 to 5 pounds) for upper-body exercises and 5 to 10 percent (roughly 5 to 10 pounds) for lower-body exercises. The rule prevents both stagnation and jumping ahead too quickly. **Exam tip: 2-for-2 means 2 extra reps on the last set in 2 consecutive sessions, then increase the load.**"], ["The SAID principle", "The principle of specificity, often stated as SAID (Specific Adaptation to Imposed Demands), says the body adapts specifically to the type of stress placed on it: the muscles used, the movement pattern, the speed, the range of motion, and the energy system. Heavy, slow lifting builds maximal strength; explosive training builds power; long steady cardio builds aerobic endurance. That is why a program must match the client's goals: a client who wants to climb stairs more easily should train single-leg and stepping patterns, and a runner needs running. Related principles include overload, progression, reversibility (losing gains when training stops), and individuality (people respond differently to the same program). **Exam tip: SAID = Specific Adaptation to Imposed Demands. Training produces adaptations specific to the demands imposed.**"], ["Breathing and exercise order", "During resistance exercise, clients should breathe continuously, generally exhaling during the hardest part of the lift (the concentric, exertion phase, such as standing up from a squat) and inhaling during the easier lowering phase. The Valsalva maneuver, forcefully exhaling against a closed airway, sharply raises blood pressure and is discouraged for general and hypertensive clients, although trained lifters sometimes use it briefly for maximal lifts. For exercise order within a session, power exercises come first, then large multi-joint exercises (squats, deadlifts, presses, rows), then smaller single-joint exercises (curls, extensions), while the client is freshest. Alternating upper- and lower-body or push and pull exercises allows recovery in circuits. **Exam tip: Exhale on exertion and avoid breath holding. Do multi-joint exercises before single-joint ones.**"]], "Assessments & Testing": [["Order of assessments", "Assessments follow a logical, safety-first order. First comes health screening: questionnaires such as the PAR-Q+, a health history, and medical clearance if needed. Next come resting measures: heart rate, blood pressure, height, weight, and other body-composition and girth measures. Then posture and movement screens are performed before any loaded or maximal test. Finally come fitness tests for cardiorespiratory fitness, muscular endurance and strength, and flexibility, ideally starting with the least fatiguing so that one test does not distort the next. Not every client needs every test; choose assessments that are relevant to the client's goals, safe for their health status, and likely to be repeated to track progress. **Exam tip: Health screening always comes BEFORE any fitness test.**"], ["Blood pressure categories", "Blood pressure is the force of blood against artery walls: systolic pressure during heart contraction over diastolic pressure during relaxation. The 2025 AHA/ACC guideline keeps these adult categories. Normal: systolic below 120 and diastolic below 80 mmHg. Elevated: systolic 120 to 129 and diastolic below 80. Stage 1 hypertension: systolic 130 to 139 or diastolic 80 to 89. Stage 2 hypertension: systolic 140 or higher or diastolic 90 or higher. When the two numbers fall in different categories, the higher category applies, so 132/84 is stage 1 and 128/92 is stage 2. Above 180/120 is severe hypertension; with symptoms such as chest pain or breathlessness it is an emergency. **Exam tip: Normal is under 120 AND under 80. Stage 1 is 130 to 139 OR 80 to 89; use the higher category.**"], ["BMI and waist circumference", "Body mass index (BMI) is weight in kilograms divided by height in meters squared: BMI = kg ÷ m². For adults, the CDC classes a BMI below 18.5 as underweight, 18.5 to 24.9 as healthy weight, 25.0 to 29.9 as overweight, and 30.0 or higher as obesity (class 1: 30 to 34.9, class 2: 35 to 39.9, class 3: 40 or more). BMI is quick and useful for populations, but it cannot tell muscle from fat, so it misclassifies muscular athletes. Waist circumference adds information about abdominal fat: above 40 inches (102 cm) for men or 35 inches (88 cm) for women indicates higher risk of heart disease and type 2 diabetes. **Exam tip: BMI = weight (kg) divided by height (m) squared; 25 to 29.9 is overweight and 30 or more is obese.**"], ["Resting heart rate and measurement technique", "Resting heart rate is best measured in the morning, after waking and before getting out of bed, because activity, caffeine, digestion, stress, and position all raise it. Use the radial pulse (thumb side of the wrist) or carotid pulse (side of the neck, pressing lightly to avoid slowing the heart), counting for 30 to 60 seconds, or average several mornings. Adult resting heart rate typically falls between 60 and 100 beats per minute; regular endurance training lowers it because stroke volume increases. A resting heart rate that is unusually elevated over several days can signal overtraining, illness, or dehydration. Blood pressure is likewise taken after about 5 minutes of seated rest. **Exam tip: The most accurate resting heart rate is taken in the morning before getting out of bed, not after a workout, coffee, or a meal.**"], ["Movement and posture screens", "Before loading a movement, trainers observe it. Static posture assessment looks for deviations such as excessive kyphosis or lordosis, a forward head, uneven shoulders, or pelvic tilt. Movement screens observe the primary patterns, such as the bend-and-lift (squat), hinge, single-leg stance or step-up, push, and pull, from the front and side, noting compensations like knees collapsing inward (valgus), heels lifting, the trunk leaning excessively, or the low back rounding. These observations reveal mobility or stability limits that should be corrected, usually in Functional or Movement Training, before heavy loads are added. They also give a baseline for retesting. Movement screens do not diagnose injuries or replace health screening. **Exam tip: The purpose of a movement screen is to identify compensations and imbalances before loading, not to find maximal strength.**"], ["Common fitness tests", "Each fitness test measures a specific component. The push-up test (full or modified, performed to fatigue with good form) measures upper-body muscular endurance. The Rockport 1-mile walk test, timed walking with heart rate taken at the end, estimates VO2max (aerobic fitness), as do the YMCA submaximal cycle test and step tests. The sit-and-reach test measures hamstring and low-back flexibility. A 1RM test, or a submaximal test used to predict 1RM, measures maximal muscular strength and is appropriate only after technique is solid and screening allows. The 30-second chair stand measures lower-body functional strength in older adults. Choose the test that matches the question you want answered. **Exam tip: Push-ups = muscular endurance; Rockport walk = aerobic fitness; sit-and-reach = flexibility; 1RM = maximal strength.**"]], "Behavior Change & Communication": [["Transtheoretical Model: stage definitions", "The Transtheoretical Model (stages of change) classifies readiness for a behavior. Precontemplation: no intention to begin exercising in the next 6 months; the client may be uninformed or uninterested (\"I have no interest in exercising\"). Contemplation: intends to start within 6 months but is ambivalent. Preparation: intends to start within the next month and has taken small steps, such as walking occasionally or buying shoes. Action: has been exercising regularly for less than 6 months; relapse risk is highest here. Maintenance: has exercised regularly for 6 months or longer. People can move forward and backward between stages, and relapse is normal rather than failure. **Exam tip: Under 6 months of regular exercise = action; 6 months or more = maintenance; small steps toward starting soon = preparation.**"], ["Self-efficacy", "Self-efficacy is a person's confidence in their ability to successfully perform a specific behavior, such as completing a workout or exercising 3 times a week despite a busy schedule. It is one of the strongest predictors of exercise adoption and adherence. Bandura identified four sources. Past performance (mastery) experiences are the most powerful. Vicarious experience means seeing similar people succeed. Verbal persuasion is credible encouragement and feedback. Physiological and emotional states, such as interpreting breathlessness or soreness as normal rather than threatening, also matter. Trainers raise self-efficacy by designing early sessions that the client can clearly succeed at, setting achievable process goals, and recognizing progress. Self-efficacy is task-specific and differs from general self-esteem. **Exam tip: Self-efficacy = belief in one's ability to succeed at a specific task; build it with early, achievable successes.**"], ["Intrinsic and extrinsic motivation", "Motivation ranges from extrinsic, doing something for an outside reward or to avoid punishment (a prize, a doctor's warning, appearance pressure), to intrinsic, doing it because it is enjoyable or personally meaningful. Extrinsic motivators can help someone start, but behavior driven only by external rewards tends to stop when the rewards stop. Intrinsic motivation, and the closely related sense of autonomy, competence, and connection described in self-determination theory, predicts long-term adherence. Trainers foster intrinsic motivation by offering choices, choosing activities the client enjoys, highlighting feelings of competence and progress, and connecting exercise to the client's own values. Fear and punishment are poor long-term motivators. **Exam tip: Intrinsic motivation (enjoyment and personal meaning) sustains exercise longer than extrinsic rewards.**"], ["The client-trainer relationship", "ACE describes four stages of the client-trainer relationship. Rapport: building trust and mutual respect through warmth, empathy, and genuine interest; it comes first and continues throughout. Investigation: gathering information on health, history, preferences, readiness, and goals through interviews and assessments. Planning: setting goals and designing the program collaboratively with the client. Action: implementing the plan, giving feedback, monitoring progress, and adjusting. Skipping rapport, for example opening the first session with a hard workout or a long list of rules, undermines trust and adherence. Clients are more likely to share sensitive health information and accept feedback from a trainer they trust. **Exam tip: The stages are Rapport, Investigation, Planning, Action, and Rapport always comes first.**"], ["Active listening and nonverbal communication", "Active listening means fully attending to the client, understanding their message, and showing that understanding. Techniques include paraphrasing or reflecting what was said (\"So weekends are hardest for you\"), asking open-ended questions, summarizing, and allowing pauses instead of jumping in with advice. Planning a reply while the client is talking, interrupting, or checking a phone are failures of active listening. Nonverbal communication often carries more meaning than words. Positive cues include eye contact, a relaxed open posture, nodding, facing the client, matching their eye level, and a warm tone of voice. Crossed arms, looking at the clock, or standing over a seated client signal disinterest or dominance. **Exam tip: Paraphrasing the client's words is active listening; eye contact and open posture build rapport.**"], ["Feedback and learning", "Effective feedback is specific, timely, and balanced. Early in learning (the cognitive stage), clients need frequent, simple cues, ideally one correction at a time, combined with demonstration. As skill develops (associative and autonomous stages), feedback should become less frequent so that clients learn to feel and correct the movement themselves. A useful format is positive-corrective-positive: note what was done well, give one specific correction, and end with encouragement. Clients also differ in how they take in information, through seeing (visual), hearing (auditory), or feeling the movement (kinesthetic), so good trainers use all three. Praise effort and progress, not just outcomes, to support self-efficacy. **Exam tip: Give the most feedback early in learning and reduce it as the client becomes autonomous.**"]], "Nutrition Basics": [["Energy values of macronutrients", "Food energy is measured in kilocalories (kcal, the \"calories\" on food labels). The standard energy values are: carbohydrate 4 kcal per gram, protein 4 kcal per gram, fat 9 kcal per gram, and alcohol 7 kcal per gram. Fat is the most energy-dense nutrient, more than twice the value of carbohydrate or protein. To calculate the calories in a meal, multiply each macronutrient's grams by its value and add them. For example, 30 g carbohydrate, 20 g protein, and 10 g fat give (30 × 4) + (20 × 4) + (10 × 9) = 120 + 80 + 90 = 290 kcal. Vitamins, minerals, and water provide no calories. **Exam tip: Memorize 4-4-9-7: carbohydrate, protein, fat, alcohol. Multiply grams by these values to get calories.**"], ["Acceptable Macronutrient Distribution Ranges", "The Acceptable Macronutrient Distribution Ranges (AMDRs), set by the National Academies, describe the share of daily calories from each macronutrient that is linked with lower chronic-disease risk while meeting nutrient needs. For adults 19 and older: carbohydrate 45 to 65 percent, fat 20 to 35 percent, and protein 10 to 35 percent of total calories. Children have slightly different ranges (for example fat 25 to 35 percent for ages 4 to 18). The Dietary Guidelines for Americans 2020-2025 add that saturated fat and added sugars should each be under 10 percent of calories and sodium under 2,300 mg per day. On a 2,000-kcal diet, 45 to 65 percent carbohydrate is 225 to 325 grams. **Exam tip: Adult AMDRs: carbohydrate 45 to 65 percent, fat 20 to 35 percent, protein 10 to 35 percent.**"], ["Protein: the RDA and active people", "The Recommended Dietary Allowance (RDA) for protein for healthy adults is 0.8 grams per kilogram of body weight per day, about 56 grams for a 70-kilogram man and 46 grams for a typical woman. The RDA is the intake that meets the needs of nearly all (97 to 98 percent of) healthy people; it is a minimum to prevent deficiency, not an upper limit or an optimal target. Active people and older adults often benefit from more, commonly 1.0 to 2.0 grams per kilogram per day depending on training and goals, spread across meals. No tolerable upper limit for protein has been set for healthy people. Protein needs are usually met through food; supplements are a convenience, not a requirement. **Exam tip: The adult protein RDA is 0.8 g/kg per day; values like 2.5 or 4 g/kg are distractors.**"], ["Public guidance tools", "Trainers can share free, evidence-based public resources. The Dietary Guidelines for Americans, issued every 5 years by the U.S. Departments of Agriculture and Health and Human Services, describe healthy eating patterns for the whole population. MyPlate (MyPlate.gov) translates those guidelines into a simple picture: fill half the plate with fruits and vegetables, about a quarter with grains (at least half whole grains), about a quarter with protein foods, and add dairy or fortified alternatives. Other tools include the Nutrition Facts label and calorie and portion guidance. Using these resources keeps trainers within scope while giving clients reliable, consistent information. **Exam tip: Sharing the Dietary Guidelines or MyPlate is within a trainer's scope of practice.**"], ["Nutrition scope of practice", "ACE's nutrition scope of practice lets trainers provide general, non-medical nutrition information based on government guidelines, discuss healthy habits, and support clients' behavior change. Trainers may not perform individualized dietary assessments for medical purposes, prescribe meal plans or specific diets for diseases such as diabetes, kidney disease, or eating disorders, diagnose nutrient deficiencies, or recommend supplements to treat medical conditions. Those services require a registered dietitian (RD/RDN), working with the client's physician. Many U.S. states also have laws that restrict individualized nutrition counseling to licensed professionals. When a client asks for a specific meal plan, especially for a medical condition, the right response is referral. **Exam tip: Individualized meal plans for medical conditions go to a registered dietitian; trainers share general guidelines only.**"], ["Energy balance and body weight", "Body weight changes when energy intake (food and drink) and energy expenditure differ. Expenditure has three parts: resting metabolic rate (about 60 to 75 percent of daily energy), the thermic effect of food (about 10 percent), and physical activity, the most variable part. A pound of body fat is commonly estimated to store about 3,500 kcal, so a daily deficit of about 500 kcal has traditionally been associated with losing about 1 pound per week. In reality weight loss slows over time because metabolism and body composition adapt, so this rule is an approximation. A safe, sustainable rate of loss is about 1 to 2 pounds per week. **Exam tip: One pound of fat is commonly estimated at about 3,500 kcal; treat this as an approximation.**"]], "Special Populations": [["Older adults", "Older adults gain major benefits from exercise, including preserved independence, fewer falls, better blood-sugar and blood-pressure control, and improved mood. The Physical Activity Guidelines recommend that they meet the adult aerobic and strength targets as their abilities allow, and add multicomponent activity that includes balance training. Programming emphasizes functional strength (sit-to-stand, stepping, carrying), balance and fall prevention, mobility, and gradual progression. Many older adults take medications that affect heart rate or balance, so RPE and careful observation are important. Light loads of about 40 to 50 percent of 1RM for 10 to 15 reps can improve strength in sedentary older adults, progressing as tolerated. **Exam tip: For older clients, balance and functional strength with gradual progression is the priority.**"], ["Hypertension and beta-blockers", "Regular aerobic and resistance exercise lowers resting blood pressure by about 5 to 8 mmHg in people with hypertension, an effect comparable to some medications. Recommended programming is moderate aerobic activity most days of the week, plus moderate resistance training with continuous breathing. Clients should avoid the Valsalva maneuver (breath-holding while straining) and heavy, sustained isometric holds, both of which spike blood pressure. Many clients take beta-blockers, which lower resting and exercise heart rate and blunt the heart-rate response to exercise; for them, heart-rate targets are unreliable, so ACSM recommends using RPE and the talk test instead. Long cool-downs help prevent post-exercise drops in blood pressure. **Exam tip: On beta-blockers, monitor intensity with RPE, not heart-rate targets; with hypertension, avoid breath holding.**"], ["Diabetes: hypoglycemia and foot care", "Exercise improves insulin sensitivity, so clients using insulin or certain oral medications can develop hypoglycemia (blood glucose below 70 mg/dL) during or after exercise. Signs include shakiness, sweating, a fast heartbeat, hunger, irritability, confusion, and in severe cases loss of consciousness. Treat with the 15-15 rule: give about 15 grams of fast-acting carbohydrate (for example 4 ounces of juice or glucose tablets), wait 15 minutes, recheck, and repeat if glucose is still below 70 mg/dL. Trainers should keep fast-acting carbohydrate available. Clients with peripheral neuropathy may not feel blisters or wounds, so they need proper footwear, daily foot checks, and caution with high-impact activity. **Exam tip: Shaky, sweaty, and confused in a diabetic client means hypoglycemia; give fast-acting carbohydrate.**"], ["Pregnancy", "The American College of Obstetricians and Gynecologists (ACOG) encourages women with uncomplicated pregnancies to exercise, building toward at least 150 minutes of moderate activity per week, after clearance from their obstetric provider. Previously active women can usually continue their usual activities. Because heart-rate responses vary in pregnancy, RPE (about 13 to 14, \"somewhat hard\") and the talk test are preferred. After about 20 weeks, prolonged lying flat on the back should be avoided, because the uterus can compress the vena cava and aorta and lower blood pressure. Stop exercise and seek care with warning signs such as vaginal bleeding, regular painful contractions, fluid leakage, dizziness, chest pain, headache, calf pain or swelling, or breathlessness before exertion. **Exam tip: Avoid prolonged supine positions after about 20 weeks; vaginal bleeding means stop and seek care.**"], ["Asthma", "Asthma is chronic airway inflammation with episodes of bronchoconstriction (narrowing of the airways), causing wheezing, coughing, chest tightness, and shortness of breath. Exercise-induced bronchoconstriction is common and is triggered especially by cold, dry air, pollen, or pollution, often 5 to 10 minutes into hard exercise or soon after stopping. Clients with asthma can and should exercise. Best practices: keep the prescribed rescue inhaler nearby and use it before exercise if the physician advises; use a longer, gradual warm-up; prefer warm, humid environments such as indoor pools; and stop and use the inhaler if symptoms appear, seeking emergency help if they do not improve. **Exam tip: For asthma, keep the rescue inhaler accessible and use a longer warm-up. Cold, dry air is a trigger, not a treatment.**"], ["Youth and clients with obesity", "Children and adolescents ages 6 to 17 should do 60 minutes or more of moderate-to-vigorous physical activity daily, including vigorous activity, muscle-strengthening, and bone-strengthening activities (such as jumping or running games) each on at least 3 days per week. Supervised, technique-focused resistance training is safe and beneficial for youth. For adults with obesity, the initial goal is to build a habit of frequent, longer-duration, moderate activity, gradually working toward about 200 to 300 minutes per week for weight management. Low-impact options such as walking, stationary or recumbent cycling, and water exercise reduce stress on the knees and hips. Clients with obesity also tolerate heat poorly, so monitor hydration and environment. **Exam tip: Youth need 60 minutes daily; for obesity with sore knees, choose low-impact modes like cycling or water exercise.**"]], "Injury Prevention & Emergencies": [["Emergency preparedness", "Every fitness facility should have a written emergency action plan that staff rehearse: who calls 911, who starts CPR, where the AED and first-aid kit are, and how emergency responders enter the building. ACE requires its certified professionals to hold a current adult CPR and AED certificate that includes a hands-on skills check. For sudden cardiac arrest, survival depends on fast action: if a person collapses, is unresponsive, and is not breathing normally, call 911 (or have someone call) and get the AED, begin chest compressions immediately (about 100 to 120 per minute, at least 2 inches deep in adults), and use the AED as soon as it arrives. **Exam tip: Unresponsive and not breathing normally: call 911, start CPR, and use the AED immediately. ACE certification requires current CPR/AED.**"], ["Strains, sprains, and overuse injuries", "A strain is an injury to a muscle or tendon (the tissue that attaches muscle to bone), often from overstretching or a sudden forceful contraction, such as a hamstring strain. A sprain is an injury to a ligament (connecting bone to bone), usually from a joint being forced beyond its normal range, such as an ankle sprain from rolling the foot. Both are graded from mild (grade I) to complete tears (grade III). Overuse injuries develop gradually from repeated stress without enough recovery, such as tendinopathy, shin splints (medial tibial stress syndrome), and stress fractures; the most common cause is increasing training volume or intensity too quickly. Trainers do not diagnose injuries; they refer for evaluation. **Exam tip: sTrain = Tendon or muscle; sprain = ligament. Shin splints usually mean too much, too soon.**"], ["Acute soft-tissue care: RICE", "For an acute soft-tissue injury such as a sprain or strain, first aid follows RICE: Rest (stop the activity and protect the area), Ice (apply cold for about 15 to 20 minutes at a time with a cloth barrier, every few hours early on), Compression (an elastic wrap to limit swelling, not so tight that it numbs or discolors the area), and Elevation (raise the injured part above heart level when possible). Some newer approaches emphasize protection and early gentle movement, but RICE remains the standard first-aid answer on certification exams. Refer the client to a physician if there is severe pain, deformity, inability to bear weight, numbness, or swelling that does not improve. **Exam tip: RICE = Rest, Ice, Compression, Elevation.**"], ["Heat exhaustion and heat stroke", "Heat illness ranges from mild to life-threatening. Heat exhaustion produces heavy sweating, weakness, fatigue, headache, nausea, dizziness, and a fast pulse, with body temperature usually below about 40 °C (104 °F). Move the client to a cool place, have them lie down with legs raised, loosen clothing, give cool fluids, and monitor; seek care if they do not recover quickly. Exertional heat stroke is a medical emergency: core temperature above about 40 °C (104 °F) with central nervous system dysfunction such as confusion, irritability, staggering, or collapse. Call 911 and cool immediately and aggressively; cold-water immersion is the most effective method (\"cool first, transport second\" when trained staff are present). **Exam tip: Heavy sweating with weakness and nausea = heat exhaustion. Confusion with very high body temperature = heat stroke: call 911 and cool rapidly.**"], ["Fainting and light-headedness", "Light-headedness or near-fainting during or after exercise often comes from a drop in blood pressure. Causes include stopping vigorous exercise abruptly so that blood pools in the legs, dehydration, low blood sugar, blood-pressure medications, or heat. It can also signal a heart problem. When a client feels faint: stop the exercise immediately, help them sit or lie down (lying with the legs raised is best) so they cannot fall, loosen tight clothing, and monitor breathing and responsiveness. Offer fluids or carbohydrate if appropriate once they are alert. If they lose consciousness, have chest pain, or do not recover quickly, call 911. Do not push for one more set or leave the client alone. **Exam tip: Light-headed client: stop, sit or lie them down, and monitor; never push on or leave them alone.**"], ["A safe training environment", "Many gym injuries are preventable. Trainers reduce risk by supervising and spotting appropriately (especially for free-weight pressing and squatting); checking equipment regularly for frayed cables, loose pins, and worn upholstery, and reporting or removing faulty equipment; keeping walkways and lifting areas clear of plates, dumbbells, and cords; and making sure there is enough space around machines and free-weight areas. Programs should include a warm-up, appropriate progression, and loads matched to each client's technique. Beginners should never start with maximal loads. Documenting equipment checks, incidents, and client instructions helps both safety and legal protection. **Exam tip: Spotting, equipment checks, and clear walkways are the core injury-prevention practices; maximal loads for beginners are never correct.**"]], "Legal & Professional": [["Negligence", "Negligence is the failure to act as a reasonable and prudent professional with similar training would act in the same situation. A negligence claim requires four elements: duty (the trainer had a responsibility to the client), breach (the trainer failed to meet the standard of care, by doing something improper or failing to do something required), causation (the breach caused the harm), and damages (the client suffered actual injury or loss). Common examples include ignoring a client's reported warning symptoms, failing to screen, poor supervision, or using unsafe equipment. Profit has nothing to do with negligence. Gross negligence is reckless disregard for safety, a far more serious failure. **Exam tip: The four elements of negligence are duty, breach, causation, and damages.**"], ["Informed consent versus waivers", "Informed consent is a document and process that explains to the client the procedures of a program or test, its expected benefits, and its risks and discomforts, so that the client makes an informed, voluntary decision to participate. It shows the client understood the risks, but it does not by itself release the trainer from liability. A waiver (release of liability) is a contract in which the client gives up the right to sue for injuries caused by the professional's ordinary negligence. Its enforceability varies by state, and it must be clearly written. Neither document protects against gross negligence, recklessness, or intentional misconduct. **Exam tip: Informed consent explains the risks; a waiver releases ordinary negligence. Neither covers gross negligence.**"], ["Professional liability insurance", "Even when a gym or employer carries insurance, trainers are advised to carry their own professional liability insurance, because the employer's policy may not cover every situation, such as private sessions, training outside the facility, or claims naming the trainer personally. Policies typically cover legal defense costs and damages up to the policy limit. Insurance complements, but does not replace, risk management: screening, appropriate programming, supervision, safe equipment, emergency plans, current CPR/AED, and careful documentation of assessments, instructions, and incidents. Trainers should also understand any limits on coverage, such as excluded activities. **Exam tip: Personal trainers, including employees, should carry their own professional liability insurance.**"], ["Employees and independent contractors", "Employment status changes a trainer's responsibilities. An employee works under the employer's direction and control, often using the employer's methods and schedule; the employer withholds income and payroll taxes, may provide benefits and training, and usually carries insurance covering the employee's work. An independent contractor controls how the work is done, sets their own rates and schedule, and is responsible for their own taxes (including self-employment tax), insurance, and business expenses. The classification depends on the actual working relationship, not just a job title, and misclassification has legal and tax consequences. **Exam tip: An independent contractor handles their own taxes and insurance; tax withholding and benefits indicate an employee.**"], ["Confidentiality of client records", "Client health histories, assessment results, and progress notes contain private health information. Trainers must keep paper records in a locked file and electronic records password-protected, share information only with the client's written permission or when needed for the client's safety, and never leave forms where others can see them, such as on a front desk. Discussing a client's health with other clients or staff who do not need to know is a breach of confidentiality. Although most personal trainers are not legally covered by HIPAA, the health-information privacy law for health care providers, ACE's Code of Ethics requires protecting client confidentiality. **Exam tip: Leaving health forms in public view violates confidentiality; records must be stored securely.**"], ["Keeping the credential current", "ACE certifications are valid for 2 years. To renew, a professional must complete 20 hours of ACE-approved continuing education, equal to 2.0 continuing education credits (CECs, where 1 hour = 0.1 CEC), within the cycle; hold a current adult CPR/AED certificate with a hands-on skills check; agree to the ACE Code of Ethics and scope of practice; and submit the renewal and fee before the expiration date. Extra CECs do not roll over to the next cycle, and CPR/AED courses can earn up to 0.4 CECs. Continuing education protects the public by keeping professionals current with research and standards. **Exam tip: ACE renewal = every 2 years, 2.0 CECs (20 hours), plus current CPR/AED.**"]]};

const NEWL2=[{"title": "Posture & Muscle Imbalances", "icon": "🧍", "cards": [{"h": "Neutral posture and the plumb line", "b": "Static posture is assessed against a plumb line, a vertical reference that, in ideal side-view alignment, passes just in front of the lateral malleolus (ankle bone), slightly anterior to the knee, through the greater trochanter of the hip, through the shoulder joint, and through the ear lobe. In this neutral alignment the spine keeps its three natural curves (cervical lordosis, thoracic kyphosis, lumbar lordosis) and joints are loaded efficiently. From the front, trainers look for symmetry: level shoulders and hips, kneecaps facing forward, and feet with a visible arch. Posture assessment is observational: it identifies exaggerated deviations to address with exercise, and trainers do not diagnose structural conditions. Clients should be assessed barefoot in form-fitting clothing, after permission is obtained. **Exam tip: In ideal side-view posture the plumb line passes through the ear lobe, shoulder, hip, slightly in front of the knee, and just in front of the ankle bone.**"}, {"h": "Muscle imbalance and the length-tension relationship", "b": "Muscle imbalance occurs when muscles around a joint differ in length, stiffness, or strength, pulling the joint out of neutral. Chronic positions such as prolonged sitting cause some muscles to adapt to a shortened position (becoming tight and often facilitated) while their opposites adapt to a lengthened position (becoming weak and often inhibited). A muscle held too long or too short cannot generate optimal force; this is the length-tension relationship. Reciprocal inhibition means a tight agonist can further inhibit its antagonist. Programming to restore balance generally follows two steps: first lengthen the overactive, shortened muscles (myofascial release and static stretching), then strengthen and activate the lengthened, weak muscles. Correcting both sides matters more than training only the obvious weakness. **Exam tip: To correct an imbalance, first stretch or release the tight, shortened muscles, then strengthen the lengthened, weak ones.**"}, {"h": "Lower crossed syndrome: anterior pelvic tilt", "b": "An anterior pelvic tilt with increased lumbar lordosis is commonly called lower crossed syndrome. The muscles that tend to be tight and shortened are the hip flexors (iliopsoas and rectus femoris) and the lumbar erector spinae; the muscles that tend to be weak and lengthened are the abdominals and the gluteus maximus, along with the hamstrings in many cases. Prolonged sitting is a major contributor. Visual signs include a protruding abdomen, an exaggerated low-back curve, and the anterior superior iliac spine (front hip bone) sitting lower than the posterior. Corrective programming includes hip-flexor and low-back stretching, followed by glute activation (glute bridges) and core work such as the dead bug and front plank. **Exam tip: Anterior pelvic tilt = tight hip flexors and erector spinae, weak abdominals and glutes.**"}, {"h": "Upper crossed syndrome: rounded shoulders and forward head", "b": "Upper crossed syndrome is the classic \"desk posture\": rounded shoulders, increased thoracic kyphosis, and a forward head. The tight and shortened muscles are typically the pectoralis major and minor, the upper trapezius, levator scapulae, and the suboccipitals at the back of the neck. The weak and lengthened muscles are the deep neck flexors and the middle and lower trapezius and rhomboids, which retract and depress the scapulae. Scapular protraction (shoulder blades pulled forward) often accompanies it. Correction includes pectoral and upper-trapezius stretching, thoracic-spine extension mobility, and strengthening of the scapular retractors and depressors with rows, face pulls, and prone Y-T-W raises, plus chin tucks for the deep neck flexors. **Exam tip: Rounded shoulders and forward head: stretch the pecs and upper trapezius; strengthen the middle and lower trapezius, rhomboids, and deep neck flexors.**"}, {"h": "Other common deviations", "b": "Besides lordosis, three other spinal patterns appear on exams. Kyphosis is an exaggerated outward rounding of the thoracic spine, often with a forward head. Flat-back posture shows a decreased lumbar curve with a posterior pelvic tilt; the hamstrings and abdominals tend to be tight while the hip flexors and low-back extensors are lengthened. Sway-back shows the pelvis shifted forward of the plumb line with a posterior tilt and a long thoracic curve. Scoliosis is a lateral curvature of the spine with vertebral rotation; trainers note asymmetry and refer for evaluation but do not treat it. In the lower extremity, overpronation (flattened arches, pes planus) is linked to knees collapsing inward (valgus) and internal rotation of the tibia and femur. **Exam tip: Flat-back = reduced lumbar curve with posterior tilt; scoliosis = lateral curve plus rotation, which a trainer refers rather than diagnoses.**"}, {"h": "The kinetic chain", "b": "The kinetic chain describes how the body's joints and segments are linked, so that a deviation at one joint affects joints above and below it. For example, overpronation at the foot drives the tibia and femur into internal rotation, which can produce knee valgus and stress on the hip and low back. Likewise, limited ankle dorsiflexion often shows up as heels lifting or an excessive forward lean during a squat. Trainers therefore look for the origin of a compensation rather than just the joint where it appears. Closed-kinetic-chain exercises keep the hand or foot fixed against a surface (squats, push-ups), while open-kinetic-chain exercises let the distal segment move freely (leg extensions, biceps curls). **Exam tip: In a closed-chain exercise the hands or feet stay fixed (squat, push-up); in an open-chain exercise they move freely (leg extension).**"}], "qs": [{"q": "In ideal side-view posture, the plumb line should pass through the:", "o": ["Ear lobe, shoulder, hip, and slightly in front of the knee and ankle", "Nose, sternum, and navel", "Back of the knee and heel", "Front of the shoulder and toes"], "a": 0, "e": "Reference points are the ear lobe, shoulder, greater trochanter, just anterior to the knee, and just anterior to the lateral malleolus."}, {"q": "A client who sits all day shows an anterior pelvic tilt. Which muscles are most likely tight?", "o": ["Hip flexors and erector spinae", "Glutes and abdominals", "Hamstrings and abdominals", "Rhomboids and lower trapezius"], "a": 0, "e": "Lower crossed pattern: tight hip flexors and low-back extensors."}, {"q": "For that same anterior pelvic tilt, which muscles should be strengthened?", "o": ["Hip flexors", "Gluteus maximus and abdominals", "Upper trapezius", "Pectoralis minor"], "a": 1, "e": "Strengthen the lengthened, weak glutes and abdominals after stretching the tight muscles."}, {"q": "A client has rounded shoulders and a forward head. Which muscle is typically tight?", "o": ["Middle trapezius", "Pectoralis minor", "Lower trapezius", "Deep neck flexors"], "a": 1, "e": "Upper crossed pattern: tight pectorals and upper trapezius."}, {"q": "Which exercise best targets the weak muscles in upper crossed syndrome?", "o": ["Chest fly", "Upper-trap shrug", "Seated row emphasizing scapular retraction", "Crunch"], "a": 2, "e": "Rows strengthen the middle trapezius and rhomboids."}, {"q": "A reduced lumbar curve with a posterior pelvic tilt describes:", "o": ["Lordosis", "Flat-back posture", "Kyphosis", "Upper crossed syndrome"], "a": 1, "e": "Flat-back = decreased lumbar curve and posterior tilt."}, {"q": "During assessment you notice a lateral spinal curve with rotation. What is the best action?", "o": ["Begin corrective rotation drills", "Diagnose scoliosis", "Note it and refer for medical evaluation", "Ignore it"], "a": 2, "e": "Trainers observe and refer structural deviations; they do not diagnose."}, {"q": "Overpronation of the feet is commonly linked to:", "o": ["Knees bowing outward", "Knee valgus and internal rotation of the tibia and femur", "Increased thoracic extension", "Elevated shoulders"], "a": 1, "e": "Foot pronation drives the kinetic chain into internal rotation and valgus."}, {"q": "When correcting a muscle imbalance, what is usually done FIRST?", "o": ["Heavy strengthening of the weak side", "Lengthen the tight, overactive muscles", "Plyometrics", "Max testing"], "a": 1, "e": "Release and stretch the shortened muscles, then strengthen the weak ones."}, {"q": "Which is a closed-kinetic-chain exercise?", "o": ["Leg extension", "Seated leg curl", "Push-up", "Dumbbell biceps curl"], "a": 2, "e": "In a push-up the hands stay fixed on the floor."}]}, {"title": "Movement, Mobility & Balance Screens", "icon": "🔍", "cards": [{"h": "Principles of movement screening", "b": "ACE movement screens observe a client's natural movement to find mobility and stability limitations before load is added. Key rules: explain the protocol, do not cue good technique (you want to see the client's natural pattern), observe from the front and side, and use repeated repetitions so each repetition can focus on one body region. Results are interpreted along the kinetic chain, looking for the origin of a compensation. The joint-by-joint idea guides interpretation: joints that need mobility (ankle, hip, thoracic spine, shoulder) alternate with joints that need stability (foot, knee, lumbar spine, scapulothoracic region). Screens are not diagnostic; pain during a screen means stop and refer. **Exam tip: During a movement screen, do NOT coach good form; the goal is to observe the client's natural movement.**"}, {"h": "Bend-and-lift screen", "b": "The bend-and-lift screen assesses symmetrical lower-extremity mobility and stability and trunk control during a squatting pattern. The client stands with feet shoulder-width apart and performs 5 to 10 squats (in the group version, lifting two dowels from beside the feet), lowering as deep as comfortable. From the front, check the feet for pronation or supination, whether the knees track over the second toe or move inward, and whether the body shifts or rotates. From the side, check that the heels stay down, whether the client is \"glute dominant\" (initiates by pushing hips back) or \"quadriceps dominant\" (drives knees forward first), whether the tibia and torso reach a parallel position, and whether the lumbar or thoracic spine rounds or arches excessively. Heels lifting often points to limited ankle dorsiflexion. **Exam tip: Knees collapsing inward and heels lifting are the classic bend-and-lift compensations; initiating by driving the knees forward is quadriceps dominance.**"}, {"h": "Hurdle step screen", "b": "The hurdle step screen examines simultaneous mobility of one limb and stability of the opposite limb while balancing on one leg, with the hips and torso stabilized. A cord or dowel is set at tibial-tuberosity (just below the knee) height; the client stands with feet together and slowly raises one leg over the hurdle, touching the heel to the floor beyond it, then returns. From the front, observe stance-foot stability, alignment of the stance knee over the foot, excessive hip adduction or the pelvis dropping toward the opposite side (more than about 2 inches), torso stability, and alignment of the moving leg. A dropping pelvis on the unsupported side suggests a weak gluteus medius on the stance leg. **Exam tip: In the hurdle step, a pelvis that drops toward the lifted leg indicates gluteus medius weakness on the stance side.**"}, {"h": "Shoulder push stabilization and thoracic mobility screens", "b": "The shoulder push stabilization screen examines the ability to stabilize the scapulae against the rib cage during closed-chain pushing. The client performs slow, controlled push-ups (or bent-knee push-ups) to full arm extension while the trainer observes the shoulder blades at both ends of the motion. Scapular \"winging\", the medial border lifting away from the rib cage, indicates weak scapular stabilizers such as the serratus anterior; trainers also watch for lumbar hyperextension (sagging hips). The thoracic spine mobility screen has the client sit with a block between the knees and a dowel across the chest, then rotate left and right. About 45 degrees each way is desirable; the lumbar spine contributes only about 15 degrees of rotation, so limited rotation points to the thoracic spine. **Exam tip: Scapular winging in the shoulder push screen suggests serratus anterior weakness; the target thoracic rotation is about 45 degrees each way.**"}, {"h": "Flexibility and joint-mobility tests", "b": "Several tests isolate specific muscles. The Thomas test assesses hip-flexor length: lying on a table and hugging one knee, the opposite thigh should rest flat on the table with the knee bent about 80 degrees. If the thigh lifts, the iliopsoas is tight; if the thigh is flat but the knee straightens, the rectus femoris is tight. The passive straight-leg raise assesses hamstring length, with about 80 degrees or more considered good. Shoulder flexion and extension tests check overhead mobility, often limited by tight latissimus dorsi, and Apley's scratch test checks combined shoulder motion. The sit-and-reach test measures hamstring and low-back flexibility but is affected by limb length. **Exam tip: In the Thomas test, a thigh that lifts off the table means tight iliopsoas; a knee that extends means tight rectus femoris.**"}, {"h": "Balance and core assessments", "b": "Static balance is commonly tested with the sharpened Romberg test (feet heel-to-toe, eyes closed, arms crossed, timed up to 60 seconds) and the stork-stand test (standing on one leg with the other foot against the knee, timed). Dynamic balance tests include the Y-balance and Star Excursion tests and functional tests for older adults such as the Timed Up and Go (stand from a chair, walk 3 meters, turn, return and sit); a TUG of 12 seconds or more suggests increased fall risk. Core function is assessed with McGill's torso muscular endurance tests: trunk flexor endurance, the side bridge (both sides), and trunk extensor endurance, timed holds whose ratios reveal imbalances. Balance work progresses from a wide base and eyes open to a narrow base, unstable surfaces, and eyes closed. **Exam tip: The sharpened Romberg uses a heel-to-toe stance with eyes closed; McGill's tests measure core muscular endurance with timed holds.**"}], "qs": [{"q": "During the bend-and-lift screen, the trainer should:", "o": ["Cue perfect squat technique", "Observe natural movement without cueing", "Add a barbell", "Count max reps"], "a": 1, "e": "Screens observe the client's natural pattern; coaching hides compensations."}, {"q": "A client's heels lift during the bend-and-lift screen. A likely cause is:", "o": ["Limited ankle dorsiflexion", "Strong glutes", "Excess thoracic mobility", "Weak biceps"], "a": 0, "e": "Tight calves or limited dorsiflexion often cause heels to rise."}, {"q": "A client starts each squat by driving the knees forward before the hips move. This is called:", "o": ["Glute dominance", "Quadriceps dominance", "Lumbar dominance", "Scapular winging"], "a": 1, "e": "Initiating with the knees is quadriceps dominance."}, {"q": "In the hurdle step, the pelvis drops toward the lifted leg. This suggests weakness of the:", "o": ["Stance-side gluteus medius", "Biceps", "Upper trapezius", "Rectus abdominis"], "a": 0, "e": "The stance-side gluteus medius stabilizes the pelvis in single-leg stance."}, {"q": "The hurdle step screen primarily examines:", "o": ["Upper-body pushing strength", "Mobility of one limb with stability of the other", "Aerobic capacity", "Grip strength"], "a": 1, "e": "It tests single-leg stability with contralateral hip mobility."}, {"q": "Scapular winging during the shoulder push stabilization screen suggests weakness of the:", "o": ["Serratus anterior", "Quadriceps", "Gastrocnemius", "Pectoralis major"], "a": 0, "e": "The serratus anterior holds the scapula against the rib cage."}, {"q": "In the thoracic spine mobility screen, desirable rotation is about:", "o": ["15 degrees", "45 degrees each way", "90 degrees each way", "5 degrees"], "a": 1, "e": "About 45 degrees each direction; the lumbar spine adds only about 15 degrees."}, {"q": "In the Thomas test, the client's thigh lifts off the table. This indicates tightness in the:", "o": ["Hamstrings", "Iliopsoas (hip flexors)", "Calves", "Glutes"], "a": 1, "e": "A raised thigh indicates tight hip flexors (iliopsoas)."}, {"q": "An older client takes 14 seconds on the Timed Up and Go. This suggests:", "o": ["Excellent mobility", "Increased fall risk", "Normal aerobic fitness", "High power"], "a": 1, "e": "12 seconds or more suggests increased fall risk."}, {"q": "Which test assesses static balance with a heel-to-toe stance and eyes closed?", "o": ["Sharpened Romberg", "Rockport walk", "Sit-and-reach", "Push-up test"], "a": 0, "e": "The sharpened Romberg uses a tandem stance with eyes closed."}]}, {"title": "Biomechanics & Laws of Motion", "icon": "⚙️", "cards": [{"h": "Newton's three laws of motion", "b": "Newton's first law (inertia): a body stays at rest or in uniform motion unless acted on by an external force; heavier objects have more inertia and need more force to start or stop. The second law (acceleration): force equals mass times acceleration (F = m × a), so moving a load faster or moving a heavier load requires more force. The third law (action-reaction): every action has an equal and opposite reaction; when a runner pushes back and down on the ground, the ground reaction force pushes the runner up and forward. Ground reaction forces during running reach about 2 to 3 times body weight, and jumping landings can be higher, which is why impact matters for joint-sensitive clients. **Exam tip: Pushing against the ground and being propelled forward illustrates Newton's third law (action-reaction).**"}, {"h": "Momentum, impulse, and controlled tempo", "b": "Momentum is mass times velocity. Swinging a weight uses momentum rather than muscular force, which reduces the training stimulus on the target muscle and raises the load on joints and connective tissue at the end of the range. Controlled tempo, for example about 2 seconds lifting and 2 to 4 seconds lowering, keeps tension on the muscle and reduces injury risk for most clients. Impulse is force multiplied by the time it acts; spreading a landing over a longer time (bending the hips, knees, and ankles to land softly) reduces peak force. That is why plyometric training teaches soft, quiet landings before increasing jump height. Ballistic movements deliberately use momentum and belong only in appropriately progressed power training. **Exam tip: Swinging a dumbbell uses momentum and reduces the work done by the target muscle; slow, controlled tempo keeps tension on the muscle.**"}, {"h": "Levers in the body", "b": "The body moves through lever systems made of a fulcrum (joint), a force (muscle pull), and a resistance (load). In a first-class lever the fulcrum is between force and resistance, as in nodding the head at the atlanto-occipital joint. In a second-class lever the resistance is between the fulcrum and the force, as in a calf raise, with the ball of the foot acting as the fulcrum; this gives a mechanical advantage. In a third-class lever the force is between the fulcrum and the resistance, as in a biceps curl, where the biceps insert near the elbow. Third-class levers are the most common in the body; they favor speed and range of motion over force. Lengthening the resistance arm (for example straight-arm versus bent-arm raises) makes an exercise harder. **Exam tip: Most body levers are third-class (biceps curl); a calf raise is the classic second-class lever.**"}, {"h": "Center of gravity and base of support", "b": "Stability depends on the relationship between the center of gravity (the point where body mass is balanced, normally just in front of the second sacral vertebra in standing) and the base of support (the area beneath the points of contact with the ground). A body is more stable when the base is wide, the center of gravity is low, and the line of gravity falls well inside the base. Narrowing the base (feet together, tandem stance, single leg), raising the center of gravity (arms overhead, load held high), or using an unstable surface all make balance harder. These principles explain why a sumo stance feels more stable than a narrow stance, and why carrying a load overhead is more demanding than carrying it at the waist. **Exam tip: Widen the base of support or lower the center of gravity to make an exercise easier; narrow the base or raise the center of gravity to make it harder.**"}, {"h": "Progressing and regressing exercise", "b": "ACE describes several variables for progressing or regressing an exercise. Base of support: from wide to narrow, from two legs to one, from stable to unstable. Load: body weight, then bands and dumbbells, then heavier loads. Line of pull and lever length: changing the angle of a cable or band, or moving the resistance farther from the joint. Velocity: slow and controlled before fast or explosive. Center of gravity: low before high. Complexity: single-joint to multi-joint, single-plane to multi-plane, and adding cognitive tasks. Change one variable at a time and only when the client shows control. For example, a split squat might progress to a reverse lunge, then a walking lunge, then a lunge with rotation, then a loaded lunge. **Exam tip: To regress an exercise, widen the base of support, reduce load or velocity, or simplify the movement, changing one variable at a time.**"}, {"h": "Joint mobility versus stability", "b": "Mobility is the ability of a joint to move freely through its range of motion; stability is the ability to control a joint's position or movement against force. The two must be balanced. The joint-by-joint approach describes alternating needs from the ground up: the foot needs stability, the ankle mobility, the knee stability, the hip mobility, the lumbar spine stability, the thoracic spine mobility, the scapulothoracic region stability, and the glenohumeral joint mobility. When a mobile joint becomes stiff, a neighboring stable joint often compensates with excess motion. For example, a stiff thoracic spine and hips push the lumbar spine to rotate or flex more, a common contributor to low-back pain. **Exam tip: The lumbar spine and knee need stability; the hip, ankle, and thoracic spine need mobility.**"}], "qs": [{"q": "A sprinter pushes against the starting blocks and is propelled forward. This illustrates:", "o": ["Newton's first law", "Newton's second law", "Newton's third law", "The SAID principle"], "a": 2, "e": "Action-reaction: the ground pushes back with an equal and opposite force."}, {"q": "Newton's second law is expressed as:", "o": ["F = m × a", "P = F × v", "W = F × d", "E = mc²"], "a": 0, "e": "Force equals mass times acceleration."}, {"q": "A heavy sled is hard to start moving but easier to keep moving. This reflects:", "o": ["Inertia (first law)", "Action-reaction", "Reciprocal inhibition", "Diminishing returns"], "a": 0, "e": "Objects at rest resist changes in motion: inertia."}, {"q": "A biceps curl is an example of a:", "o": ["First-class lever", "Second-class lever", "Third-class lever", "Pulley system"], "a": 2, "e": "The muscle force lies between the elbow (fulcrum) and the load."}, {"q": "A standing calf raise is an example of a:", "o": ["First-class lever", "Second-class lever", "Third-class lever", "Open-chain pulley"], "a": 1, "e": "The load lies between the fulcrum (ball of the foot) and the muscle force."}, {"q": "A client swings dumbbells during curls. The main problem is that:", "o": ["Momentum reduces the work done by the target muscle", "It builds more strength", "It lowers joint stress", "It slows the tempo"], "a": 0, "e": "Momentum substitutes for muscular force and stresses joints."}, {"q": "Which change makes a balance exercise EASIER?", "o": ["Narrowing the stance", "Raising the arms overhead", "Widening the base of support", "Closing the eyes"], "a": 2, "e": "A wider base of support increases stability."}, {"q": "Landing softly by bending the hips, knees, and ankles reduces peak force because it:", "o": ["Increases the time over which force is absorbed", "Increases body mass", "Decreases muscle strength", "Changes gravity"], "a": 0, "e": "Spreading the impulse over more time lowers peak force."}, {"q": "According to the joint-by-joint approach, which joint primarily needs stability?", "o": ["Hip", "Thoracic spine", "Lumbar spine", "Ankle"], "a": 2, "e": "The lumbar spine needs stability; the hip and thoracic spine need mobility."}, {"q": "A client cannot control a walking lunge. The BEST regression is a:", "o": ["Walking lunge with a barbell", "Split squat holding a support", "Jumping lunge", "Lunge on a balance pad"], "a": 1, "e": "A stationary split squat with support widens the base and reduces complexity."}]}, {"title": "Flexibility, Warm-up & Recovery", "icon": "🧘", "cards": [{"h": "Flexibility and its determinants", "b": "Flexibility is the range of motion available at a joint or series of joints. It depends on joint structure, the extensibility of muscles, tendons, ligaments, and fascia, neural factors such as stretch tolerance, and individual factors such as age, sex (women are typically more flexible), temperature, and activity level. Tissues are more extensible when warm, which is why stretching after a warm-up or at the end of a workout is most effective. Flexibility is specific to each joint: someone can be very flexible at the hips and tight at the shoulders. Hypermobility (excessive range) can be as problematic as stiffness because it reduces joint stability. Mobility is a broader term that includes flexibility plus the strength and control to use that range. **Exam tip: Flexibility is joint-specific and improves most when tissues are warm, so stretch after a warm-up or after the workout.**"}, {"h": "ACSM stretching guidelines", "b": "ACSM recommends flexibility exercises for each major muscle-tendon group at least 2 to 3 days per week, with daily stretching most effective. Stretch to the point of feeling tightness or slight discomfort, not pain. Hold static stretches for 10 to 30 seconds for most adults; older adults may benefit from 30 to 60 seconds. Accumulate about 60 seconds of total stretching per muscle group, for example 2 to 4 repetitions. For PNF stretching, use a 3 to 6 second contraction at 20 to 75 percent of maximal effort, followed by a 10 to 30 second assisted stretch. Static, dynamic, ballistic, and PNF methods can all improve range of motion, but ballistic stretching is recommended mainly for athletes whose sports involve ballistic movements. **Exam tip: Hold static stretches 10 to 30 seconds (30 to 60 for older adults), totaling about 60 seconds per muscle group, 2 to 3 or more days per week.**"}, {"h": "Types of stretching", "b": "Static stretching moves a muscle to its end range and holds it; it can be active (holding the position with the opposing muscle) or passive (using gravity, a strap, or a partner). Dynamic stretching moves joints through their full range in a controlled, sport- or workout-specific way, such as walking lunges or leg swings, and is preferred in warm-ups. Ballistic stretching uses bouncing momentum to push beyond normal range; it can trigger the stretch reflex and is generally avoided for general clients. Active isolated stretching holds each stretch for about 2 seconds, repeated in sets, using the opposing muscle to move the joint. Prolonged static stretching (over about 60 seconds per muscle) immediately before power activities may temporarily reduce strength and power. **Exam tip: Ballistic stretching uses bouncing and is generally not recommended for general fitness clients; dynamic stretching is the warm-up choice.**"}, {"h": "Proprioceptive neuromuscular facilitation (PNF)", "b": "PNF stretching combines passive stretching with muscle contractions to exploit two neural reflexes. Autogenic inhibition: a strong contraction of the target muscle stimulates the Golgi tendon organs, which inhibit that muscle and let it relax into a deeper stretch. Reciprocal inhibition: contracting the opposing (agonist) muscle causes the target (antagonist) muscle to relax. In ACE's textbook descriptions, all three techniques start with a 10-second passive pre-stretch. Hold-relax uses a 6-second isometric contraction of the target muscle, then a 30-second passive stretch. Contract-relax uses a concentric contraction of the target muscle through its range, then a 30-second passive stretch. Hold-relax with agonist contraction adds a contraction of the opposing muscle during the final stretch, using both reflexes, so it is considered the most effective. **Exam tip: Golgi tendon organs mediate autogenic inhibition; contracting the opposing muscle uses reciprocal inhibition. Hold-relax with agonist contraction uses both.**"}, {"h": "Muscle spindles, Golgi tendon organs, and myofascial release", "b": "Two sensory receptors govern stretching. Muscle spindles sit within the muscle belly and detect changes in length and the speed of change; a rapid stretch triggers the stretch (myotatic) reflex, causing the muscle to contract, which is why bouncing stretches are counterproductive. Golgi tendon organs sit at the muscle-tendon junction and detect tension; sustained tension causes autogenic inhibition, relaxing the muscle. Self-myofascial release (SMR) with foam rollers or balls applies sustained pressure to tender areas of muscle and fascia. Holding pressure on a tender spot for about 30 to 60 seconds, or rolling slowly, can reduce perceived tightness and temporarily improve range of motion. SMR is typically used before stretching in warm-ups or in recovery, avoiding bony areas, joints, and acute injuries. **Exam tip: Muscle spindles sense length and speed of stretch (stretch reflex); Golgi tendon organs sense tension (autogenic inhibition).**"}, {"h": "Warm-up, cool-down, and recovery", "b": "A structured warm-up of 5 to 10 minutes raises core and muscle temperature, increases blood flow and nerve-conduction speed, and rehearses the session's movements; ACE often calls this movement preparation. It begins with light cardio and progresses to dynamic movements and activation drills that resemble the workout. The cool-down gradually lowers intensity so that heart rate and blood pressure return toward resting levels; static stretching and SMR fit here. Recovery between sessions includes adequate sleep (adults need about 7 or more hours per night), nutrition and hydration, and active recovery such as easy walking or cycling, which can reduce soreness. Training should alternate hard and easy days to allow adaptation. **Exam tip: Warm-ups use dynamic movement preparation; static stretching and foam rolling fit best in the cool-down or recovery.**"}], "qs": [{"q": "ACSM recommends holding static stretches for most adults for:", "o": ["1-5 seconds", "10-30 seconds", "2-3 minutes", "5 minutes"], "a": 1, "e": "10 to 30 seconds for most adults; 30 to 60 seconds may benefit older adults."}, {"q": "A recommended total stretching time per muscle group per session is about:", "o": ["10 seconds", "60 seconds", "5 minutes", "15 minutes"], "a": 1, "e": "About 60 seconds total per muscle group, e.g., 2 to 4 repetitions."}, {"q": "Which receptor detects changes in muscle length and triggers the stretch reflex?", "o": ["Golgi tendon organ", "Muscle spindle", "Baroreceptor", "Pacinian corpuscle"], "a": 1, "e": "Muscle spindles sense length and speed of stretch."}, {"q": "Relaxation of a muscle after it contracts strongly, mediated by Golgi tendon organs, is called:", "o": ["Reciprocal inhibition", "Autogenic inhibition", "Stretch reflex", "Co-contraction"], "a": 1, "e": "GTOs cause autogenic inhibition of the contracting muscle."}, {"q": "Contracting the quadriceps to help the hamstrings relax during a stretch uses:", "o": ["Autogenic inhibition", "Reciprocal inhibition", "The stretch reflex", "Momentum"], "a": 1, "e": "Contracting the agonist relaxes the antagonist: reciprocal inhibition."}, {"q": "Which PNF technique is considered most effective because it uses both inhibitory reflexes?", "o": ["Static stretch", "Contract-relax", "Hold-relax with agonist contraction", "Ballistic stretch"], "a": 2, "e": "It combines autogenic and reciprocal inhibition."}, {"q": "Which stretching type is generally NOT recommended for general fitness clients?", "o": ["Static", "Dynamic", "Ballistic", "PNF with a trained professional"], "a": 2, "e": "Ballistic bouncing can trigger the stretch reflex and increase injury risk."}, {"q": "A client is about to perform maximal jumps. Which pre-activity routine is best?", "o": ["Long static holds of 90 seconds per muscle", "Dynamic warm-up", "No warm-up", "Ballistic bouncing"], "a": 1, "e": "Prolonged static stretching may temporarily reduce power; dynamic warm-ups are preferred."}, {"q": "How long is pressure typically held on a tender spot during self-myofascial release?", "o": ["2-3 seconds", "30-60 seconds", "10 minutes", "Until pain is severe"], "a": 1, "e": "About 30 to 60 seconds of sustained pressure."}, {"q": "Flexibility gains are greatest when stretching:", "o": ["Cold, before any activity", "After tissues are warmed", "Only in the morning", "With bouncing"], "a": 1, "e": "Warm tissues are more extensible."}]}, {"title": "Core, Balance, Power & Agility", "icon": "⚡", "cards": [{"h": "Core function and progression", "b": "The core includes the deep stabilizers (transverse abdominis, multifidi, pelvic floor, diaphragm) and the larger movers (rectus abdominis, obliques, erector spinae, glutes). Its main jobs are to stabilize the spine and transfer force between the upper and lower body. ACE progresses core training fr
